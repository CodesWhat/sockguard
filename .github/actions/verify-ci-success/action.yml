name: "Verify CI Success"
description: "Poll the CI verification workflow for a successful run on the given SHA."

inputs:
  workflow-file:
    description: "CI workflow filename (e.g. ci-verify.yml)"
    required: true
  target-sha:
    description: "Git SHA to check for a successful CI run"
    required: true
  max-attempts:
    description: "Maximum polling attempts (15s apart)"
    required: false
    default: "40"
  max-wait-seconds:
    description: "Total wall-clock budget for the polling loop in seconds; polling stops at this deadline or after max-attempts, whichever comes first. Keep it under the calling job's timeout-minutes."
    required: false
    default: "900"
  github-token:
    description: "GitHub token for API access"
    required: true

runs:
  using: "composite"
  steps:
    - name: Resolve CI workflow reference
      id: ci_workflow
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CI_VERIFY_WORKFLOW_FILE: ${{ inputs.workflow-file }}
        MAX_WAIT_SECONDS: ${{ inputs.max-wait-seconds }}
      run: |
        set -euo pipefail

        # The resolve request gets the same wall-clock budget as the wait loop,
        # so its retries can't outlast the calling job's timeout either.
        deadline=$(( $(date +%s) + MAX_WAIT_SECONDS ))
        remaining=$(( deadline - $(date +%s) ))
        if [ "${remaining}" -le 0 ]; then
          echo "::error::No time budget left to resolve ${CI_VERIFY_WORKFLOW_FILE} (max-wait-seconds=${MAX_WAIT_SECONDS})."
          exit 1
        fi
        request_max_time=$(( remaining < 30 ? remaining : 30 ))

        workflow_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_VERIFY_WORKFLOW_FILE}"
        if ! workflow_json="$(timeout --signal=KILL "${remaining}s" curl -fsSL --max-time "${request_max_time}" \
          --retry 5 --retry-delay 5 --retry-max-time "${remaining}" --retry-connrefused --retry-all-errors \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "${workflow_url}")"; then
          echo "::error::Failed to resolve ${CI_VERIFY_WORKFLOW_FILE} within the ${remaining}s remaining budget."
          exit 1
        fi

        workflow_id="$(echo "${workflow_json}" | jq -r '.id // empty')"
        workflow_name="$(echo "${workflow_json}" | jq -r '.name // empty')"
        workflow_path="$(echo "${workflow_json}" | jq -r '.path // empty')"
        if [ -z "${workflow_id}" ] || [ -z "${workflow_path}" ]; then
          echo "::error::Failed to resolve workflow metadata for ${CI_VERIFY_WORKFLOW_FILE}."
          exit 1
        fi

        {
          echo "id=${workflow_id}"
          echo "name=${workflow_name}"
          echo "path=${workflow_path}"
        } >> "$GITHUB_OUTPUT"
        echo "Using CI verification workflow: ${workflow_name} (${workflow_path}, id=${workflow_id})"

    - name: Wait for successful branch CI on target SHA
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CI_WORKFLOW_ID: ${{ steps.ci_workflow.outputs.id }}
        CI_WORKFLOW_NAME: ${{ steps.ci_workflow.outputs.name }}
        TARGET_SHA: ${{ inputs.target-sha }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        MAX_WAIT_SECONDS: ${{ inputs.max-wait-seconds }}
      run: |
        set -euo pipefail

        sleep_seconds=15
        deadline=$(( $(date +%s) + MAX_WAIT_SECONDS ))

        for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
          # Budget left before this request. Every curl, its retries and the
          # sleep below are held to it, so the deadline can't be overrun by
          # a poll that starts just before it.
          remaining=$(( deadline - $(date +%s) ))
          if [ "${remaining}" -le 0 ]; then
            echo "::error::Timed out waiting for successful ${CI_WORKFLOW_NAME} branch push run on ${TARGET_SHA} after ${MAX_WAIT_SECONDS}s (${MAX_WAIT_SECONDS}s wall-clock budget, stopped before attempt ${attempt}/${MAX_ATTEMPTS}). Check ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW_ID} for a run against ${TARGET_SHA} -- if one completed successfully shortly after this timeout, the max-wait-seconds budget for this caller is too tight."
            exit 1
          fi
          runs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW_ID}/runs?head_sha=${TARGET_SHA}&event=push&per_page=50"
          request_max_time=$(( remaining < 30 ? remaining : 30 ))
          if ! runs_json="$(timeout --signal=KILL "${remaining}s" curl -fsSL --max-time "${request_max_time}" \
            --retry 5 --retry-delay 5 --retry-max-time "${remaining}" --retry-connrefused --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${runs_url}")"; then
            echo "::error::Timed out or failed querying ${CI_WORKFLOW_NAME} branch CI within the ${remaining}s remaining budget."
            exit 1
          fi

          success_count="$(echo "${runs_json}" | jq '[.workflow_runs[] | select(.conclusion == "success" and ((.head_branch // "") | length > 0))] | length')"
          noncompleted_count="$(echo "${runs_json}" | jq '[.workflow_runs[] | select(.status != "completed" and ((.head_branch // "") | length > 0))] | length')"
          completed_count="$(echo "${runs_json}" | jq '[.workflow_runs[] | select(.status == "completed" and ((.head_branch // "") | length > 0))] | length')"

          if [ "${success_count}" -gt 0 ]; then
            echo "Found successful ${CI_WORKFLOW_NAME} push run for ${TARGET_SHA}."
            exit 0
          fi

          if [ "${completed_count}" -gt 0 ] && [ "${noncompleted_count}" -eq 0 ]; then
            echo "::error::${CI_WORKFLOW_NAME} branch push runs for ${TARGET_SHA} completed without success."
            echo "${runs_json}" | jq '.workflow_runs[] | select((.head_branch // "") | length > 0) | {id, status, conclusion, head_branch, html_url}'
            exit 1
          fi

          # `noncompleted_count` is `status != "completed"`, which covers
          # queued/waiting/requested as well as in_progress -- so this says
          # "not finished" rather than "running", which would be a claim the
          # count doesn't actually support.
          if [ "${noncompleted_count}" -gt 0 ]; then
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: ${CI_WORKFLOW_NAME} branch push run on ${TARGET_SHA} has not completed yet, waiting for it to finish..."
          else
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: no ${CI_WORKFLOW_NAME} branch push run recorded yet for ${TARGET_SHA}, waiting for one to start..."
          fi
          remaining=$(( deadline - $(date +%s) ))
          if [ "${remaining}" -le 0 ]; then
            continue
          fi
          sleep "$(( remaining < sleep_seconds ? remaining : sleep_seconds ))"
        done

        echo "::error::Timed out waiting for successful ${CI_WORKFLOW_NAME} branch push run on ${TARGET_SHA} after ${MAX_ATTEMPTS} attempts. Check ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW_ID} for a run against ${TARGET_SHA} -- if one completed successfully shortly after this timeout, the max-attempts budget for this caller is too tight."
        exit 1
