name: "✅ CI: Verify"
run-name: >-
  ${{
    github.event_name == 'schedule' && '✅ CI: Verify — Weekly schedule' ||
    github.event_name == 'pull_request' && format('✅ CI: Verify — PR #{0}', github.event.pull_request.number) ||
    format('✅ CI: Verify — {0}', github.ref_name)
  }}

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'dev/*']
  merge_group:
  schedule:
    - cron: '30 6 * * 1'  # Weekly on Monday at 06:30 UTC

concurrency:
  group: ci-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reusable-workflow callers (CodesWhat/.github frozen SHA). Each job below
  # runs the caller repo's own scripts/ci/*.sh so the underlying commands
  # stay identical to what branch CI ran before this migration; only the
  # orchestration moved to the shared org workflow.
  #
  # Reusable check runs report as "<caller job name> / <called job name>"
  # (e.g. "Go CI / Go Lint"). The X1 canary promoted and the main
  # branch-protection ruleset now requires those reusable contexts directly,
  # so the temporary "legacy-*" bridge jobs that mirrored the old plain
  # context names have been removed.
  go-ci:
    name: "Go CI"
    # go-ci.yml's nested codeql job declares security-events: write even
    # though run-codeql stays unset here — GitHub validates a called
    # workflow's job-level permissions statically, regardless of if:
    # gating, so the caller must still grant it.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: CodesWhat/.github/.github/workflows/go-ci.yml@01bf40b06b110946f12a49b82e407d77c6480df7
    with:
      module-directory: app
      go-version-file: go.mod
      go-cache-dependency-path: go.sum
      lint-check-name: Go Lint
      test-check-name: Go Test
      run-workflow-security: true
      run-goreleaser: ${{ github.event_name != 'schedule' }}
      fuzzers-json: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[{"name":"FuzzPathMatch","pkg":"./internal/filter/"},{"name":"FuzzGlobToRegex","pkg":"./internal/filter/"},{"name":"FuzzGlobToRegexString","pkg":"./internal/filter/"},{"name":"FuzzNormalizePath","pkg":"./internal/filter/"},{"name":"FuzzCompileRule","pkg":"./internal/filter/"},{"name":"FuzzBuild","pkg":"./internal/filter/"},{"name":"FuzzContainerCreate","pkg":"./internal/filter/"},{"name":"FuzzExec","pkg":"./internal/filter/"},{"name":"FuzzImagePull","pkg":"./internal/filter/"},{"name":"FuzzVolume","pkg":"./internal/filter/"},{"name":"FuzzSecret","pkg":"./internal/filter/"},{"name":"FuzzConfigWrite","pkg":"./internal/filter/"},{"name":"FuzzService","pkg":"./internal/filter/"},{"name":"FuzzSwarm","pkg":"./internal/filter/"},{"name":"FuzzPlugin","pkg":"./internal/filter/"},{"name":"FuzzNetwork","pkg":"./internal/filter/"},{"name":"FuzzReadUnaryGRPCMessage","pkg":"./internal/buildkitproxy/"},{"name":"FuzzEvaluateGetSecretRequest","pkg":"./internal/buildkitproxy/"},{"name":"FuzzEvaluateSolveRequest","pkg":"./internal/buildkitproxy/"},{"name":"FuzzEvaluateStatusRequest","pkg":"./internal/buildkitproxy/"},{"name":"FuzzRewriteSessionAdvertisement","pkg":"./internal/buildkitproxy/"},{"name":"FuzzValidateUpgradeRequest","pkg":"./internal/buildkitproxy/"},{"name":"FuzzDecode","pkg":"./internal/dockerfilters/"},{"name":"FuzzProxyHeadersAndBody","pkg":"./internal/proxy/"},{"name":"FuzzHijackHeadersAndBody","pkg":"./internal/proxy/"},{"name":"FuzzPathRoutingDifferential","pkg":"./differential/"},{"name":"FuzzVisibilityFilter","pkg":"./internal/visibility/"},{"name":"FuzzLibpodPathIdentifiers","pkg":"./internal/visibility/"}]' || '[]' }}

  node-ci:
    name: "Node CI"
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    uses: CodesWhat/.github/.github/workflows/node-ci.yml@01bf40b06b110946f12a49b82e407d77c6480df7
    with:
      node-version: 24
      lockfile-path: package-lock.json
      lint-check-name: Biome Lint
      test-check-name: TS Test
      build-check-name: Build Workspaces
      run-lint: true
      run-test: true
      run-build: true

  codeql:
    name: "CodeQL Analysis"
    # CodeQL SARIF upload requires GitHub Advanced Security (GHAS), which is not
    # available on free private repos. Skip unless the repo is public.
    if: github.event.repository.visibility == 'public' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          languages: actions, go, javascript-typescript
          queries: security-and-quality

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Go
        run: go build ./...
        working-directory: app

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3

  dependency-review:
    name: "Dependency Review"
    # Dependency Review requires GitHub Advanced Security on private repos.
    # Gated on public visibility so it auto-activates when the repo goes public.
    # The repository Dependency Graph setting was enabled 2026-08-17, so this
    # job now actually runs on every PR (sockguard#271 item 1).
    if: ${{ github.event.repository.visibility == 'public' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0

  gitleaks:
    name: "Gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # gitleaks/gitleaks-action requires a paid GITLEAKS_LICENSE for org-owned
    # repos (CodesWhat is an org), so this job runs the free, MIT-licensed
    # gitleaks CLI directly instead. To bump: pick the new release's
    # linux_x64 tarball sha256 from
    # https://github.com/gitleaks/gitleaks/releases/download/vX.Y.Z/gitleaks_X.Y.Z_checksums.txt
    # and update both env values together.
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans full history, not just the checked-out ref
          persist-credentials: false

      - name: Download gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks

      - name: Scan for committed secrets
        run: ./gitleaks detect --source . --no-banner --redact -v

  actionlint:
    name: "Actionlint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflow files
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

  commit-message:
    name: "💬 Commit Message"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # advisory — does not block merge

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Only inspects commits introduced by this PR (base branch..HEAD) —
          # never warns about legacy emoji commits already on the base branch,
          # including dev-branch commits that haven't been synced to main yet.
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          pattern="^(${types})(\\(\\w[\\w-]*\\))?!?:\\s.+\$"

          failed=0
          while IFS= read -r msg; do
            first_line="$(echo "${msg}" | head -n1)"
            # Merge, revert, and fixup!/squash! autosquash commits are exempt.
            if echo "${first_line}" | grep -qP '^(Merge |Revert |fixup! |squash! )'; then
              continue
            fi
            if ! echo "${first_line}" | grep -qP "${pattern}"; then
              echo "::warning::Non-conventional commit: ${first_line}"
              failed=1
            fi
          done < <(git log --format=%s "origin/${BASE_REF}..HEAD")

          if [ "${failed}" -eq 1 ]; then
            echo "::warning::Some commits don't follow Conventional Commits format. Expected: <type>(scope): description — no emoji. Allowed types: ${types//|/, }"
          fi

  docker:
    name: "Docker Build"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # Single-arch build to verify Dockerfile builds correctly.
      # Multi-arch (amd64 + arm64) is handled by the release workflow.
      - name: Build (single-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: sockguard:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Grype gates the image this job just built — the gating-posture rule is
      # that Grype gates wherever the PR pipeline actually builds the artifact
      # it scans, and "Docker Build" (this job) is that place for sockguard.
      # security-grype.yml's own grype-image job stays scheduled/manual-only
      # (it already skips pull_request via its job-level `if:`) so the image
      # isn't scanned twice per PR.
      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        id: grype
        with:
          image: sockguard:ci
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload Grype SARIF to code scanning
        # Code scanning uploads require GHAS, not available on free private repos.
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image

      - name: Verify fresh socket-volume startup
        shell: bash
        run: |
          set -euo pipefail

          runtime_volume="sockguard-ci-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runtime_container="sockguard-ci-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          socket_gid="$(stat -c '%g' /var/run/docker.sock)"

          cleanup() {
            docker rm -f "${runtime_container}" >/dev/null 2>&1 || true
            docker volume rm "${runtime_volume}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "${runtime_volume}" >/dev/null
          docker run --detach \
            --name "${runtime_container}" \
            --group-add "${socket_gid}" \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume "${runtime_volume}:/var/run/sockguard" \
            --env SOCKGUARD_LISTEN_SOCKET=/var/run/sockguard/sockguard.sock \
            sockguard:ci >/dev/null

          if timeout 2 docker wait "${runtime_container}" >/dev/null; then
            docker logs "${runtime_container}"
            echo "::error::Sockguard exited while initializing a fresh named socket volume"
            exit 1
          fi

          test "$(docker inspect --format '{{.State.Running}}' "${runtime_container}")" = "true"

          runtime_mountpoint="$(docker volume inspect --format '{{.Mountpoint}}' "${runtime_volume}")"
          runtime_socket="${runtime_mountpoint}/sockguard.sock"
          sudo test -S "${runtime_socket}"
          test "$(sudo stat -c '%u:%g %a' "${runtime_socket}")" = "65532:65532 600"
          test "$(sudo curl --fail --silent --show-error \
            --unix-socket "${runtime_socket}" http://localhost/_ping)" = "OK"
