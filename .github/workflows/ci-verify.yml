name: "CI: Verify"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'CI: Verify — Weekly schedule' ||
    github.event_name == 'pull_request' && format('CI: Verify — PR #{0}', github.event.pull_request.number) ||
    format('CI: Verify — {0}', github.ref_name)
  }}

on:
  push:
    branches: [main, 'dev/*', 'maintenance/*', 'release/*']
  pull_request:
    branches: [main, 'dev/*', 'maintenance/*']
  merge_group:
  schedule:
    - cron: '30 6 * * 1'  # Weekly on Monday at 06:30 UTC

concurrency:
  group: ci-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only PRs used to run the whole matrix. Measured on #438, a
  # CHANGELOG.md-only PR: 43 jobs and 90 runner-minutes in this workflow
  # alone, 29 jobs and 67 of those minutes in the fuzz matrix. With five PRs
  # open against the org's 20-concurrent-job ceiling, that queue is what
  # every other PR waits behind.
  #
  # The scoping cannot live on `on.pull_request.paths`: a required status
  # check inside a workflow that never triggers produces NO check run at
  # all, so branch protection has nothing to mark green and blocks the PR
  # forever. A job that *skips* inside a workflow that *did* trigger reports
  # `skipped`, which satisfies the ruleset. So the scoping is a gate job and
  # the heavy jobs `if:` on its output — the same shape, for the same
  # reason, as security-grype.yml's "Security: Changed Paths".
  changes:
    name: "Changed Paths"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      # Audit mode: block mode intermittently refused allow-listed hosts on hosted runners (DEP-19). Release workflows keep block.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # need base-branch history to diff a PR against it

      - name: Determine whether the diff is documentation only
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          # Deliberately no `-e`: every failure path below must fail OPEN
          # (docs_only=false, so everything runs) rather than abort the job
          # and silently skip a build gate with no clear reason why.

          # Only a PR has a base to diff against. Pushes to a dev branch,
          # merge_group and the weekly schedule always run everything.
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --quiet origin "${BASE_REF}"; then
            echo "::warning::changes: could not fetch origin/${BASE_REF} — failing open, running every job"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"; then
            echo "::warning::changes: git diff against origin/${BASE_REF} failed — failing open, running every job"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${changed}" ]; then
            echo "::warning::changes: empty diff against origin/${BASE_REF} — failing open, running every job"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "${changed}" | sed 's/^/  /'

          # The docs-only predicate itself (which paths the gated jobs
          # provably do not consume — "Docker Build" reads the Dockerfile
          # plus go.mod/go.sum/app/, the fuzz matrix reads app/ Go source and
          # its corpora) lives in scripts/docs-only-paths.mjs, with its own
          # regression coverage in scripts/docs-only-paths.test.mjs, rather
          # than inline here. Capture its stdout before touching
          # GITHUB_OUTPUT so a script failure can't leave a partial or
          # duplicate docs_only line behind.
          if node_out="$(printf '%s\n' "${changed}" | node scripts/docs-only-paths.mjs)"; then
            echo "${node_out}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::changes: docs-only-paths.mjs failed — failing open, running every job"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Reusable-workflow callers (CodesWhat/.github frozen SHA). Each job below
  # runs the caller repo's own scripts/ci/*.sh so the underlying commands
  # stay identical to what branch CI ran before this migration; only the
  # orchestration moved to the shared org workflow.
  #
  # Reusable check runs report as "<caller job name> / <called job name>"
  # (e.g. "Go CI / Go Lint"). The X1 canary promoted and the main
  # branch-protection ruleset now requires those reusable contexts directly,
  # so the temporary "legacy-*" bridge jobs that mirrored the old plain
  # context names have been removed.
  go-ci:
    name: "Go CI"
    needs: changes
    # `!cancelled()` rather than the implicit success() gate `needs:` adds.
    # "Go CI / Go Lint" and "Go CI / Go Test" are required contexts, and a
    # skipped required context satisfies the ruleset — so if the gate job
    # ever failed, the default gate would turn this whole call into an
    # auto-passing skip and let a PR merge with no Go lint or tests at all.
    # Under `!cancelled()` a failed gate leaves docs_only empty instead,
    # which fails open into the full fuzz list below.
    if: ${{ !cancelled() }}
    # go-ci.yml's nested codeql job declares security-events: write even
    # though run-codeql stays unset here — GitHub validates a called
    # workflow's job-level permissions statically, regardless of if:
    # gating, so the caller must still grant it.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: CodesWhat/.github/.github/workflows/go-ci.yml@5094cf2f723fe22303b8944658e972bc9ec898a6  # main, 2026-10-31 (CodesWhat/.github#56)
    with:
      module-directory: app
      go-version-file: go.mod
      go-cache-dependency-path: go.sum
      lint-check-name: Go Lint
      test-check-name: Go Test
      # The pinned shared scanner exposes no sudo/container-disable input.
      # Its read-only/offline exception is source-bound in the security docs
      # and scripts/testdata/shared-workflow-security.json.
      run-workflow-security: true
      # Audit mode: block mode intermittently refused allow-listed hosts on hosted runners (DEP-19). Release workflows keep block.
      workflow-security-egress-policy: audit
      run-goreleaser: ${{ github.event_name != 'schedule' }}
      # Repository-run Qlty gate ("Go CI / Qlty Check"), which needs no Qlty
      # Cloud account. Distinct from the Qlty Cloud GitHub App's own statuses
      # (`qlty check`, `qlty coverage`, `qlty coverage diff`), which fail
      # org-wide on billing minutes and are never required contexts. Skipped on
      # the weekly schedule alongside GoReleaser, matching portwing.
      run-qlty: ${{ github.event_name != 'schedule' }}
      # Audit mode: block mode intermittently refused allow-listed hosts on hosted runners (DEP-19). Release workflows keep block.
      qlty-egress-policy: audit
      # An empty list produces no matrix jobs at all: go-ci.yml's fuzz job
      # is gated on `fromJSON(inputs.fuzzers-json)[0] != null`. On a
      # docs-only PR that is 29 jobs and ~67 runner-minutes not spent
      # fuzzing Go code the PR did not touch. None of these is a required
      # context, so nothing to report skipped-green here.
      fuzzers-json: >-
        ${{ needs.changes.outputs.docs_only != 'true' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[{"name":"FuzzPathMatch","pkg":"./internal/filter/"},{"name":"FuzzGlobToRegex","pkg":"./internal/filter/"},{"name":"FuzzGlobToRegexString","pkg":"./internal/filter/"},{"name":"FuzzNormalizePath","pkg":"./internal/filter/"},{"name":"FuzzCompileRule","pkg":"./internal/filter/"},{"name":"FuzzBuild","pkg":"./internal/filter/"},{"name":"FuzzContainerCreate","pkg":"./internal/filter/"},{"name":"FuzzExec","pkg":"./internal/filter/"},{"name":"FuzzImagePull","pkg":"./internal/filter/"},{"name":"FuzzVolume","pkg":"./internal/filter/"},{"name":"FuzzSecret","pkg":"./internal/filter/"},{"name":"FuzzConfigWrite","pkg":"./internal/filter/"},{"name":"FuzzService","pkg":"./internal/filter/"},{"name":"FuzzSwarm","pkg":"./internal/filter/"},{"name":"FuzzPlugin","pkg":"./internal/filter/"},{"name":"FuzzNetwork","pkg":"./internal/filter/"},{"name":"FuzzReadUnaryGRPCMessage","pkg":"./internal/buildkitproxy/"},{"name":"FuzzControlRefFrame","pkg":"./internal/buildkitproxy/"},{"name":"FuzzEvaluateGatewayRequest","pkg":"./internal/buildkitproxy/"},{"name":"FuzzFilterGatewayPong","pkg":"./internal/buildkitproxy/"},{"name":"FuzzEvaluateGetSecretRequest","pkg":"./internal/buildkitproxy/"},{"name":"FuzzEvaluateSolveRequest","pkg":"./internal/buildkitproxy/"},{"name":"FuzzEvaluateStatusRequest","pkg":"./internal/buildkitproxy/"},{"name":"FuzzRewriteSessionAdvertisement","pkg":"./internal/buildkitproxy/"},{"name":"FuzzValidateUpgradeRequest","pkg":"./internal/buildkitproxy/"},{"name":"FuzzFilterControlResponseMessage","pkg":"./internal/buildkitproxy/"},{"name":"FuzzDecode","pkg":"./internal/dockerfilters/"},{"name":"FuzzProxyHeadersAndBody","pkg":"./internal/proxy/"},{"name":"FuzzHijackHeadersAndBody","pkg":"./internal/proxy/"},{"name":"FuzzPathRoutingDifferential","pkg":"./internal/differential/"},{"name":"FuzzVisibilityFilter","pkg":"./internal/visibility/"},{"name":"FuzzLibpodPathIdentifiers","pkg":"./internal/visibility/"}]' || '[]' }}

  # Coverage reporting split (Scott, 2026-11-02): Codecov reports coverage, Qlty
  # Cloud grades maintainability. This job only reports. The vendor-free
  # production coverage floor in scripts/ci/go-test.sh (COVERAGE_MIN) stays the
  # gate, so a Codecov hiccup never flakes a required context. It reads the
  # coverage.prod.txt profile the reusable Go test job already uploads in the
  # go-test-<run>-<attempt> artifact, so shipping code is measured and the
  # generated buildkitproto and test-only packages are not.
  codecov:
    name: "Coverage: Codecov Upload"
    needs: [changes, go-ci]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      # Audit mode: block mode intermittently refused allow-listed hosts on hosted runners (DEP-19). Release workflows keep block.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Go coverage artifact
        id: coverage-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/resolve-go-coverage.sh
        continue-on-error: true

      - name: Download Go test artifacts
        id: coverage-download
        if: steps.coverage-artifact.outcome == 'success'
        # Resolve the actual producer attempt when only downstream jobs rerun.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ steps.coverage-artifact.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/go-test
        continue-on-error: true

      - name: Validate Go coverage profile
        id: coverage-profile
        if: steps.coverage-download.outcome == 'success'
        run: |
          if [ ! -s artifacts/go-test/coverage.prod.txt ]; then
            echo "::error::Go coverage profile is missing or empty; Codecov upload skipped."
            exit 1
          fi
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: steps.coverage-profile.outcome == 'success'
        # Tokenless OIDC upload: no Codecov credential to store or rotate, and
        # skipped implicitly on fork PRs (no id-token grant). Non-gating by
        # design.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/go-test/coverage.prod.txt
          # Search would also find the unfiltered coverage.txt and report it
          # against the production floor.
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
        continue-on-error: true

  reproducible-build:
    name: "Reproducible Build (${{ matrix.goos }}/${{ matrix.goarch }})"
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Compare independent builds
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: bash scripts/ci/go-reproducible.sh

  # Decodes the response filter's redacted output into the real Docker client
  # types (moby/api and docker/docker). app/compat is its own module so those
  # libraries never join the proxy's dependency graph. Deliberately not gated
  # on `changes`: a docs-only PR runs it in about a minute, and a job that
  # always reports can be made a required context later (a skipped job also
  # satisfies the ruleset, but this one has no reason to skip).
  client-compat:
    name: "Client Compat (real Docker types)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: app/compat/go.sum

      # -mod=readonly below fails with an opaque "updates to go.mod needed"
      # when the root module moves (Renovate bumps it) and this nested module
      # lags. Check drift first so the failure names the fix.
      - name: Check app/compat go.mod is tidy
        working-directory: app/compat
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error file=app/compat/go.mod::app/compat is out of sync with the root module. Run 'go mod tidy' in app/compat and commit go.mod and go.sum."
            exit 1
          fi

      - name: Decode redacted responses into client types
        working-directory: app/compat
        env:
          GOFLAGS: -mod=readonly
        run: go test -count=1 ./...

  node-ci:
    name: "Node CI"
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    uses: CodesWhat/.github/.github/workflows/node-ci.yml@5094cf2f723fe22303b8944658e972bc9ec898a6  # main, 2026-10-31 (CodesWhat/.github#56)
    with:
      node-version: 24
      lockfile-path: package-lock.json
      lint-check-name: Biome Lint
      test-check-name: TS Test
      build-check-name: Build Workspaces
      run-lint: true
      run-test: true
      run-build: true

  website-browser:
    name: "Website Browser Checks"
    needs: changes
    # Not gated on docs_only, unlike go-ci and docker: the suite drives the
    # built docs export as well as the marketing site, and a docs-only diff
    # (an .mdx edit, a docs/ component) is exactly what can break those
    # pages. node-ci's Build Workspaces runs on every PR for the same reason.
    # `!cancelled()` keeps the job running if the gate job itself fails, and
    # the job reports a real status (never a missing check) on every PR, so
    # it can be made a required context without the path-filter deadlock.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # Audit mode without disable-sudo: `playwright install --with-deps`
      # apt-installs the system libraries Firefox and WebKit need, which takes
      # sudo and reaches the Ubuntu archive plus Playwright's CDN.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      # Browser binaries only; the apt libraries below are not cacheable.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers and system libraries
        working-directory: website
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser checks (Chromium, Firefox, WebKit)
        working-directory: website
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            website/playwright-report/
            website/test-results/
          retention-days: 7
          if-no-files-found: ignore

  shellcheck:
    name: "Shellcheck"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Audit mode: block mode intermittently refused allow-listed hosts on hosted runners (DEP-19). Release workflows keep block.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: ./scripts/ci/shellcheck.sh

  codeql:
    name: "CodeQL Analysis"
    # CodeQL SARIF upload requires GitHub Advanced Security (GHAS), which is not
    # available on free private repos. Skip unless the repo is public.
    if: github.event.repository.visibility == 'public' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # Stays audit for stage 1: codeql-action's query-bundle CDN and the Go
      # build step's module fetches aren't a fixed, documented endpoint set,
      # and drydock (the org's own harden-runner precedent) keeps its CodeQL
      # job on audit for the same reason. Revisit in stage 2.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: actions, go, javascript-typescript
          queries: security-and-quality

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Go
        run: go build ./...
        working-directory: app

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0

  dependency-review:
    name: "Dependency Review"
    # Dependency Review requires GitHub Advanced Security on private repos.
    # Gated on public visibility so it auto-activates when the repo goes public.
    # The repository Dependency Graph setting was enabled 2026-08-17, so this
    # job now actually runs on every PR (sockguard#271 item 1).
    if: ${{ github.event.repository.visibility == 'public' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Audit mode: block mode intermittently refused allow-listed hosts on hosted runners (DEP-19). Release workflows keep block.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Daemon-side advisories against github.com/docker/docker, which has no
          # patched release (the module ends at v28.5.2; moby moved to new paths).
          # Only the test-only app/compat module imports it, for its API data
          # types, and runs no daemon code. Same IDs as the Qlty triage there.
          allow-ghsas: GHSA-x86f-5xw2-fm2r, GHSA-rg2x-37c3-w2rh, GHSA-pxq6-2prw-chj9, GHSA-vp62-88p7-qqf5

  gitleaks:
    name: "Gitleaks"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # gitleaks/gitleaks-action requires a paid GITLEAKS_LICENSE for org-owned
    # repos (CodesWhat is an org), so this job runs the free, MIT-licensed
    # gitleaks CLI directly instead. To bump: pick the new release's
    # linux_x64 tarball sha256 from
    # https://github.com/gitleaks/gitleaks/releases/download/vX.Y.Z/gitleaks_X.Y.Z_checksums.txt
    # and update both env values together.
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      # Audit mode: block mode intermittently refused allow-listed hosts on hosted runners (DEP-19). Release workflows keep block.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans full history, not just the checked-out ref
          persist-credentials: false

      - name: Download gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks

      - name: Scan for committed secrets
        run: ./gitleaks detect --source . --no-banner --redact -v

  actionlint:
    name: "Actionlint"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Stays audit for stage 1: raven-actions/actionlint's default inputs
      # enable pyflakes (pip-installed) and shellcheck alongside its own
      # GitHub-release binary fetch, none of which resolve to a single
      # documented endpoint set. Revisit in stage 2.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflow files
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

  commit-message:
    name: "Commit Message"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Audit mode: block mode intermittently refused allow-listed hosts on hosted runners (DEP-19). Release workflows keep block.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only inspects commits introduced by this PR (base branch..HEAD),
          # so legacy emoji commits already on the base branch never fail it.
          #
          # A promotion PR is the exception: `dev/v2.0 -> main` re-presents
          # every commit on the dev branch as "introduced by this PR", and
          # this repo's history predates the gate — eight gitmoji subjects
          # from the active release series sit on dev/v2.0 and not on main.
          # That history is published and never gets rewritten (CLAUDE.md),
          # so a blocking gate here would deadlock every release cut. Those
          # commits were already validated when they landed on the dev
          # branch, which is where the gate belongs, so skip the promotion
          # PR rather than re-judging them.
          #
          # Same-repo only: `github.head_ref` is attacker-chosen on a fork,
          # so without the repo check anyone could name a fork branch
          # `dev/anything`, target main, and skip the gate outright.
          if [ "${HEAD_REPO}" = "${REPOSITORY}" ]; then
            case "${BASE_REF}:${HEAD_REF}" in
              main:dev/*|main:maintenance/*)
                echo "Promotion PR (${HEAD_REF} -> ${BASE_REF}) — commits were validated on the dev branch, skipping."
                exit 0
                ;;
            esac
          fi

          msg_file="$(mktemp)"
          trap 'rm -f "$msg_file"' EXIT
          failed=0
          subjects="$(git log --format=%s "origin/${BASE_REF}..HEAD")"
          while IFS= read -r msg; do
            [ -n "$msg" ] || continue
            printf '%s\n' "$msg" > "$msg_file"
            if ! node scripts/validate-commit-msg.mjs "$msg_file"; then
              failed=1
            fi
          done <<< "$subjects"

          if [ "${failed}" -eq 1 ]; then
            echo "::error::Some commits don't follow the commit message convention."
            exit 1
          fi

  docker:
    name: "Docker Build"
    needs: changes
    # Required context, so a docs-only PR gets `skipped` here rather than a
    # missing check — that is what satisfies the ruleset instead of
    # deadlocking on it. `!cancelled()` for the same fail-open reason as
    # go-ci above: a failed gate job leaves docs_only empty, `'' != 'true'`
    # is true, and the build runs.
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      security-events: write
    steps:
      # Stays audit for stage 1: builds the Wolfi/Chainguard-based image
      # before scanning it, and that base-image pull can land on any of
      # Chainguard's CDN endpoints — not a fixed set. Same reasoning as
      # security-grype.yml's grype-image job. Revisit in stage 2.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Docker Hub
        # Authenticated pulls avoid Docker Hub's anonymous toomanyrequests
        # limit on shared runner IPs. Skipped unless both credentials are
        # present (fork PRs, Dependabot).
        if: ${{ env.DOCKERHUB_LOGIN == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Single-arch build to verify Dockerfile builds correctly.
      # Multi-arch (amd64 + arm64) is handled by the release workflow.
      - name: Build (single-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: sockguard:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Grype gates the image this job just built — the gating-posture rule is
      # that Grype gates wherever the PR pipeline actually builds the artifact
      # it scans, and "Docker Build" (this job) is that place for sockguard.
      # security-grype.yml's own grype-image job stays scheduled/manual-only
      # (it already skips pull_request via its job-level `if:`) so the image
      # isn't scanned twice per PR.
      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        id: grype
        with:
          image: sockguard:ci
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload Grype SARIF to code scanning
        # Code scanning uploads require GHAS, not available on free private repos.
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image

      - name: Verify fresh socket-volume startup
        shell: bash
        run: |
          set -euo pipefail

          consumer_image="curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6"
          docker pull "${consumer_image}" >/dev/null

          runtime_volume="sockguard-ci-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runtime_container="sockguard-ci-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          socket_gid="$(stat -c '%g' /var/run/docker.sock)"

          cleanup() {
            docker rm -f "${runtime_container}" >/dev/null 2>&1 || true
            docker volume rm "${runtime_volume}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "${runtime_volume}" >/dev/null
          docker run --detach \
            --name "${runtime_container}" \
            --group-add "${socket_gid}" \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume "${runtime_volume}:/var/run/sockguard" \
            --env SOCKGUARD_LISTEN_SOCKET=/var/run/sockguard/sockguard.sock \
            sockguard:ci >/dev/null

          if timeout 2 docker wait "${runtime_container}" >/dev/null; then
            docker logs "${runtime_container}"
            echo "::error::Sockguard exited while initializing a fresh named socket volume"
            exit 1
          fi

          test "$(docker inspect --format '{{.State.Running}}' "${runtime_container}")" = "true"

          runtime_mountpoint="$(docker volume inspect --format '{{.Mountpoint}}' "${runtime_volume}")"
          runtime_socket="${runtime_mountpoint}/sockguard.sock"
          sudo test -S "${runtime_socket}"
          test "$(sudo stat -c '%u:%g %a' "${runtime_socket}")" = "65532:65532 600"
          test "$(sudo curl --fail --silent --show-error \
            --unix-socket "${runtime_socket}" http://localhost/_ping)" = "OK"
          test "$(docker run --rm --user 65532:65532 \
            --volume "${runtime_volume}:/var/run/sockguard:ro" \
            "${consumer_image}" --fail --silent --show-error --max-time 10 \
            --unix-socket /var/run/sockguard/sockguard.sock http://localhost/_ping)" = "OK"
