name: Greptile second opinion

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  summon:
    if: github.event.label.name == 'second-opinion'
    permissions:
      pull-requests: write
    uses: CodesWhat/.github/.github/workflows/greptile-summon.yml@684a6b931e7802f1985e2cb4f6ea0c95861988e3  # main, 2026-11-27
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
