name: Main Is Released

# Asserts the invariant behind main=GA: main's HEAD points at a release
# tag, so scanners pointed at main (Scorecard, CodeQL, Grype) describe
# software users actually run. Sockguard's 2026-08-20 baseline had main 69
# commits past v1.7.1 — the worst drift in the org — which is what this
# monitor exists to catch early.
#
# Schedule + dispatch only, no push trigger: a promotion merge is untagged
# for the seconds between the merge and the tag push, and a red run in that
# window is noise, not drift. The schedule is best-effort — it only runs
# from the default branch (so this goes live when it lands on main), can be
# delayed under load, and GitHub disables it after 60 days of repo
# inactivity; forks must opt in.
#
# Deliberately NOT a required context. With schedule/dispatch-only
# triggers, no check run is ever reported on a PR's commits, so a required
# context by this name could never be satisfied and would deadlock every
# merge into main. It is a monitor, not a gate.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  released:
    permissions:
      contents: read # Read main and its tags.
    uses: CodesWhat/.github/.github/workflows/main-is-released.yml@11004e42d7d19e86eb3b7777c467ec9522b784e1 # main 2026-08-21
