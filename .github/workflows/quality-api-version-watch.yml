name: "Quality: Upstream API Watch (monthly)"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Quality: Upstream API Watch — Monthly schedule' ||
    format('Quality: Upstream API Watch — Manual by {0}', github.actor)
  }}

# Sockguard's request/response inspectors are validated against a specific
# ceiling of the Docker Engine API (see app/testdata/docker-api/
# max-supported-version.txt, currently 1.57; the 1.55 validation work
# was tracked in #153). NormalizePath itself strips any
# well-formed /vN[.N]/ prefix regardless of value, so sockguard never
# hard-rejects traffic from a newer daemon — but a new Engine API minor can
# ship new inspectable fields (containers/create, exec, service
# create/update, swarm init, image pull, build) that the policy structs in
# internal/filter haven't been reviewed against yet.
#
# This workflow has no code to run: it fetches Docker's public Engine API
# version-history page monthly, extracts the highest documented v1.NN, and
# fails the job (a red, human-visible CI check — deliberately not a
# quietly-filed bot issue, since a scheduled workflow failure is the
# durable signal that survives even if issue-filing itself breaks) when
# that number moves past the pinned ceiling. A maintainer then reviews the
# new API's changelog entry, updates the pin, and files any follow-up
# filter work the release needs.
#
# The second job watches the other daemon the same way. Podman's native
# POST /libpod/containers/{name}/update decodes handlers.UpdateEntities, and
# sockguard's inspector allows an UpdateEntities root key it does not
# recognize on purpose (deny-on-unknown would refuse working requests on
# every Podman minor that adds a field, including fields Podman itself
# discards). That posture is only safe if somebody notices when the upstream
# body grows, so app/testdata/podman-api/update-entities-root-fields.json
# pins the field set the inspector was reviewed against and this job
# re-derives it from Podman's source at `main`. A new field lands as a red
# monthly check instead of as an uninspected key nobody is looking for.
#
# Podman's ownership SpecGenerator snapshots are checked against the latest
# containers/podman release tag, resolved at run time, in the same job. The
# UpdateEntities snapshot stays on `main` on purpose: it is the early warning
# for a field that has not shipped yet.
#
# The third job re-derives the known-route catalog
# (app/internal/cmd/known_api_routes.json, the route surface) with
# scripts/update-route-catalog.py at the latest moby/moby and
# containers/podman release tags, resolved at run time, and fails when the
# routes differ from the committed catalog. A new route upstream lands as a
# red monthly check instead of as a path the catalog has never seen. A newer
# tag with identical routes only warns that the pinned revisions are stale.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 8 1 * *'  # Monthly on day 1 at 08:30 UTC

permissions:
  contents: read

concurrency:
  group: quality-api-version-watch-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-engine-api-version:
    name: "Check Engine API version ceiling"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Audit mode: block mode intermittently refused allow-listed hosts on hosted runners (DEP-19). Release workflows keep block.
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned ceiling
        id: pinned
        run: |
          PINNED="$(tr -d '[:space:]' < app/testdata/docker-api/max-supported-version.txt)"
          if [ -z "${PINNED}" ]; then
            echo "::error::app/testdata/docker-api/max-supported-version.txt is empty"
            exit 1
          fi
          echo "version=${PINNED}" >> "$GITHUB_OUTPUT"
          echo "Pinned Engine API ceiling: ${PINNED}"

      - name: Fetch latest documented Engine API version
        id: latest
        run: |
          set -euo pipefail

          URL="https://docs.docker.com/reference/api/engine/version-history/"
          HTML="$(curl -fsSL --retry 3 --retry-delay 5 "${URL}")"

          # The version-history page lists a "v1.NN API changes" heading (and
          # matching anchor) for every documented minor, but a bare "v1.NN"
          # token also shows up elsewhere on the page — inlined SVG icons'
          # `<path d="...">` coordinate data contains literals like "v1.875",
          # which outsort every real version. That is what made this job
          # report Engine API "1.875" on 2026-09-01 and demand a ceiling bump
          # Docker had never shipped. The extraction lives in
          # scripts/engine-api-latest.sh, fixture-tested in
          # scripts/engine-api-latest.test.mjs, rather than staying an inline
          # pipeline: it needs to fail closed when the *newest* heading is
          # reworded or recased (e.g. "v1.56 API updates", "V1.56 API
          # changes") rather than silently keep reporting the previous
          # version, and that branching logic is worth covering with fixtures
          # instead of trusting a one-off grep chain against a live page.
          LATEST="$(printf '%s\n' "${HTML}" | bash scripts/engine-api-latest.sh)"

          if [ -z "${LATEST}" ]; then
            echo "::error::scripts/engine-api-latest.sh printed no version for ${URL}"
            exit 1
          fi

          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest documented Engine API version: ${LATEST}"

      - name: Compare against pinned ceiling
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail

          PINNED_MINOR="${PINNED#1.}"
          LATEST_MINOR="${LATEST#1.}"

          {
            echo "### Engine API version watch"
            echo ""
            echo "- Pinned ceiling: \`${PINNED}\` (\`app/testdata/docker-api/max-supported-version.txt\`)"
            echo "- Latest documented: \`${LATEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${LATEST_MINOR}" -gt "${PINNED_MINOR}" ]; then
            echo "::error::Docker Engine API ${LATEST} is documented but sockguard is only validated through ${PINNED}. Review https://docs.docker.com/reference/api/engine/version-history/#v${LATEST_MINOR}-api-changes, update app/testdata/docker-api/max-supported-version.txt, and file follow-up filter work for any new inspectable fields."
            echo "**Result: Engine API ${LATEST} exceeds the pinned ${PINNED} ceiling — review required.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Engine API ceiling ${PINNED} still covers the latest documented version ${LATEST}."
          echo "**Result: within pinned ceiling.**" >> "$GITHUB_STEP_SUMMARY"

  check-libpod-update-fields:
    name: "Check libpod UpdateEntities root fields"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # Audit rather than block, unlike the job above: this one needs the Go
      # toolchain, the module proxy and the Actions cache on top of
      # raw.githubusercontent.com, and that endpoint set has not been
      # enumerated for the egress rollout yet. Same posture the other Go jobs
      # in this repo hold at stage 1.
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The test parses Podman's own declarations with go/ast and diffs the
      # flattened root key set against the committed snapshot, so a moved
      # embedded struct or a changed json tag is resolved the way
      # encoding/json resolves it rather than grepped for. It skips itself
      # without the ref, which is how the rest of the suite stays offline.
      - name: Compare UpdateEntities snapshot against Podman main
        id: drift
        working-directory: app
        env:
          SOCKGUARD_TEST_PODMAN_UPSTREAM_REF: main
        run: go test ./internal/filter/ -run 'SnapshotMatchesUpstreamPodman' -count=1 -v

      # Latest release tag, not main: SpecGenerator is the create surface and
      # only releases are what users run.
      - name: Resolve latest Podman release tag
        id: podman
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh api repos/containers/podman/releases/latest --jq .tag_name)"
          if [ -z "${TAG}" ]; then
            echo "::error::could not resolve the latest containers/podman release tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest Podman release: ${TAG}"

      - name: Compare SpecGenerator snapshots against latest Podman release
        id: specgen
        working-directory: app
        env:
          SOCKGUARD_TEST_PODMAN_UPSTREAM_REF: ${{ steps.podman.outputs.tag }}
        run: go test ./internal/ownership/ -run 'SnapshotMatchesUpstreamPodman' -count=1 -v

      - name: Summarize
        if: always()
        env:
          STATUS: ${{ steps.drift.outcome }}
          SPECGEN: ${{ steps.specgen.outcome }}
          PODMAN_TAG: ${{ steps.podman.outputs.tag }}
        run: |
          {
            echo "### libpod UpdateEntities root fields"
            echo ""
            echo "- Pinned set: \`app/testdata/podman-api/update-entities-root-fields.json\`"
            echo "- Checked against: \`containers/podman@main\`"
            echo "- Result: ${STATUS}"
            echo "- SpecGenerator snapshots checked against: \`containers/podman@${PODMAN_TAG}\`"
            echo "- SpecGenerator result: ${SPECGEN}"
            if [ "${STATUS}" != "success" ] || [ "${SPECGEN}" != "success" ]; then
              echo ""
              echo "Podman's update body or SpecGenerator no longer matches the pinned field set."
              echo "The step log names every field that moved. Add each new one to a"
              echo "gate list in \`app/internal/filter/libpod_container_update.go\`,"
              echo "refresh the snapshot, and re-run the offline drift test."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  check-route-catalog:
    name: "Re-derive known route catalog"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Audit mode: block mode intermittently refused allow-listed hosts on hosted runners (DEP-19). Release workflows keep block.
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest upstream release tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          resolve() {
            local repo="$1" tag sha
            tag="$(gh api "repos/${repo}/releases/latest" --jq .tag_name)"
            sha="$(gh api "repos/${repo}/commits/${tag}" --jq .sha)"
            if [ -z "${tag}" ] || [ -z "${sha}" ]; then
              echo "::error::could not resolve the latest ${repo} release"
              exit 1
            fi
            echo "${tag} ${sha}"
          }
          read -r ENGINE_TAG ENGINE_SHA < <(resolve moby/moby)
          read -r PODMAN_TAG PODMAN_SHA < <(resolve containers/podman)
          {
            echo "engine_tag=${ENGINE_TAG}"
            echo "engine_sha=${ENGINE_SHA}"
            echo "podman_tag=${PODMAN_TAG}"
            echo "podman_sha=${PODMAN_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "moby/moby ${ENGINE_TAG} (${ENGINE_SHA}), containers/podman ${PODMAN_TAG} (${PODMAN_SHA})"

      - name: Regenerate catalog at the latest tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOCKGUARD_ENGINE_REV: ${{ steps.tags.outputs.engine_sha }}
          SOCKGUARD_PODMAN_REV: ${{ steps.tags.outputs.podman_sha }}
        run: python3 scripts/update-route-catalog.py

      # The catalog's `sources` block records the pinned revisions, so a newer
      # tag always changes that block. Only the route list is the drift signal.
      - name: Fail on route drift
        env:
          ENGINE_TAG: ${{ steps.tags.outputs.engine_tag }}
          PODMAN_TAG: ${{ steps.tags.outputs.podman_tag }}
        run: |
          set -euo pipefail
          CATALOG=app/internal/cmd/known_api_routes.json
          git show "HEAD:${CATALOG}" > "${RUNNER_TEMP}/committed.json"
          {
            echo "### Route catalog re-derivation"
            echo ""
            echo "- moby/moby: \`${ENGINE_TAG}\`"
            echo "- containers/podman: \`${PODMAN_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if python3 - "${RUNNER_TEMP}/committed.json" "${CATALOG}" <<'PY'
          import json, sys
          old = json.load(open(sys.argv[1]))["routes"]
          new = json.load(open(sys.argv[2]))["routes"]
          sys.exit(0 if old == new else 1)
          PY
          then
            if git diff --quiet -- "${CATALOG}"; then
              echo "**Result: catalog matches upstream.**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Routes match, but newer upstream tags exist. Bump ENGINE_REV and PODMAN_REV in scripts/update-route-catalog.py to ${ENGINE_TAG} and ${PODMAN_TAG}."
              echo "**Result: routes match; pinned revisions are behind.**" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          DIFF="$(git diff --unified=0 -- "${CATALOG}" | grep -E '^[+-] ' | head -50 | tr '\n' ' ')"
          echo "::error::Upstream routes moved at ${ENGINE_TAG} / ${PODMAN_TAG}. Re-run scripts/update-route-catalog.py at those revisions, review the new routes against the filter rules, and commit the catalog. Diff: ${DIFF}"
          git diff --unified=0 -- "${CATALOG}" | head -100 >> "$GITHUB_STEP_SUMMARY"
          echo "**Result: route drift.**" >> "$GITHUB_STEP_SUMMARY"
          exit 1
