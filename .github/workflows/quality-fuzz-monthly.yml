name: "Quality: Deep Fuzz (monthly)"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Quality: Deep Fuzz — Monthly schedule' ||
    format('Quality: Deep Fuzz — Monthly, manual by {0}', github.actor)
  }}

# Tier 3 of the fuzz strategy. Tier 1 lives in `ci-verify.yml`'s reusable
# `go-ci` fuzz matrix
# (60-second smoke per PR/push), Tier 2 in `quality-fuzz-nightly.yml`
# (15 minutes per fuzzer daily). This workflow gives the Docker filter
# targets and lower-frequency fuzzers a 1-hour coverage budget on the first
# day of each month so we get one very deep pass that can find paths the
# shorter tiers miss, plus on-demand longer runs via `workflow_dispatch`
# before a release.
#
# Matrix parallelism keeps the wall time near 1 hour. Keeping lower-risk
# additions here instead of the daily tier bounds their recurring runner cost
# while still giving every in-tree fuzz target a coverage-guided run.
#
# Crashes are uploaded with 180-day retention so a failing input from
# an older monthly run stays recoverable long enough to turn into a
# committed regression test.

on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-fuzzer coverage budget (Go duration, e.g. 1h, 3h). Max ≈5h45m before the job timeout trims it."
        required: false
        default: "1h"
      skip_harden_runner:
        description: "Probe: skip step-security/harden-runner to test if its audit pipeline is what's OOMing the runner on long fuzz runs. Manual-only — scheduled runs always harden."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '30 7 1 * *'  # Monthly on day 1 at 07:30 UTC

permissions:
  contents: read

concurrency:
  # Don't cancel an in-flight monthly when a manual dispatch fires — they
  # answer different questions and either can confirm health.
  group: quality-fuzz-monthly-${{ github.workflow }}-${{ github.event.inputs.fuzztime || 'scheduled' }}
  cancel-in-progress: false

jobs:
  monthly-fuzz:
    name: "Fuzz ${{ matrix.fuzzer.name }} (monthly)"
    runs-on: ubuntu-24.04
    # 6-hour ceiling is the hard cap regardless of the fuzztime input.
    # Anything longer should run on a dedicated box, not a shared runner.
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        fuzzer:
          - { name: FuzzPathMatch,                 pkg: ./internal/filter/ }
          - { name: FuzzGlobToRegex,               pkg: ./internal/filter/ }
          - { name: FuzzGlobToRegexString,         pkg: ./internal/filter/ }
          - { name: FuzzNormalizePath,             pkg: ./internal/filter/ }
          - { name: FuzzCompileRule,               pkg: ./internal/filter/ }
          - { name: FuzzBuild,                     pkg: ./internal/filter/ }
          - { name: FuzzContainerCreate,           pkg: ./internal/filter/ }
          - { name: FuzzExec,                      pkg: ./internal/filter/ }
          - { name: FuzzImagePull,                 pkg: ./internal/filter/ }
          - { name: FuzzVolume,                    pkg: ./internal/filter/ }
          - { name: FuzzSecret,                    pkg: ./internal/filter/ }
          - { name: FuzzConfigWrite,               pkg: ./internal/filter/ }
          - { name: FuzzService,                   pkg: ./internal/filter/ }
          - { name: FuzzSwarm,                     pkg: ./internal/filter/ }
          - { name: FuzzPlugin,                    pkg: ./internal/filter/ }
          - { name: FuzzNetwork,                   pkg: ./internal/filter/ }
          - { name: FuzzImageLoad,                 pkg: ./internal/filter/ }
          - { name: FuzzContainerArchive,          pkg: ./internal/filter/ }
          - { name: FuzzContainerUpdate,           pkg: ./internal/filter/ }
          - { name: FuzzNode,                      pkg: ./internal/filter/ }
          - { name: FuzzLibpodContainerCreate,     pkg: ./internal/filter/ }
          - { name: FuzzMutationRoundTrip,         pkg: ./internal/filter/ }
          - { name: FuzzNetworkConnectEndpointConfigGates, pkg: ./internal/filter/ }
          - { name: FuzzContainerCreatePolicyInspectEndpointConfig, pkg: ./internal/filter/ }
          - { name: FuzzContainerCreateEndpointConfigGates, pkg: ./internal/filter/ }
          - { name: FuzzResourceLimitGuardContainerRequestDecode, pkg: ./internal/filter/ }
          - { name: FuzzLoadYAML,                  pkg: ./internal/config/ }
          - { name: FuzzLoadBytesEndpointConfig,   pkg: ./internal/config/ }
          - { name: FuzzEffectiveListenerValidation, pkg: ./internal/config/ }
          - { name: FuzzLoadYAMLBuildkit,          pkg: ./internal/config/ }
          - { name: FuzzProxyHeadersAndBody,       pkg: ./internal/proxy/ }
          - { name: FuzzHijackHeadersAndBody,      pkg: ./internal/proxy/ }
          - { name: FuzzHijackBidirectionalStream, pkg: ./internal/proxy/ }
          - { name: FuzzPathRoutingDifferential,   pkg: ./differential/ }
          - { name: FuzzVisibilityFilter,          pkg: ./internal/visibility/ }
          - { name: FuzzOwnershipMutateBody,       pkg: ./internal/ownership/ }
          - { name: FuzzOwnershipMutateServiceBody, pkg: ./internal/ownership/ }
          - { name: FuzzFilterModifyResponse,      pkg: ./internal/responsefilter/ }
          - { name: FuzzImmutableListenerDiff,     pkg: ./internal/reload/ }
          - { name: FuzzBuildConfig,               pkg: ./internal/policybundle/ }
          - { name: FuzzToRegexString,             pkg: ./internal/glob/ }

    steps:
      # Stays audit for stage 1: this job already has an open, in-repo
      # question (skip_harden_runner above) about whether harden-runner's
      # own audit pipeline contributes to the OOM risk on long (up to 6h)
      # fuzz runs. Flipping egress mode here would confound that
      # investigation, so this waits for it to resolve rather than moving
      # with the otherwise-identical quality-fuzz-nightly.yml job.
      - name: Harden Runner
        if: ${{ inputs.skip_harden_runner != true }}
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve fuzz budget
        id: budget
        env:
          INPUT_FUZZTIME: ${{ github.event.inputs.fuzztime }}
        run: |
          FUZZTIME="${INPUT_FUZZTIME:-1h}"
          source scripts/fuzz-duration.sh
          TEST_TIMEOUT="$(fuzz_timeout_for_budget "${FUZZTIME}" 600)" || exit 1
          echo "fuzztime=${FUZZTIME}" >> "$GITHUB_OUTPUT"
          echo "test_timeout=${TEST_TIMEOUT}" >> "$GITHUB_OUTPUT"
          echo "Running ${{ matrix.fuzzer.name }} for ${FUZZTIME} with ${TEST_TIMEOUT} watchdog"

      - name: Fuzz ${{ matrix.fuzzer.name }}
        working-directory: app
        env:
          FUZZER: ${{ matrix.fuzzer.name }}
          PKG: ${{ matrix.fuzzer.pkg }}
          FUZZTIME: ${{ steps.budget.outputs.fuzztime }}
          TEST_TIMEOUT: ${{ steps.budget.outputs.test_timeout }}
        run: |
          # TEST_TIMEOUT is FUZZTIME plus a cushion, so hung inputs produce
          # Go's goroutine dump before the job-level ceiling fires.
          go test -run='^$' \
            -fuzz="^${FUZZER}\$" \
            -fuzztime="${FUZZTIME}" \
            -timeout="${TEST_TIMEOUT}" \
            "${PKG}"

      - name: Upload fuzz corpus on failure or cancel
        # `cancelled()` covers manual cancels and job-level timeout-minutes
        # kills, both of which signal a wedged fuzzer whose corpus is worth
        # preserving — same as a normal crash.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-corpus-monthly-${{ matrix.fuzzer.name }}-${{ github.run_id }}
          path: app/**/testdata/fuzz/${{ matrix.fuzzer.name }}/
          retention-days: 180
          if-no-files-found: ignore

      - name: Upload fuzz forensics on failure or cancel
        # Per-worker memory/goroutine/FD samples written by
        # startFuzzForensicsSampler (currently armed for
        # FuzzHijackHeadersAndBody). The sampler appends to a file every
        # 60s so even when the hosted runner OOMs mid-step we still get
        # the growth curve up to the moment of death.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-forensics-monthly-${{ matrix.fuzzer.name }}-${{ github.run_id }}
          path: app/internal/**/forensics/
          retention-days: 180
          if-no-files-found: ignore

      - name: Summarize
        if: always()
        env:
          FUZZER: ${{ matrix.fuzzer.name }}
          PKG: ${{ matrix.fuzzer.pkg }}
          FUZZTIME: ${{ steps.budget.outputs.fuzztime }}
          TEST_TIMEOUT: ${{ steps.budget.outputs.test_timeout }}
          STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "### ${FUZZER} (monthly)"
            echo ""
            echo "- Package: \`${PKG}\`"
            echo "- Budget:  ${FUZZTIME}"
            echo "- Timeout: ${TEST_TIMEOUT}"
            echo "- Result:  ${STATUS}"
            echo ""
            if [ "${STATUS}" = "failure" ]; then
              echo "A crashing input was saved to \`testdata/fuzz/${FUZZER}/\`"
              echo "and uploaded as \`fuzz-corpus-monthly-${FUZZER}-${RUN_ID}\`"
              echo "(180-day retention). Triage: download, commit the minimized input"
              echo "to the seed corpus, fix the regression, push."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
