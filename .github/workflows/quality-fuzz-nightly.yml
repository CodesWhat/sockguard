name: "Quality: Deep Fuzz"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Quality: Deep Fuzz — Nightly' ||
    format('Quality: Deep Fuzz — Manual by {0}', github.actor)
  }}

# Tier 2 of the fuzz strategy. Tier 1 lives in `ci-verify.yml`'s reusable
# `go-ci` fuzz matrix and gives most fuzzers a 60-second budget on every
# PR/push to main so obvious regressions fail fast, except FuzzLoadYAML,
# FuzzHijackBidirectionalStream, FuzzValidateUpstreamHijackInactivityTimeout,
# and FuzzValidateServerShutdownGrace, which are heavy enough that they reach
# hosted CI only in this nightly tier and the monthly tier below (FuzzLoadYAML
# and FuzzHijackBidirectionalStream also run in the local pre-push smoke test
# in `lefthook.yml`), and
# FuzzCatalogReachability, whose value is in long coverage-guided runs against
# the startup validator's bounded route search rather than in a 60-second
# regression smoke. This workflow is
# where the deep coverage work
# happens: 15 minutes per fuzzer by default (overridable via
# `workflow_dispatch` input up to the job `timeout-minutes` cap), every
# core fuzzer suite, matrix-parallelized across runners so the whole thing
# finishes in ~15 minutes of wall time. Lower-risk targets run in the monthly
# tier so daily runner cost stays bounded.
#
# Crashes are uploaded as artifacts with 90-day retention so the failing
# input is recoverable. The triage workflow is: download the artifact,
# commit the minimized input under `app/internal/<pkg>/testdata/fuzz/<Fuzz*>/`
# so it enters the seed corpus for all future runs, fix the bug, push.
#
# One narrow exception to "every failure is a crasher": a bare "context
# deadline exceeded" at the -fuzztime boundary with no crasher is a known Go
# fuzzing-engine flake (golang/go#48591) that strikes a random fuzzer under
# shared-runner load. The Fuzz step retries that single case once; only a real
# crasher or a genuine hang reds the run.

on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-fuzzer coverage budget (Go duration, e.g. 15m, 1h). Max ≈55m before the job timeout trims it."
        required: false
        default: "15m"
  schedule:
    - cron: '30 9 * * *'  # Daily at 09:30 UTC (quiet window before US/EU start-of-day)

permissions:
  contents: read

concurrency:
  # Don't cancel an in-flight nightly when a manual dispatch kicks off — the
  # two runs answer different questions and either can confirm health.
  group: quality-fuzz-${{ github.workflow }}-${{ github.event.inputs.fuzztime || 'scheduled' }}
  cancel-in-progress: false

jobs:
  deep-fuzz:
    name: "Fuzz ${{ matrix.fuzzer.name }}"
    runs-on: ubuntu-24.04
    # Job-level cap is the hard ceiling regardless of what -fuzztime asks
    # for. Keep it comfortably above the default budget run twice (the Fuzz
    # step retries the known boundary flake once → ~2×15m + setup) and above
    # the longest documented manual budget plus the fuzz watchdog cushion.
    timeout-minutes: 75

    strategy:
      fail-fast: false
      # The org is on the Free plan: 20 concurrent jobs across every repo.
      # This matrix is 28 on its own, and portwing's Deep Fuzz is also
      # `30 9 * * *` and asks for 7 at the same minute, so 35 jobs contend
      # for 20 slots. Jobs admitted over the ceiling get starved (`execs`
      # flatlining at 0/sec) and then reclaimed with
      # "The runner has received a shutdown signal", exit 143, which reads
      # as a fuzz failure but is an instrument failure: no `--- FAIL`, no
      # crasher written to testdata. That killed 8, 2 and 7 jobs on the
      # nights of 2026-08-24/25/26 and 4 on 08-27. The one night it went
      # green end to end (08-28, when the matrix was 22) was the night
      # GitHub deferred the schedule to 20:56 UTC, clear of the collision.
      # 12 leaves portwing's 7 intact inside the ceiling with a slot to
      # spare. Do not raise this past 13 while the plan is Free and
      # portwing shares the minute.
      max-parallel: 12
      matrix:
        fuzzer:
          - { name: FuzzPathMatch,                 pkg: ./internal/filter/ }
          - { name: FuzzGlobToRegex,               pkg: ./internal/filter/ }
          - { name: FuzzGlobToRegexString,         pkg: ./internal/filter/ }
          - { name: FuzzNormalizePath,             pkg: ./internal/filter/ }
          - { name: FuzzCompileRule,               pkg: ./internal/filter/ }
          - { name: FuzzBuild,                     pkg: ./internal/filter/ }
          - { name: FuzzContainerCreate,           pkg: ./internal/filter/ }
          - { name: FuzzExec,                      pkg: ./internal/filter/ }
          - { name: FuzzImagePull,                 pkg: ./internal/filter/ }
          - { name: FuzzVolume,                    pkg: ./internal/filter/ }
          - { name: FuzzSecret,                    pkg: ./internal/filter/ }
          - { name: FuzzConfigWrite,               pkg: ./internal/filter/ }
          - { name: FuzzService,                   pkg: ./internal/filter/ }
          - { name: FuzzSwarm,                     pkg: ./internal/filter/ }
          - { name: FuzzPlugin,                    pkg: ./internal/filter/ }
          - { name: FuzzNetwork,                   pkg: ./internal/filter/ }
          - { name: FuzzLoadYAML,                  pkg: ./internal/config/ }
          - { name: FuzzValidateUpstreamHijackInactivityTimeout, pkg: ./internal/config/ }
          - { name: FuzzProxyHeadersAndBody,       pkg: ./internal/proxy/ }
          - { name: FuzzHijackHeadersAndBody,      pkg: ./internal/proxy/ }
          - { name: FuzzHijackBidirectionalStream, pkg: ./internal/proxy/ }
          - { name: FuzzPathRoutingDifferential,   pkg: ./differential/ }
          - { name: FuzzVisibilityFilter,          pkg: ./internal/visibility/ }
          - { name: FuzzClassify,                  pkg: ./internal/upstreamflavor/ }
          - { name: FuzzConfigured,                pkg: ./internal/upstreamflavor/ }
          - { name: FuzzPodmanEventLabelFilter,    pkg: ./internal/visibility/ }
          - { name: FuzzCatalogReachability,       pkg: ./internal/cmd/ }
          - { name: FuzzValidateServerShutdownGrace, pkg: ./internal/config/ }

    steps:
      # Stage 1 of the harden-runner egress rollout: pure Go build/fuzz, no
      # Docker. github.com/proxy.golang.org/sum.golang.org cover module
      # fetch + sumdb; the objects/release-assets hosts cover
      # actions/setup-go's toolchain download on a runner-image cache miss
      # (no org precedent yet for Go jobs specifically, so this errs toward
      # the extra defensive hosts rather than a minimal guess). proxy.golang.org
      # serves module zips via signed redirects to storage.googleapis.com.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            storage.googleapis.com:443
            sum.golang.org:443
            *.actions.githubusercontent.com:443
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve fuzz budget
        id: budget
        env:
          INPUT_FUZZTIME: ${{ github.event.inputs.fuzztime }}
        run: |
          FUZZTIME="${INPUT_FUZZTIME:-15m}"
          source scripts/fuzz-duration.sh
          TEST_TIMEOUT="$(fuzz_timeout_for_budget "${FUZZTIME}" 600)" || exit 1
          echo "fuzztime=${FUZZTIME}" >> "$GITHUB_OUTPUT"
          echo "test_timeout=${TEST_TIMEOUT}" >> "$GITHUB_OUTPUT"
          echo "Running ${{ matrix.fuzzer.name }} for ${FUZZTIME} with ${TEST_TIMEOUT} watchdog"

      - name: Fuzz ${{ matrix.fuzzer.name }}
        id: fuzz
        working-directory: app
        env:
          FUZZER: ${{ matrix.fuzzer.name }}
          PKG: ${{ matrix.fuzzer.pkg }}
          FUZZTIME: ${{ steps.budget.outputs.fuzztime }}
          TEST_TIMEOUT: ${{ steps.budget.outputs.test_timeout }}
        run: |
          # -run=^$ skips normal unit tests in the package so only the fuzz
          # driver runs. TEST_TIMEOUT is FUZZTIME plus a cushion, so hangs
          # produce Go's goroutine dump before the job-level ceiling fires.
          #
          # A bare "context deadline exceeded" at the -fuzztime boundary with no
          # crasher is a known Go fuzzing flake (golang/go#48591): under
          # shared-runner load a worker can miss the coordinator's stop deadline
          # even though no input failed. We retry that one case ONCE. A real
          # crasher (Go prints "Failing input written to testdata/...") or a
          # genuine hang (the -timeout watchdog prints "test timed out") fails
          # immediately and is never retried.
          LOG="${RUNNER_TEMP}/fuzz-${FUZZER}.log"

          run_fuzz() {
            go test -run='^$' \
              -fuzz="^${FUZZER}\$" \
              -fuzztime="${FUZZTIME}" \
              -timeout="${TEST_TIMEOUT}" \
              "${PKG}" 2>&1 | tee "${LOG}"
            return "${PIPESTATUS[0]}"
          }

          emit() { echo "kind=$1" >> "$GITHUB_OUTPUT"; }

          for attempt in 1 2; do
            rc=0
            run_fuzz || rc=$?

            if [ "${rc}" -eq 0 ]; then
              emit pass
              exit 0
            fi

            if grep -q "Failing input written to testdata" "${LOG}"; then
              emit crash
              echo "::error::${FUZZER} found a crashing input — commit it to the seed corpus and fix the regression."
              exit "${rc}"
            fi

            if ! grep -q "context deadline exceeded" "${LOG}"; then
              emit error
              echo "::error::${FUZZER} failed for a non-flake reason (exit ${rc})."
              exit "${rc}"
            fi

            echo "::warning::${FUZZER}: known -fuzztime boundary flake (context deadline exceeded, no crasher) on attempt ${attempt}/2."
          done

          emit flake
          echo "::error::${FUZZER} hit the -fuzztime boundary flake on both attempts; failing so it stays visible."
          exit 1

      - name: Upload fuzz corpus on failure or cancel
        # `cancelled()` covers manual cancels and job-level timeout-minutes
        # kills, both of which signal a wedged fuzzer whose corpus is worth
        # preserving — same as a normal crash.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.fuzzer.name }}-${{ github.run_id }}
          path: app/**/testdata/fuzz/${{ matrix.fuzzer.name }}/
          retention-days: 90
          if-no-files-found: ignore

      - name: Summarize
        if: always()
        env:
          FUZZER: ${{ matrix.fuzzer.name }}
          PKG: ${{ matrix.fuzzer.pkg }}
          FUZZTIME: ${{ steps.budget.outputs.fuzztime }}
          TEST_TIMEOUT: ${{ steps.budget.outputs.test_timeout }}
          STATUS: ${{ job.status }}
          KIND: ${{ steps.fuzz.outputs.kind }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "### ${FUZZER}"
            echo ""
            echo "- Package: \`${PKG}\`"
            echo "- Budget:  ${FUZZTIME}"
            echo "- Timeout: ${TEST_TIMEOUT}"
            echo "- Result:  ${STATUS}"
            echo ""
            if [ "${KIND}" = "crash" ]; then
              echo "A crashing input was saved to \`testdata/fuzz/${FUZZER}/\`"
              echo "and uploaded as artifact"
              echo "\`fuzz-corpus-${FUZZER}-${RUN_ID}\`."
              echo "Download it, commit the minimized input to the seed corpus,"
              echo "fix the regression, and push."
            elif [ "${KIND}" = "flake" ]; then
              echo "Failed twice on the known \`-fuzztime\` boundary flake"
              echo "(\`context deadline exceeded\`, no crasher — golang/go#48591)."
              echo "Re-run the job to clear it."
            elif [ "${STATUS}" = "failure" ]; then
              echo "Failed before the fuzz driver produced a verdict (setup/build error)."
              echo "Check the job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
