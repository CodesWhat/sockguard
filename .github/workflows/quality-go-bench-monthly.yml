name: "⚡ Quality: Go Benchmarks"
run-name: >-
  ${{
    github.event_name == 'schedule' && '⚡ Quality: Benchmarks — Monthly schedule' ||
    format('⚡ Quality: Benchmarks — Manual by {0}', github.actor)
  }}

# Monthly quality signal: run benchmarks to catch performance regressions.
# Deep fuzzing lives in quality-fuzz-monthly.yml (every fuzzer, 1h each).
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 1 * *'  # Monthly on day 1 at 06:15 UTC

permissions:
  contents: read

concurrency:
  group: quality-monthly-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: "📊 Quality: Go Benchmarks"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: app/go.mod

      - name: Run benchmarks
        working-directory: app
        # shell: bash (rather than the default `bash -e {0}`) is required here:
        # GitHub's default bash has -e but not -o pipefail, so `| tee` would
        # report tee's exit code and mask a failing benchmark run.
        shell: bash
        run: |
          go test -bench=. -benchmem -count=5 -timeout=20m ./... | tee benchmark-results.txt

      - name: Upload benchmark results
        # Now that the run step actually fails on a failing benchmark, the
        # default success condition would throw away the output of the run you
        # most want to read.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results-${{ github.run_id }}
          path: app/benchmark-results.txt
          retention-days: 90

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Go Benchmarks"
            echo '```'
            grep -E '^Benchmark' app/benchmark-results.txt | head -50 || echo "No benchmark results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
