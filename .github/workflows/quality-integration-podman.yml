name: "Quality: Integration (Podman)"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Quality: Integration (Podman) — Nightly' ||
    github.event_name == 'pull_request' && format('Quality: Integration (Podman) — PR #{0}', github.event.pull_request.number) ||
    format('Quality: Integration (Podman) — Manual by {0}', github.actor)
  }}

# Runs the podmanintegration-tagged suite (app/integration/*_test.go plus
# app/internal/cmd/rules_podman_integration_test.go) against a REAL podman
# system service on the GitHub-hosted runner — the libpod-native counterpart
# of quality-integration.yml's real-dockerd suite (#148 design doc PR6:
# libpod container-create/pod-create/exec/volume/network/secret inspectors,
# plus the play/kube blind-write acknowledgement gate).
#
# Two legs, both against the SAME distro-packaged podman binary:
#   - rootful:  `sudo podman system service` on the well-known root socket.
#     Required — this is the common deployment shape (a root-owned
#     /run/podman/podman.sock bind-mounted into sockguard's container,
#     mirroring how the Docker suite points at /var/run/docker.sock) and has
#     proven stable in local verification.
#   - rootless: a per-user `podman system service` on the runner account's
#     XDG_RUNTIME_DIR socket, needing usable newuidmap/newgidmap and
#     /etc/subuid /etc/subgid ranges for the runner user. GitHub's
#     ubuntu-24.04 image ships all of that, but the runner has no logind
#     session (no interactive login, so no auto-created /run/user/<uid>)
#     and podman's rootless network/storage setup is more failure-prone in a
#     freshly-provisioned container-less VM than the well-trodden rootful
#     path. Marked continue-on-error so a transient rootless-only failure
#     (subuid allocation, missing runtime dir, slirp4netns quirks) never
#     blocks a PR on infrastructure that isn't what most sockguard
#     deployments run behind. The tests themselves are identical between the
#     two legs — only which socket SOCKGUARD_TEST_PODMAN_SOCKET points at
#     changes.
#
# Tests skip cleanly (t.Skip) when SOCKGUARD_TEST_PODMAN_SOCKET is unset, so
# `go test ./...` (no tags) and `go test -tags=integration ./integration/`
# (the Docker suite) are both unaffected by this file.

on:
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * *'  # 06:45 UTC daily, 30 minutes after quality-integration.yml's dockerd run
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/quality-integration-podman.yml'

permissions:
  contents: read

concurrency:
  group: quality-integration-podman-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-podman-rootful:
    name: "Integration (rootful podman)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # Stays audit for stage 1: `apt-get install podman` resolves through
      # whichever Ubuntu archive mirror the runner region picks — not a
      # fixed, documented endpoint set. Revisit in stage 2.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman version

      - name: Start rootful podman system service
        run: |
          sudo mkdir -p /run/podman
          # The redirect target is /tmp, writable by the invoking (non-root)
          # user; only `podman system service` itself needs sudo. Piping
          # through `sudo tee` instead would just hand the log file's
          # ownership to root for no benefit.
          # shellcheck disable=SC2024
          sudo nohup podman system service --time=0 unix:///run/podman/podman.sock >/tmp/podman-rootful.log 2>&1 &
          # `podman system service` does not create its socket atomically or
          # once. It binds the path, then unlinks and rebinds it during
          # startup, and each rebind lands a fresh root-owned 0600 socket in
          # a root-owned 0700 directory. The Go suite runs as the
          # unprivileged runner user, so both have to be widened — and a
          # rebind silently reverts whatever was widened before it.
          #
          # That single behaviour produced all three observed failures:
          #   - "podman.sock never appeared", 60ms into a loop that should
          #     have waited 30s (present on iteration 1, gone by the guard
          #     on the next line).
          #   - "chmod: cannot access ... No such file or directory", 50ms
          #     after a test -S on that exact path had just passed.
          #   - ten identical "connect: permission denied" test failures
          #     after a setup step that had confirmed the socket reachable
          #     100ms earlier, because the rebind came after that check.
          #
          # So nothing here asserts anything about the path in isolation,
          # and reaching the socket ONCE is explicitly not enough. Every
          # command here is non-fatal: under `bash -e` a single ENOENT from
          # one racing a rebind would otherwise kill the step outright.
          #
          # Group ownership rather than world access. This is a ROOTFUL
          # podman API: anything that can talk to it has host-root-
          # equivalent control, so it goes to the runner's primary group,
          # not 0666. Short-lived single-purpose VM or not, this repo exists
          # to stop exactly this kind of socket being handed out too widely.
          widen() {
            sudo chgrp "$(id -g)" /run/podman /run/podman/podman.sock 2>/dev/null || true
            sudo chmod 750 /run/podman 2>/dev/null || true
            sudo chmod 660 /run/podman/podman.sock 2>/dev/null || true
          }
          # Deliberately unprivileged: this is the exact access the test
          # binary needs, so it fails here rather than inside the suite.
          ping_ok() {
            curl --fail --silent --max-time 5 --unix-socket /run/podman/podman.sock http://d/libpod/_ping >/dev/null 2>&1
          }

          # Phase 1 — reachable at all.
          ready=""
          for _ in $(seq 1 30); do
            widen
            if ping_ok; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "libpod _ping never succeeded after 30 attempts" >&2
            echo "--- socket state ---" >&2
            sudo ls -la /run/podman >&2 || true
            echo "--- service log ---" >&2
            cat /tmp/podman-rootful.log >&2
            exit 1
          fi

          # Phase 2 — reachable and STILL settled. Ping without widening
          # first: if podman rebinds, the replacement socket is root-owned
          # 0600, so a bare ping starts failing and the streak resets. Five
          # consecutive bare pings therefore mean the mode has survived five
          # seconds untouched, i.e. startup is done rebinding. Waiting for
          # first contact alone is what let the suite start against a socket
          # that had already been replaced.
          streak=0
          settled=""
          for _ in $(seq 1 60); do
            if ping_ok; then
              streak=$((streak + 1))
              if [ "$streak" -ge 5 ]; then
                settled=1
                break
              fi
            else
              streak=0
              widen
            fi
            sleep 1
          done
          if [ -z "$settled" ]; then
            echo "rootful socket never stayed reachable for 5 consecutive checks" >&2
            echo "--- socket state ---" >&2
            sudo ls -la /run/podman >&2 || true
            echo "--- service log ---" >&2
            cat /tmp/podman-rootful.log >&2
            exit 1
          fi
          echo "rootful podman service ready and settled on /run/podman/podman.sock"

      # Pulls the digest-pinned ref straight from helpers_test.go instead of
      # a hardcoded tag — see quality-integration.yml's identical step for
      # the pull-on-create rationale. Podman resolves docker.io references
      # the same way dockerd does, so the same pinned digest keeps both
      # suites reproducible from the same registry content.
      - name: Pre-pull busybox sentinel image
        run: |
          ref=$(sed -nE 's/^[[:space:]]*const[[:space:]]+busyboxPinnedRef[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' app/integration/helpers_test.go)
          if [[ ! "$ref" =~ ^busybox:[[:alnum:]_.-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid or unpinned busyboxPinnedRef: ${ref}" >&2
            exit 1
          fi
          echo "Pre-pulling pinned sentinel image (rootful): ${ref}"
          sudo podman -r --url unix:///run/podman/podman.sock pull "${ref}"

      # Cheap insurance directly ahead of the suite: the pre-pull above is
      # the last root-side podman operation, so this is the final chance to
      # catch a socket the runner user can't reach. Without it, a late
      # rebind surfaces as ten identical "connect: permission denied" test
      # failures that read like a proxy bug rather than a setup problem.
      - name: Verify socket is reachable unprivileged
        run: |
          sudo chgrp "$(id -g)" /run/podman /run/podman/podman.sock 2>/dev/null || true
          sudo chmod 750 /run/podman 2>/dev/null || true
          sudo chmod 660 /run/podman/podman.sock 2>/dev/null || true
          if ! curl --fail --silent --show-error --max-time 5 --unix-socket /run/podman/podman.sock http://d/libpod/_ping >/dev/null; then
            echo "socket not reachable as $(whoami) immediately before the suite" >&2
            sudo ls -la /run/podman >&2 || true
            cat /tmp/podman-rootful.log >&2
            exit 1
          fi
          echo "socket reachable as $(whoami)"

      - name: Run podman integration suite (rootful)
        working-directory: app
        env:
          SOCKGUARD_TEST_PODMAN_SOCKET: /run/podman/podman.sock
        run: go test -tags=podmanintegration -count=1 -timeout=10m ./integration/... ./internal/cmd/...

  integration-podman-rootless:
    name: "Integration (rootless podman)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # See the workflow-level comment above: rootless is exercised for
    # coverage but never blocks a PR on runner infrastructure quirks that
    # don't reflect most sockguard deployments.
    continue-on-error: true

    steps:
      # Stays audit for stage 1: same apt-get/mirror reasoning as the
      # rootful leg above. Revisit in stage 2.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap
          podman version

      - name: Verify rootless prerequisites
        run: |
          # ubuntu-24.04 ships newuidmap/newgidmap (from the uidmap
          # package, installed above defensively in case the base image
          # ever drops it) as setuid-root binaries, plus a default
          # /etc/subuid and /etc/subgid range for the runner user — both
          # required for podman's rootless user-namespace remapping. Fail
          # fast with a clear message instead of a confusing podman error
          # if either is ever missing on a future runner image.
          #
          # Checked by grepping the files directly rather than `getent
          # subuid`/`getent subgid`: glibc on ubuntu-24.04 has no subuid/
          # subgid NSS database registered at all, so getent fails with
          # "Unknown database" regardless of what /etc/subuid actually
          # contains — it's not a signal of a missing range.
          command -v newuidmap
          command -v newgidmap
          grep -q "^$(whoami):" /etc/subuid || { echo "no /etc/subuid range for $(whoami)" >&2; exit 1; }
          grep -q "^$(whoami):" /etc/subgid || { echo "no /etc/subgid range for $(whoami)" >&2; exit 1; }

      - name: Start rootless podman system service
        run: |
          # The runner user has no logind session on ubuntu-24.04 (no
          # interactive login), so XDG_RUNTIME_DIR / /run/user/<uid> is
          # never auto-created the way it would be on a desktop or a
          # `machinectl shell` session. Create and own it explicitly rather
          # than relying on pam_systemd, which is what most of the flakiness
          # in ad-hoc "rootless podman in CI" recipes traces back to.
          runtime_dir="/run/user/$(id -u)"
          sudo mkdir -p "${runtime_dir}"
          sudo chown "$(id -u)":"$(id -g)" "${runtime_dir}"
          echo "XDG_RUNTIME_DIR=${runtime_dir}" >>"$GITHUB_ENV"
          # GITHUB_ENV only reaches *subsequent* steps — podman in this step
          # needs it too, and it won't create the socket's parent dir itself
          # (`bind: no such file or directory` otherwise).
          export XDG_RUNTIME_DIR="${runtime_dir}"
          mkdir -p "${runtime_dir}/podman"

          nohup podman system service --time=0 "unix://${runtime_dir}/podman/podman.sock" >/tmp/podman-rootless.log 2>&1 &
          # Single gate, for the same reason as the rootful leg above: the
          # socket path appearing proves nothing (the service unlinks and
          # rebinds it during startup, so a `test -S` that just passed can
          # fail milliseconds later), and the service accepting connections
          # is the condition that actually matters. Poll straight for that.
          ready=""
          for _ in $(seq 1 30); do
            if timeout 10s podman --url "unix://${runtime_dir}/podman/podman.sock" version >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "rootless podman service never accepted a connection after 30 attempts" >&2
            echo "--- socket state ---" >&2
            ls -la "${runtime_dir}/podman" >&2 || true
            echo "--- service log ---" >&2
            cat /tmp/podman-rootless.log >&2
            exit 1
          fi
          echo "rootless podman service ready on ${runtime_dir}/podman/podman.sock"

      - name: Pre-pull busybox sentinel image
        run: |
          ref=$(sed -nE 's/^[[:space:]]*const[[:space:]]+busyboxPinnedRef[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' app/integration/helpers_test.go)
          if [[ ! "$ref" =~ ^busybox:[[:alnum:]_.-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid or unpinned busyboxPinnedRef: ${ref}" >&2
            exit 1
          fi
          echo "Pre-pulling pinned sentinel image (rootless): ${ref}"
          podman --url "unix://${XDG_RUNTIME_DIR}/podman/podman.sock" pull "${ref}"

      - name: Run podman integration suite (rootless)
        working-directory: app
        env:
          SOCKGUARD_TEST_PODMAN_SOCKET: ${{ env.XDG_RUNTIME_DIR }}/podman/podman.sock
        run: go test -tags=podmanintegration -count=1 -timeout=10m ./integration/... ./internal/cmd/...
