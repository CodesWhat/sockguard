name: "Release: From Tag"
run-name: "Release: From Tag — ${{ github.ref_name }}"

on:
  push:
    tags: ['v*']

permissions: read-all

env:
  DOCKER_PLATFORMS: linux/amd64,linux/arm64
  CI_VERIFY_WORKFLOW_FILE: ci-verify.yml
  GORELEASER_VERSION: v2.18.0

concurrency:
  group: release-from-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: "Release: Verify Prior CI Success"
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # Poll loop waits for prior branch CI status on tag SHA
    permissions:
      contents: read
      actions: read

    outputs:
      latest: ${{ steps.source.outputs.latest }}
      major_latest: ${{ steps.source.outputs.major_latest }}

    steps:
      # PKG-1: block mode. Hosts come from this job's harden-runner audit log
      # for the v2.1.0 and v2.1.0-rc.2 tag runs, plus the Node download hosts
      # a warm tool cache hides.
      #   github.com: Checkout, and the git ls-remote in Verify release tag is
      #     branch HEAD
      #   api.github.com: the curl loop in ./.github/actions/verify-ci-success
      #   raw.githubusercontent.com: Setup Node's actions/node-versions manifest
      #   objects.githubusercontent.com: Setup Node's toolchain tarball on a cold
      #     tool cache, the legacy redirect twin of the host below
      #   release-assets.githubusercontent.com: that same tarball, current host
      #   *.actions.githubusercontent.com: Actions runtime and log upload
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 30

      - name: Checkout (retry)
        id: checkout_retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout final retry
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        run: sleep 60

      - name: Checkout (final retry)
        id: checkout_final
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Assert tag version format
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "${tag_version}" ] || [ "${tag_version}" = "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match expected format vX.Y.Z[-prerelease]."
            exit 1
          fi

          echo "Tag version: ${tag_version}"

      - name: Setup Node (for release metadata check)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          # This job's checkout is what release-cut.yml pushed and what
          # downstream jobs (goreleaser, docker publish) build from -- a
          # poisoned npm cache restored here sits on the same critical path
          # the changelog job's identical comment describes below.
          # setup-node auto-enables npm caching because root package.json
          # declares "packageManager": "npm@...", so caching must be turned
          # off explicitly via package-manager-cache (zizmor cache-poisoning).
          package-manager-cache: false

      - name: Verify release tag is branch HEAD
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -z "${DEFAULT_BRANCH}" ]; then
            echo "::error::Repository default branch is empty."
            exit 1
          fi
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} resolved to invalid SHA '${GITHUB_SHA}'."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          major="${tag_version%%.*}"
          minor_and_rest="${tag_version#*.}"
          minor="${minor_and_rest%%.*}"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            expected_refs=(
              "refs/heads/dev/v${major}.${minor}"
              "refs/heads/maintenance/${major}.${minor}.x"
              "refs/heads/${DEFAULT_BRANCH}"
            )
            primary_ref="refs/heads/dev/v${major}.${minor}"
            expected_description="dev/v${major}.${minor} or maintenance/${major}.${minor}.x"
          else
            expected_refs=("refs/heads/${DEFAULT_BRANCH}" "refs/heads/maintenance/${major}.${minor}.x")
            primary_ref="refs/heads/${DEFAULT_BRANCH}"
            expected_description="${DEFAULT_BRANCH} or maintenance/${major}.${minor}.x"
          fi

          if ! remote_records="$(git ls-remote --exit-code origin "${expected_refs[@]}")"; then
            echo "::error::Could not resolve ${expected_description} HEAD from origin."
            exit 1
          fi
          if [ -z "${remote_records}" ]; then
            echo "::error::Origin returned no ${expected_description} branch heads."
            exit 1
          fi

          seen_refs=""
          matched_ref=""
          default_sha=""
          while IFS=$'\t' read -r remote_sha remote_ref extra; do
            expected_ref=false
            for candidate_ref in "${expected_refs[@]}"; do
              if [ "${remote_ref}" = "${candidate_ref}" ]; then
                expected_ref=true
                break
              fi
            done

            if [[ ! "${remote_sha}" =~ ^[0-9a-f]{40}$ ]] || [ -n "${extra:-}" ] || [ "${expected_ref}" != true ]; then
              echo "::error::Origin returned an invalid ${expected_description} HEAD record."
              exit 1
            fi
            if grep -Fqx -- "${remote_ref}" <<< "${seen_refs}"; then
              echo "::error::Origin returned duplicate ${remote_ref} HEAD records."
              exit 1
            fi
            seen_refs="${seen_refs}${remote_ref}"$'\n'
            if [ "${remote_ref}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
              default_sha="${remote_sha}"
            fi
            if [ "${remote_sha}" = "${GITHUB_SHA}" ] && { [[ "${GITHUB_REF_NAME}" != *-* ]] || [ "${remote_ref}" != "refs/heads/${DEFAULT_BRANCH}" ]; }; then
              if [ "${matched_ref}" != "${primary_ref}" ]; then
                matched_ref="${remote_ref}"
              fi
            fi
          done <<< "${remote_records}"

          if [ -z "${matched_ref}" ]; then
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              echo "::error::Prerelease tag ${GITHUB_REF_NAME} SHA ${GITHUB_SHA} must equal the head of ${expected_description}."
            else
              echo "::error::Stable tag ${GITHUB_REF_NAME} SHA ${GITHUB_SHA} must equal ${DEFAULT_BRANCH} HEAD."
            fi
            exit 1
          fi

          matched_branch="${matched_ref#refs/heads/}"
          latest=false
          major_latest=false
          if [[ "${matched_branch}" == maintenance/* ]]; then
            if [ -z "${default_sha}" ]; then
              echo "::error::Cannot resolve default-branch support policy."
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "${default_sha}"
            major_latest="$(git show "${default_sha}:SECURITY.md" | node scripts/verify-maintenance-line.mjs "${GITHUB_REF_NAME}")"
          elif [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            latest=true
            major_latest=true
          fi
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "major_latest=${major_latest}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "Prerelease tag ${GITHUB_REF_NAME} points at ${matched_branch} HEAD ${GITHUB_SHA}."
          else
            echo "Stable tag ${GITHUB_REF_NAME} points at ${matched_branch} HEAD ${GITHUB_SHA}."
          fi

      - name: Check tag against release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! node scripts/verify-tag-release-metadata.mjs --tag "${RELEASE_TAG}"; then
            echo "::error::Tag ${RELEASE_TAG} disagrees with release-facing metadata (website/chart/CHANGELOG). See RELEASING.md step 6 and issue #304."
            exit 1
          fi

      - name: Wait for successful branch CI on tag SHA
        uses: ./.github/actions/verify-ci-success
        with:
          workflow-file: ${{ env.CI_VERIFY_WORKFLOW_FILE }}
          target-sha: ${{ github.sha }}
          github-token: ${{ github.token }}

  changelog:
    name: "Release: Extract Changelog"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [verify-ci]
    permissions:
      contents: read

    steps:
      # PKG-1: block mode. This job checks out, runs two node scripts against
      # files already on disk, and uploads one artifact, so its audit-log
      # footprint is github.com plus the Actions runtime.
      #   github.com: Checkout
      #   raw.githubusercontent.com: Setup Node's actions/node-versions manifest
      #   objects.githubusercontent.com: Setup Node's toolchain tarball on a cold
      #     tool cache, the legacy redirect twin of the host below
      #   release-assets.githubusercontent.com: that same tarball, current host
      #   *.actions.githubusercontent.com: Upload release notes, plus the
      #     Actions runtime and log upload
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 30

      - name: Checkout (retry)
        id: checkout_retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout final retry
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        run: sleep 60

      - name: Checkout (final retry)
        id: checkout_final
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (for release scripts)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          # This job publishes real release notes for a tagged release —
          # unlike ci-verify.yml, nothing here runs with --skip=publish.
          # A poisoned dependency cache restored here could compromise a
          # ready-to-publish artifact. setup-node auto-enables npm caching
          # because root package.json declares "packageManager": "npm@...",
          # so caching must be turned off explicitly via
          # package-manager-cache, not via the cache input (zizmor
          # cache-poisoning).
          package-manager-cache: false

      - name: Extract changelog entry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_path="release-notes.md"

          entry_path="$(mktemp)"
          if ! node scripts/extract-changelog-entry.mjs --version "${RELEASE_TAG}" --file CHANGELOG.md --max-bytes 120000 > "${entry_path}"; then
            echo "::error::CHANGELOG entry missing for ${RELEASE_TAG}."
            exit 1
          fi

          {
            echo "# ${RELEASE_TAG}"
            echo ""
            cat "${entry_path}"
          } > "${notes_path}"
          rm -f "${entry_path}"

      - name: Upload release notes
        id: upload_release_notes
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

      - name: Wait before Upload release notes retry
        if: steps.upload_release_notes.outcome == 'failure'
        run: sleep 30

      - name: Upload release notes (retry)
        id: upload_release_notes_retry
        if: steps.upload_release_notes.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1
          overwrite: true

      - name: Wait before Upload release notes final retry
        if: steps.upload_release_notes.outcome == 'failure' && steps.upload_release_notes_retry.outcome == 'failure'
        run: sleep 60

      - name: Upload release notes (final retry)
        id: upload_release_notes_final
        if: steps.upload_release_notes.outcome == 'failure' && steps.upload_release_notes_retry.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1
          overwrite: true

  goreleaser:
    name: "Release: Go Binaries"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [verify-ci, changelog]
    permissions:
      contents: write
      id-token: write     # cosign keyless signing of the release archives
      attestations: write  # SLSA build provenance for those same archives

    steps:
      # PKG-1: block mode. Hosts come from this job's harden-runner audit log
      # for the v2.1.0 and v2.1.0-rc.2 tag runs.
      #   github.com: Checkout, GoReleaser's push to CodesWhat/homebrew-tap, and
      #     the release downloads for Setup Go, syft, cosign and goreleaser
      #   api.github.com: GoReleaser's release API calls, the gh calls in Publish
      #     and verify release notes, and Attest binary archive provenance
      #   uploads.github.com: GoReleaser uploading archives, checksums and SBOMs
      #   raw.githubusercontent.com: Setup Go's actions/go-versions manifest, and
      #     the syft installer script
      #   objects.githubusercontent.com: the tool tarballs above on a cold tool
      #     cache, the legacy redirect twin of the host below
      #   release-assets.githubusercontent.com: those same tarballs, current host
      #   proxy.golang.org: module downloads for Run GoReleaser, and syft's Go
      #     cataloger during SBOM generation
      #   storage.googleapis.com: the module proxy's blob backend for the above
      #   sum.golang.org: Go's checksum database. Warm runs reach it through the
      #     proxy and never resolve it directly, so it is absent from the audit
      #     log until a GOFLAGS or GONOSUMDB change makes it a direct fetch.
      #   get.anchore.io: Install syft's installer script
      #   toolbox-data.anchore.io: syft's own data fetch while generating SBOMs
      #   fulcio.sigstore.dev, rekor.sigstore.dev, timestamp.sigstore.dev,
      #     tuf-repo-cdn.sigstore.dev: the cosign bundle-signing blocks
      #     .goreleaser.yaml runs inside Run GoReleaser, and Attest binary
      #     archive provenance
      #   *.actions.githubusercontent.com: Download release notes, the OIDC token
      #     endpoint keyless signing and attestation need, and the runtime
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            storage.googleapis.com:443
            sum.golang.org:443
            get.anchore.io:443
            toolbox-data.anchore.io:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wait before Checkout retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 30

      - name: Checkout (retry)
        id: checkout_retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wait before Checkout final retry
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        run: sleep 60

      - name: Checkout (final retry)
        id: checkout_final
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          # This job builds and publishes the actual release binaries — no
          # --skip=publish here. A poisoned Go module cache restored here
          # could compromise a ready-to-publish artifact, so caching stays
          # off (zizmor cache-poisoning).
          cache: false

      - name: Require Homebrew tap token
        if: ${{ needs.verify-ci.outputs.latest == 'true' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HOMEBREW_TAP_TOKEN}" || {
            echo "::error::HOMEBREW_TAP_TOKEN is required to publish stable releases to CodesWhat/homebrew-tap."
            exit 1
          }

      - name: Download release notes
        id: download_release_notes
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Wait before Download release notes retry
        if: steps.download_release_notes.outcome == 'failure'
        run: sleep 30

      - name: Download release notes (retry)
        id: download_release_notes_retry
        if: steps.download_release_notes.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Wait before Download release notes final retry
        if: steps.download_release_notes.outcome == 'failure' && steps.download_release_notes_retry.outcome == 'failure'
        run: sleep 60

      - name: Download release notes (final retry)
        id: download_release_notes_final
        if: steps.download_release_notes.outcome == 'failure' && steps.download_release_notes_retry.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      # Required by .goreleaser.yaml's bundle-signing blocks, which shell out to
      # cosign during `goreleaser release`. Keep the binary pinned to the exact
      # version used to validate the bundle-signing flags.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # GoReleaser signs every artifact with its own parallel cosign run, and
      # on v2.3.3's first attempt two of them raced to write the shared TUF
      # cache and failed. Loading the trust root once, serially, leaves them
      # a warm cache to read.
      - name: Initialize Sigstore trust root
        id: cosign_init
        continue-on-error: true
        run: cosign initialize

      - name: Wait before Initialize Sigstore trust root retry
        if: steps.cosign_init.outcome == 'failure'
        run: sleep 30

      - name: Initialize Sigstore trust root (retry)
        id: cosign_init_retry
        if: steps.cosign_init.outcome == 'failure'
        continue-on-error: true
        run: cosign initialize

      - name: Wait before Initialize Sigstore trust root final retry
        if: steps.cosign_init.outcome == 'failure' && steps.cosign_init_retry.outcome == 'failure'
        run: sleep 60

      - name: Initialize Sigstore trust root (final retry)
        id: cosign_init_final
        if: steps.cosign_init.outcome == 'failure' && steps.cosign_init_retry.outcome == 'failure'
        run: cosign initialize

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes=../release-notes.md
          workdir: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ needs.verify-ci.outputs.latest == 'true' && secrets.HOMEBREW_TAP_TOKEN || '' }}
          RELEASE_LATEST: ${{ needs.verify-ci.outputs.latest }}

      - name: Publish and verify release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ ! -s release-notes.md ]; then
            echo "::error::Extracted release notes are missing or empty."
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" --notes-file release-notes.md

          expected_body="$(cat release-notes.md)"
          published_body="$(gh release view "${RELEASE_TAG}" --json body --jq '.body')"
          if [[ "${published_body}" != "${expected_body}" ]]; then
            echo "::error::Published release notes do not match the extracted CHANGELOG entry."
            exit 1
          fi

      # SLSA build provenance for the per-platform archives. The existing
      # attestation in the `release` job covers only the git-archive source
      # snapshot; the compiled binaries had none. Same visibility gate as the
      # other two attestation steps -- attestations need a public repo or
      # GHAS, and this repo is public, so it is live rather than dormant.
      - name: Attest binary archive provenance
        if: startsWith(github.ref, 'refs/tags/') && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          # goreleaser runs with `workdir: app`, so its dist/ is app/dist/.
          # The glob matches only the four release archives: checksums.txt is
          # .txt and the CycloneDX SBOMs are .json.
          subject-path: app/dist/*.tar.gz

  release:
    name: "Release: Docker Build & Push"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-publish
    needs: [verify-ci, goreleaser]
    permissions:
      contents: write
      packages: write
      id-token: write  # cosign keyless signing
      attestations: write
      artifact-metadata: write
    outputs:
      # The multi-arch manifest-list digest this job actually published,
      # from the build or from the manifest-only retry. pin-chart-digest
      # re-resolves it from the registry and refuses to write a pin the two
      # disagree about.
      digest: ${{ steps.digest.outputs.value }}

    steps:
      # PKG-1: block mode. This is the widest job in the pipeline and every host
      # below came out of its harden-runner audit log for the v2.1.0 and
      # v2.1.0-rc.2 tag runs, except sum.golang.org (see the goreleaser job's
      # note above).
      #   github.com: Checkout, and the release downloads for Set up QEMU, Set
      #     up Docker Buildx and Install cosign
      #   api.github.com: the two Attest ... provenance steps and gh release
      #   uploads.github.com: Upload signed release assets
      #   raw.githubusercontent.com: the buildx and QEMU install scripts
      #   objects.githubusercontent.com: those tool tarballs on a cold tool
      #     cache, the legacy redirect twin of the host below
      #   release-assets.githubusercontent.com: those same tarballs, current host
      #   ghcr.io, pkg-containers.githubusercontent.com: Log in to GHCR, Build
      #     and push, Sign/Verify container images, and the push-to-registry
      #     half of Attest build provenance
      #   registry-1.docker.io, auth.docker.io, index.docker.io,
      #     production.cloudfront.docker.com: Log in to Docker Hub, Set up
      #     QEMU's binfmt image pull, and the docker.io half of Build and push,
      #     Sign container images and Verify container image signatures
      #   quay.io, cdn01.quay.io: Log in to Quay.io and the quay.io half of
      #     those same three steps
      #   cgr.dev, *.r2.cloudflarestorage.com: the Chainguard static base image
      #     the Dockerfile builds on, and the R2 bucket its blobs redirect to.
      #     The bucket host is an opaque per-account hash, hence the wildcard.
      #   proxy.golang.org, storage.googleapis.com, sum.golang.org: the Go build
      #     that runs inside Build and push
      #   fulcio.sigstore.dev, rekor.sigstore.dev, timestamp.sigstore.dev,
      #     tuf-repo-cdn.sigstore.dev: Sign container images, Sign release
      #     artifact, both Verify steps, and the two attestation steps
      #   *.blob.core.windows.net: Build and push's cache-from/cache-to
      #     type=gha. Buildkit's GHA cache spreads across ten or more
      #     productionresultssaN hosts in a single run, so the one cache host
      #     harden-runner resolves for itself is not enough.
      #   *.actions.githubusercontent.com: the OIDC endpoint keyless signing
      #     needs, the cache results receiver, and the Actions runtime
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            ghcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            index.docker.io:443
            production.cloudfront.docker.com:443
            quay.io:443
            cdn01.quay.io:443
            cgr.dev:443
            *.r2.cloudflarestorage.com:443
            proxy.golang.org:443
            storage.googleapis.com:443
            sum.golang.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.blob.core.windows.net:443
            *.actions.githubusercontent.com:443

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 30

      - name: Checkout (retry)
        id: checkout_retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout final retry
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        run: sleep 60

      - name: Checkout (final retry)
        id: checkout_final
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        id: qemu
        continue-on-error: true
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Wait before Set up QEMU retry
        if: steps.qemu.outcome == 'failure'
        run: sleep 30

      - name: Set up QEMU (retry)
        id: qemu_retry
        if: steps.qemu.outcome == 'failure'
        continue-on-error: true
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Wait before Set up QEMU final retry
        if: steps.qemu.outcome == 'failure' && steps.qemu_retry.outcome == 'failure'
        run: sleep 60

      - name: Set up QEMU (final retry)
        id: qemu_final
        if: steps.qemu.outcome == 'failure' && steps.qemu_retry.outcome == 'failure'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Wait before Set up Docker Buildx retry
        if: steps.buildx.outcome == 'failure'
        run: sleep 30

      - name: Set up Docker Buildx (retry)
        id: buildx_retry
        if: steps.buildx.outcome == 'failure'
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Wait before Set up Docker Buildx final retry
        if: steps.buildx.outcome == 'failure' && steps.buildx_retry.outcome == 'failure'
        run: sleep 60

      - name: Set up Docker Buildx (final retry)
        id: buildx_final
        if: steps.buildx.outcome == 'failure' && steps.buildx_retry.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/codeswhat/sockguard
            quay.io/codeswhat/sockguard
          flavor: latest=false
          tags: |
            # full semver on all tags (e.g. 0.1.0, 0.1.0-rc.1)
            type=semver,pattern={{version}}
            # major.minor on stable only (e.g. 0.1)
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            # major only from its newest recorded minor line (e.g. 2)
            type=semver,pattern={{major}},enable=${{ needs.verify-ci.outputs.major_latest == 'true' }}
            # global latest only for stable releases from the default branch
            type=raw,value=latest,enable=${{ needs.verify-ci.outputs.latest == 'true' }}

      - name: Compute build date
        id: build_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        continue-on-error: true  # allow manifest retry path on transient push failures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retry manifest publish on transient registry failure
        id: manifest-retry
        if: steps.build.outcome == 'failure'
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_DIGEST:-}" ]; then
            echo "::error::Build step failed before producing a digest; cannot retry manifest publish without a source digest."
            exit 1
          fi

          source_candidates=(
            "ghcr.io/${GITHUB_REPOSITORY}@${BUILD_DIGEST}"
            "docker.io/codeswhat/sockguard@${BUILD_DIGEST}"
            "quay.io/codeswhat/sockguard@${BUILD_DIGEST}"
          )

          source_ref=""
          for candidate in "${source_candidates[@]}"; do
            if docker buildx imagetools inspect "${candidate}" >/dev/null 2>&1; then
              source_ref="${candidate}"
              break
            fi
          done

          if [ -z "${source_ref}" ]; then
            echo "::error::No registry contains source manifest digest ${BUILD_DIGEST}; cannot perform manifest-only retry."
            exit 1
          fi

          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            echo "Re-pushing manifest tag: ${tag} (source: ${source_ref})"
            for attempt in 1 2 3; do
              if docker buildx imagetools create --tag "${tag}" "${source_ref}" >/dev/null; then
                break
              fi

              if [ "${attempt}" -eq 3 ]; then
                echo "::error::Manifest publish retry failed for ${tag}"
                exit 1
              fi

              sleep 5
            done
          done <<< "${TAGS}"

          echo "digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Resolve image digest
        id: digest
        if: steps.build.outcome == 'success' || steps.manifest-retry.outcome == 'success'
        env:
          RETRY_DIGEST: ${{ steps.manifest-retry.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "value=${RETRY_DIGEST:-$BUILD_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.build.outcome == 'success' || steps.manifest-retry.outcome == 'success'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"  # keep in lockstep with the goreleaser job's pin above

      - name: Sign container images
        if: always() && steps.digest.outputs.value
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # A signature covers the repository and digest, not the tag, so one
          # per repository covers every tag and keeps the Rekor uploads to one
          # per registry.
          images=()
          seen=" "
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            repo="${tag}"
            last="${repo##*/}"
            if [[ "${last}" == *:* ]]; then
              repo="${repo%:*}"
            fi
            case "${seen}" in
              *" ${repo} "*) ;;
              *)
                seen="${seen}${repo} "
                images+=("${repo}@${DIGEST}")
                ;;
            esac
          done <<< "${TAGS}"
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::No images found to sign"
            exit 1
          fi

          # Rekor can store an upload and still time out. cosign then resends
          # it and gets a 409. A new cosign run signs with a fresh key and
          # certificate, so a retry can't hit the same entry.
          for attempt in 1 2 3; do
            if cosign sign --yes "${images[@]}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::cosign sign failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::cosign sign attempt ${attempt} failed, retrying in ${delay}s"
            sleep "${delay}"
          done

      - name: Verify container image signatures
        if: always() && steps.digest.outputs.value
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          identity_regex="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-from-tag.yml@refs/tags/.+$"
          issuer="https://token.actions.githubusercontent.com"

          retry_network() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                return 1
              fi
              sleep 5
            done
          }

          # A signature covers the repository and digest, not the tag, so one
          # per repository covers every tag and keeps the Rekor uploads to one
          # per registry.
          images=()
          seen=" "
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            repo="${tag}"
            last="${repo##*/}"
            if [[ "${last}" == *:* ]]; then
              repo="${repo%:*}"
            fi
            case "${seen}" in
              *" ${repo} "*) ;;
              *)
                seen="${seen}${repo} "
                images+=("${repo}@${DIGEST}")
                ;;
            esac
          done <<< "${TAGS}"

          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::No images found to verify"
            exit 1
          fi

          for image in "${images[@]}"; do
            echo "Verifying cosign signature for ${image}"
            if ! retry_network cosign verify \
              --certificate-identity-regexp "${identity_regex}" \
              --certificate-oidc-issuer "${issuer}" \
              "${image}" >/dev/null; then
              echo "::error::Cosign verification failed for ${image}"
              exit 1
            fi
          done

      - name: Build release artifact
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          artifact="dist/sockguard-${RELEASE_TAG}.tar.gz"
          git archive --format=tar.gz --prefix="sockguard-${RELEASE_TAG}/" --output="${artifact}" "${GITHUB_SHA}"
          sha256sum "${artifact}" > "${artifact}.sha256"

      - name: Sign release artifact
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact="dist/sockguard-${RELEASE_TAG}.tar.gz"

          # Sigstore bundle format, cosign v3's default: one
          # file carries signature + certificate + Rekor inclusion proof.
          cosign sign-blob --yes \
            --bundle "${artifact}.sigstore.json" \
            "${artifact}"

          if [ ! -s "${artifact}.sigstore.json" ]; then
            echo "::error::Expected sigstore bundle was not generated"
            ls -la dist
            exit 1
          fi

      - name: Verify release artifact signature
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact="dist/sockguard-${RELEASE_TAG}.tar.gz"
          identity_regex="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-from-tag.yml@refs/tags/.+$"
          issuer="https://token.actions.githubusercontent.com"

          retry_network() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                return 1
              fi
              sleep 5
            done
          }

          retry_network cosign verify-blob \
            --bundle "${artifact}.sigstore.json" \
            --certificate-identity-regexp "${identity_regex}" \
            --certificate-oidc-issuer "${issuer}" \
            "${artifact}" >/dev/null

      # SLSA build provenance attestations require public repo or GHAS.
      # Gated on visibility so private alpha releases still ship without them;
      # once the repo flips to public, attestations auto-activate.
      - name: Attest release artifact provenance
        if: startsWith(github.ref, 'refs/tags/') && github.event.repository.visibility == 'public'
        id: attest_release_artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/sockguard-${{ github.ref_name }}.tar.gz

      - name: Export release provenance asset
        if: startsWith(github.ref, 'refs/tags/') && github.event.repository.visibility == 'public'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUNDLE_PATH: ${{ steps.attest_release_artifact.outputs.bundle-path }}
        run: |
          artifact="dist/sockguard-${RELEASE_TAG}.tar.gz"
          cp "${BUNDLE_PATH}" "${artifact}.intoto.jsonl"

      - name: Upload signed release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(
            "dist/sockguard-${RELEASE_TAG}.tar.gz"
            "dist/sockguard-${RELEASE_TAG}.tar.gz.sha256"
            "dist/sockguard-${RELEASE_TAG}.tar.gz.sigstore.json"
          )
          # Only include provenance if it was produced (public repo path).
          intoto="dist/sockguard-${RELEASE_TAG}.tar.gz.intoto.jsonl"
          if [ -f "${intoto}" ]; then
            assets+=("${intoto}")
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber

      - name: Attest build provenance
        if: always() && steps.digest.outputs.value && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

  verify-homebrew:
    name: "Release: Verify Homebrew"
    needs: [verify-ci, release]
    if: ${{ needs.verify-ci.outputs.latest == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # GitHub-hosted macOS runners default to --no-quarantine. Clear it so
      # this exercises the same Gatekeeper path as a normal user install.
      HOMEBREW_CASK_OPTS: ""

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            formulae.brew.sh:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Verify Homebrew cask install
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          brew tap CodesWhat/tap https://github.com/CodesWhat/homebrew-tap.git
          brew install --cask codeswhat/tap/sockguard
          if xattr -p com.apple.quarantine "$(command -v sockguard)" >/dev/null 2>&1; then
            echo "::error::Homebrew-installed sockguard retained its quarantine attribute."
            exit 1
          fi
          sockguard version -o json | jq -e \
            --arg version "${RELEASE_VERSION#v}" \
            '.version == $version'
          brew uninstall --cask sockguard

  publish-chart:
    # HELM-PUB. Publishes the chart as an OCI artifact at
    # oci://ghcr.io/codeswhat/charts/sockguard and signs it keyless like the
    # image, so `helm install` has a signed, immutable source.
    #
    # Gated exactly like `latest` and the Homebrew cask: verify-ci's `latest`
    # output is true only for a stable tag whose SHA is the default branch
    # HEAD. Prereleases and maintenance lines publish no chart, so an older
    # 2.4.x patch can never move the chart channel backwards.
    #
    # The tagged tree still carries the prepublication (empty) image.tag,
    # because pin-chart-digest writes the digest to the development branch
    # only after this release is verified. This job therefore applies the same
    # pin to its own throwaway checkout before packaging, from the digest the
    # release job pushed and re-resolved from GHCR, so the published chart
    # references the immutable image digest rather than a mutable tag.
    #
    # Chart publishing is isolated from the image release. Nothing else
    # needs this job: verify-published (QA-6), verify-homebrew and
    # pin-chart-digest do not wait on it, so a chart failure cannot skip or
    # redden them. verify-chart is the chart's own signature check.
    #
    # Only this job holds packages: write; the release job's write access is
    # for the image, and the rest of the file stays at packages: read or less.
    name: "Release: Publish Helm Chart"
    needs: [verify-ci, release]
    if: ${{ needs.verify-ci.outputs.latest == 'true' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # helm push to ghcr.io/codeswhat/charts
      id-token: write   # cosign keyless signing

    steps:
      # PKG-1: block mode. Same shape as the pin-chart-digest and release
      # jobs, plus the Helm download and the Sigstore signing endpoints.
      #   github.com: Checkout, and Install cosign's release download
      #   api.github.com: Setup Node's release lookup
      #   raw.githubusercontent.com: Setup Node's actions/node-versions manifest
      #   objects.githubusercontent.com: Setup Node's and cosign's tarballs on
      #     a cold tool cache, the legacy redirect twin of the host below
      #   release-assets.githubusercontent.com: those same tarballs, current host
      #   get.helm.sh, *.blob.core.windows.net: the checksum-verified Helm
      #     tarball. get.helm.sh fronts a blob store, hence the wildcard that
      #     the other jobs already carry for the Actions cache.
      #   ghcr.io, pkg-containers.githubusercontent.com: Log in to GHCR, the
      #     manifest-list digest lookup, helm push and cosign sign/verify
      #   fulcio.sigstore.dev, rekor.sigstore.dev, timestamp.sigstore.dev,
      #     tuf-repo-cdn.sigstore.dev: keyless signing and verification
      #   *.actions.githubusercontent.com: the OIDC endpoint keyless signing
      #     needs, and the Actions runtime and log upload
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            get.helm.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.blob.core.windows.net:443
            *.actions.githubusercontent.com:443

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 30

      - name: Checkout (retry)
        id: checkout_retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout final retry
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        run: sleep 60

      - name: Checkout (final retry)
        id: checkout_final
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (for release scripts)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          # No npm cache in a job that publishes and signs (zizmor
          # cache-poisoning); see the pin-chart-digest job.
          package-manager-cache: false

      # The tarball is pinned by version and SHA-256 (from
      # https://get.helm.sh/helm-<version>-linux-amd64.tar.gz.sha256sum) and
      # refused on any mismatch. Bump both together.
      - name: Install Helm
        env:
          HELM_VERSION: v4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        run: |
          set -euo pipefail
          retry_network() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                return 1
              fi
              sleep 5
            done
          }

          download_dir="$(mktemp -d)"
          archive="${download_dir}/helm.tar.gz"
          retry_network curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${archive}" | sha256sum --check --strict -

          bin_dir="${RUNNER_TEMP}/helm-bin"
          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" --strip-components=1 linux-amd64/helm
          echo "${bin_dir}" >> "$GITHUB_PATH"
          "${bin_dir}/helm" version --short

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"  # keep in lockstep with the goreleaser job's pin above

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published manifest-list digest
        id: digest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_DIGEST}" ]; then
            echo "::error::The release job published no digest; refusing to publish the chart."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${repository}:${version}"

          # Same read and same pipefail/SIGPIPE care as pin-chart-digest.
          digest="$(docker buildx imagetools inspect "${image_ref}" --format '{{.Manifest.Digest}}' || true)"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            digest="$(docker buildx imagetools inspect "${image_ref}" | awk '$1 == "Digest:" && !seen { print $2; seen = 1 }' || true)"
          fi
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve a manifest-list digest for ${image_ref}."
            exit 1
          fi
          if [ "${digest}" != "${BUILD_DIGEST}" ]; then
            echo "::error::${image_ref} resolves to ${digest} but the release job published ${BUILD_DIGEST}; refusing to pin a digest this pipeline did not push."
            exit 1
          fi

          echo "value=${digest}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${image_ref} is ${digest}."

      # Written to this job's checkout only. Nothing here is committed;
      # pin-chart-digest owns the development-branch commit.
      - name: Pin the chart image digest (packaged copy only)
        env:
          RELEASE_VERSION: ${{ steps.digest.outputs.version }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          set -euo pipefail
          node scripts/pin-chart-image-digest.mjs \
            --version "${RELEASE_VERSION}" \
            --digest "${IMAGE_DIGEST}"

      - name: Package and check the chart
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.digest.outputs.version }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/chart"
          mkdir -p "${out_dir}"

          helm lint chart/sockguard
          helm package chart/sockguard --destination "${out_dir}"
          package="${out_dir}/sockguard-${RELEASE_VERSION}.tgz"
          if [ ! -f "${package}" ]; then
            echo "::error::helm package did not produce ${package}; Chart.yaml version disagrees with the tag."
            exit 1
          fi

          # Read the contract back out of the artifact that will be pushed,
          # not out of the source tree.
          helm show chart "${package}" > "${out_dir}/Chart.yaml"
          helm show values "${package}" > "${out_dir}/values.yaml"
          node scripts/assert-chart-release.mjs \
            --tag "${RELEASE_TAG}" \
            --digest "${IMAGE_DIGEST}" \
            --chart "${out_dir}/Chart.yaml" \
            --values "${out_dir}/values.yaml"

          echo "path=${package}" >> "$GITHUB_OUTPUT"

      # helm keeps its own registry credentials, so the docker/login-action
      # step above is not relied on for it. The whole login, password included,
      # runs inside the retried function: piping into retry_network would hand
      # the password to the first attempt only and leave later ones an empty
      # stdin.
      - name: Log in to GHCR with Helm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          helm_login() {
            printf '%s' "${GH_TOKEN}" | helm registry login ghcr.io \
              --username "${GH_ACTOR}" --password-stdin
          }
          for attempt in 1 2 3 4 5; do
            if helm_login; then
              exit 0
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "::error::helm registry login failed after 5 attempts"
              exit 1
            fi
            sleep 5
          done

      # scripts/ci/chart-oci.sh is shared with chart-publish-rehearsal.yml. A
      # chart version is a release, not a moving tag: it never pushes over an
      # existing one. A definite not-found pushes; anything else fails; an
      # existing version is adopted and checked below, so a rerun after a
      # partial publish finishes the job instead of needing a human.
      - name: Push the chart to GHCR
        id: push
        env:
          CHART_PACKAGE: ${{ steps.package.outputs.path }}
          CHART_VERSION: ${{ steps.digest.outputs.version }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          CHART_REGISTRY="ghcr.io/${owner}/charts" bash scripts/ci/chart-oci.sh push

      - name: Check the published chart contents
        env:
          CHART_PACKAGE: ${{ steps.package.outputs.path }}
          CHART_VERSION: ${{ steps.digest.outputs.version }}
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          CHART_REGISTRY="ghcr.io/${owner}/charts" bash scripts/ci/chart-oci.sh verify-contents

      # A new GHCR package is private and unlinked, and nothing in the push can
      # change that. Operators and QA-6 pull it anonymously, so fail here with
      # the manual fix rather than let verify-chart find out.
      - name: Check the package is public and linked to the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          package_url="orgs/${owner}/packages/container/charts%2Fsockguard"
          settings_url="https://github.com/orgs/${owner}/packages/container/charts%2Fsockguard/settings"

          if ! info="$(gh api "${package_url}" --jq '[.visibility, (.repository.full_name // "")] | @tsv')"; then
            echo "::error::Could not read ${package_url}. Check by hand at ${settings_url}: the package must be Public and linked to ${GITHUB_REPOSITORY}."
            exit 1
          fi
          IFS=$'\t' read -r visibility linked <<< "${info}"

          problems=""
          if [ "${visibility}" != "public" ]; then
            problems="visibility is '${visibility}', not public. "
          fi
          if [ "$(printf '%s' "${linked}" | tr '[:upper:]' '[:lower:]')" != "$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" ]; then
            problems="${problems}linked repository is '${linked:-none}', not ${GITHUB_REPOSITORY}. "
          fi
          if [ -n "${problems}" ]; then
            echo "::error::The chart package is not ready: ${problems}Fix it at ${settings_url} (Change visibility: Public; Connect repository: ${GITHUB_REPOSITORY}), then rerun this job. See RELEASING.md, \"Publishing the chart\"."
            exit 1
          fi
          echo "Package is public and linked to ${linked}."

      # A rerun that adopted an existing version signs it only if it is not
      # already signed; a signed one just has its signature re-verified.
      - name: Sign and verify the chart
        env:
          CHART_REF: ${{ steps.push.outputs.ref }}
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
          ALREADY_PUBLISHED: ${{ steps.push.outputs.exists }}
        run: |
          set -euo pipefail
          identity_regex="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-from-tag.yml@refs/tags/.+$"
          issuer="https://token.actions.githubusercontent.com"
          verify_signature() {
            cosign verify \
              --certificate-identity-regexp "${identity_regex}" \
              --certificate-oidc-issuer "${issuer}" \
              "${CHART_REF}@${CHART_DIGEST}" > /dev/null
          }

          if [ "${ALREADY_PUBLISHED}" = "true" ] && verify_signature; then
            echo "${CHART_REF}@${CHART_DIGEST} is already signed and verifies; nothing to sign."
            exit 0
          fi

          # Rekor can store an upload and still time out, and cosign then gets
          # a 409 on the resend. A new cosign run signs with a fresh key and
          # certificate, so a retry can't hit the same entry.
          for attempt in 1 2 3; do
            if cosign sign --yes "${CHART_REF}@${CHART_DIGEST}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::cosign sign failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::cosign sign attempt ${attempt} failed, retrying in ${delay}s"
            sleep "${delay}"
          done

          for attempt in 1 2 3 4 5; do
            if verify_signature; then
              exit 0
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "::error::cosign verify of the chart failed after 5 attempts"
              exit 1
            fi
            sleep 5
          done

      - name: Summarize
        if: always()
        env:
          CHART_REF: ${{ steps.push.outputs.ref }}
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
          ALREADY_PUBLISHED: ${{ steps.push.outputs.exists }}
          RELEASE_VERSION: ${{ steps.digest.outputs.version }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          {
            echo "### Helm chart publish"
            if [ -z "${CHART_DIGEST}" ]; then
              echo "- Did not get as far as pushing the chart; see the failing step above."
            else
              echo "- Chart: \`oci://${CHART_REF}\` version \`${RELEASE_VERSION}\`"
              echo "- Chart digest: \`${CHART_DIGEST}\` (cosign keyless signed)"
              echo "- Version already existed before this run: ${ALREADY_PUBLISHED}"
              echo "- Pins image: \`${RELEASE_VERSION}@${IMAGE_DIGEST}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify-chart:
    # Runs the documented `cosign verify` against the published chart. Its own
    # job on purpose: a chart problem is its own red check and must not skip
    # or fail verify-published (image + tarball QA-6), Homebrew, or the pin.
    # `latest` and the chart's publish-chart both skip together, so a skipped
    # publish-chart makes this a skip too.
    name: "Release: Verify Published Helm Chart"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [publish-chart]
    if: ${{ !cancelled() && needs.publish-chart.result == 'success' }}
    permissions:
      contents: read
    steps:
      # PKG-1: block mode. The cosign verify half of verify-published, for the
      # ghcr.io chart only.
      #   github.com, raw.githubusercontent.com, objects.githubusercontent.com,
      #     release-assets.githubusercontent.com: Checkout and Install cosign
      #   api.github.com: the cosign installer's release lookup
      #   ghcr.io, pkg-containers.githubusercontent.com: the chart pull
      #   tuf-repo-cdn.sigstore.dev: cosign's Sigstore TUF root refresh
      #   *.actions.githubusercontent.com: Actions runtime and log upload
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            ghcr.io:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 30

      - name: Checkout (retry)
        id: checkout_retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout final retry
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        run: sleep 60

      - name: Checkout (final retry)
        id: checkout_final
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"  # keep in lockstep with the goreleaser job's pin above

      - name: Verify the published chart signature
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if scripts/verify-published-release.sh --chart-only --tag "${RELEASE_TAG}"; then
              exit 0
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep 5
          done

  verify-published:
    # QA-6 end-to-end signature verification: run the *exact* documented
    # cosign verify / cosign verify-blob commands from
    # docs/content/docs/verification.mdx against the artifacts we just
    # pushed. The `release` job above verifies signatures inline using
    # internal pipeline outputs (the build digest and local sigstore bundle).
    # This downstream twin pulls the published tag from each
    # mirror and downloads the release assets via `gh release download`,
    # so a documentation drift between docs and pipeline fails the tag.
    name: "Release: Verify Published Artifacts (QA-6)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [release]
    permissions:
      contents: read   # gh release download
    steps:
      # PKG-1: block mode. Hosts come from this job's harden-runner audit log
      # for the v2.1.0 and v2.1.0-rc.2 tag runs. It only reads, so it needs the
      # pull half of each registry and no signing endpoints beyond the TUF
      # roots cosign and gh refresh before verifying.
      #   github.com: Checkout, and Install cosign's release download
      #   api.github.com: gh release download and gh attestation verify, both
      #     inside Verify published image + tarball signatures
      #   raw.githubusercontent.com: the cosign installer script
      #   objects.githubusercontent.com: the cosign tarball and the release
      #     assets that script downloads, legacy twin of the host below
      #   release-assets.githubusercontent.com: those same downloads, current host
      #   ghcr.io, pkg-containers.githubusercontent.com: the cosign verify run
      #     against the ghcr.io tag
      #   index.docker.io, auth.docker.io, production.cloudfront.docker.com: the
      #     cosign verify run against the docker.io tag
      #   quay.io, cdn01.quay.io: the cosign verify run against the quay.io tag
      #   tuf-repo-cdn.sigstore.dev: cosign's Sigstore TUF root refresh
      #   tuf-repo.github.com, *.blob.core.windows.net: gh attestation verify's
      #     GitHub TUF root and the attestation bundle it then fetches
      #   *.actions.githubusercontent.com: Actions runtime and log upload
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            tuf-repo.github.com:443
            ghcr.io:443
            index.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            quay.io:443
            cdn01.quay.io:443
            tuf-repo-cdn.sigstore.dev:443
            *.blob.core.windows.net:443
            *.actions.githubusercontent.com:443

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 30

      - name: Checkout (retry)
        id: checkout_retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wait before Checkout final retry
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        run: sleep 60

      - name: Checkout (final retry)
        id: checkout_final
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"  # keep in lockstep with the goreleaser job's pin above

      - name: Verify published image + tarball signatures
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          retry_network() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                return 1
              fi
              sleep 5
            done
          }

          retry_network scripts/verify-published-release.sh --tag "${RELEASE_TAG}"

      - name: Summarize
        if: always()
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### QA-6: Published-artifact signature verification"
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Pulled \`ghcr.io\`, \`docker.io\`, \`quay.io\` image tags and ran the documented \`cosign verify\` against each"
            echo "- Downloaded the release tarball + .sigstore.json bundle and ran the documented \`cosign verify-blob\`"
            echo "- See \`docs/content/docs/verification.mdx\` for the canonical operator-facing invocation"
          } >> "$GITHUB_STEP_SUMMARY"

  release-image-scan:
    # Issue #318: neither Grype surface ever scanned the artifact users
    # actually pull — `security-grype.yml`'s scheduled job and ci-verify.yml's
    # PR-time gate both `docker build` from source, single-platform. This job
    # scans the *published* multi-arch manifest by digest, straight from the
    # registry, one platform at a time (Grype can't scan a manifest list in
    # one pass). Deliberately self-contained: it re-derives the tag with its
    # own `docker/metadata-action` call instead of consuming a `release` job
    # output, so it never touches that job's diff and stays a trivial rebase
    # against other in-flight changes to this file.
    name: "Release: Grype Scan (Published Image, ${{ matrix.platform }})"
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
          - platform: linux/arm64
            slug: linux-arm64
    steps:
      # PKG-1: block mode. The older note here said this job had no fixed
      # allowlist yet; the v2.1.0 and v2.1.0-rc.2 audit logs give one, and both
      # platform legs of both runs hit the same set.
      #   github.com: the buildx and grype release downloads
      #   api.github.com: Upload Grype SARIF to code scanning
      #   raw.githubusercontent.com: the buildx and grype installer scripts
      #   objects.githubusercontent.com: those tool tarballs on a cold tool
      #     cache, the legacy redirect twin of the host below
      #   release-assets.githubusercontent.com: those same tarballs, current host
      #   ghcr.io, pkg-containers.githubusercontent.com: Log in to GHCR, Resolve
      #     platform-specific digest, and Run Grype's pull of the published image
      #   registry-1.docker.io, auth.docker.io,
      #     production.cloudfront.docker.com: Set up Docker Buildx pulling its
      #     moby/buildkit driver image from Docker Hub
      #   get.anchore.io: the grype installer anchore/scan-action runs
      #   grype.anchore.io: grype's vulnerability database download
      #   *.actions.githubusercontent.com: Actions runtime and log upload
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            ghcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            get.anchore.io:443
            grype.anchore.io:443
            *.actions.githubusercontent.com:443

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        # Only the full-semver tag matters here: it's the one `release`
        # always publishes, prerelease or stable. Scoped to ghcr.io alone —
        # GITHUB_TOKEN reads it with no extra secret; docker.io/quay.io carry
        # the identical manifest (release job pushes one multi-arch build to
        # all three) so scanning ghcr.io's copy covers all three.
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}

      - name: Resolve platform-specific digest
        id: platform_digest
        timeout-minutes: 5
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          os="${PLATFORM%%/*}"
          arch="${PLATFORM##*/}"
          # Strip the :tag suffix rather than rebuilding from github.repository:
          # GHCR rejects mixed-case paths and github.repository preserves the
          # repo's actual case (CodesWhat/sockguard); IMAGE_REF is already the
          # lowercased ref docker/metadata-action produced, so reusing its
          # image portion keeps the case consistent with what actually pulls.
          image_no_tag="${IMAGE_REF%:*}"
          # The runner image ships docker with the buildx plugin; no builder is
          # set up here (REL-21), so confirm the plugin is actually present.
          if ! docker buildx version >/dev/null 2>&1; then
            echo "::error::docker buildx plugin missing from the runner image"
            exit 1
          fi
          manifest=""
          for attempt in 1 2 3; do
            if manifest="$(docker buildx imagetools inspect "${IMAGE_REF}" --raw)"; then
              break
            fi
            manifest=""
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::docker buildx imagetools inspect failed 3 times for ${IMAGE_REF}"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          digest="$(printf '%s' "${manifest}" | jq -r --arg os "${os}" --arg arch "${arch}" \
            '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest')"
          if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
            echo "::error::No manifest found for platform ${PLATFORM} in ${IMAGE_REF}"
            exit 1
          fi
          echo "ref=${image_no_tag}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Run Grype vulnerability scanner
        # Same severity gate as security-grype.yml's grype-image job: fail on
        # HIGH/CRITICAL. This is the one gate that scans what got published,
        # not what CI built from source.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        id: grype
        with:
          grype-version: v0.121.0
          image: ${{ steps.platform_digest.outputs.ref }}
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload Grype SARIF to code scanning
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-release-${{ matrix.slug }}

      - name: Summarize
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_REF: ${{ steps.platform_digest.outputs.ref }}
        run: |
          {
            echo "### Grype Container Scan — Published Image (${PLATFORM})"
            echo "- Scanned the published multi-arch manifest by resolved platform digest, pulled from the registry (not a from-source build)"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Fails on any HIGH or CRITICAL finding"
          } >> "$GITHUB_STEP_SUMMARY"

  pin-chart-digest:
    # REL-4. The chart's default `image.tag` is a two-stage pin (RELEASING.md,
    # "Helm chart"): empty before the cut so the DaemonSet falls back to
    # Chart.yaml's appVersion, then `<appVersion>@sha256:<manifest-list
    # digest>` once the images are live, because the digest does not exist
    # until they are. Every cut through v2.2.0 wrote that second stage by
    # hand afterwards (#430, #492). This job writes it.
    #
    # It commits to the active development branch and never to `main`.
    # `main` is the released version: its ruleset rejects a direct push
    # outright, and a commit landing there after the tag would move the
    # released tree past the thing that was tagged. `dev/*` accepts direct
    # pushes, and the pin reaches `main` at the next promotion, which is what
    # RELEASING.md's "in the active development branch" has always meant.
    # scripts/ci/active-dev-branch.sh reads that branch out of the tag's own
    # renovate.json -- release-cut.yml asserted the same value matched this
    # release line before the tag existed -- and fails closed on anything
    # that is not a single dev/vX.Y or maintenance/X.Y.x branch.
    #
    # Stable tags only. A prerelease deliberately leaves the chart on the
    # current stable version while it soaks, which is the case
    # verify-tag-release-metadata.mjs encodes, so there is nothing to pin.
    #
    # release-image-scan is not in `needs` on purpose: it is a Grype gate on
    # an already-published image, and a vulnerability-DB refresh reds it
    # independently of whether this release published correctly. The pin
    # waits on the jobs that assert the artifacts are the ones this pipeline
    # built.
    name: "Release: Pin Chart Image Digest"
    needs: [release, verify-published, verify-homebrew]
    if: ${{ always() && !contains(github.ref_name, '-') && needs.release.result == 'success' && needs.verify-published.result == 'success' && (needs.verify-homebrew.result == 'success' || needs.verify-homebrew.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # the pin commit, pushed to the development branch
      packages: read   # reading the published manifest list back from GHCR

    steps:
      # PKG-1: block mode. Same shape as the changelog job (checkout plus
      # Setup Node), with the GHCR read this job adds.
      #   github.com: Checkout, the git fetch/push of the development branch,
      #     and Setup Node's toolchain release download
      #   api.github.com: maintenance chart-pin PR creation and readback
      #   raw.githubusercontent.com: Setup Node's actions/node-versions manifest
      #   objects.githubusercontent.com: that toolchain tarball on a cold tool
      #     cache, the legacy redirect twin of the host below
      #   release-assets.githubusercontent.com: that same tarball, current host
      #   ghcr.io, pkg-containers.githubusercontent.com: Log in to GHCR and
      #     Resolve the published manifest-list digest
      #   *.actions.githubusercontent.com: Actions runtime and log upload
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            *.actions.githubusercontent.com:443

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Wait before Checkout retry
        if: steps.checkout.outcome == 'failure'
        run: sleep 30

      - name: Checkout (retry)
        id: checkout_retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Wait before Checkout final retry
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        run: sleep 60

      - name: Checkout (final retry)
        id: checkout_final
        if: steps.checkout.outcome == 'failure' && steps.checkout_retry.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node (for release scripts)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          # This job writes a commit to a protected-flow branch, so the same
          # cache-poisoning reasoning the changelog and verify-ci jobs record
          # applies: setup-node auto-enables npm caching because the root
          # package.json declares "packageManager", and it has to be turned
          # off explicitly through package-manager-cache (zizmor
          # cache-poisoning).
          package-manager-cache: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published manifest-list digest
        id: digest
        # No Set up Docker Buildx step: `imagetools inspect` is a registry
        # read through the default builder, not a build, so it needs neither
        # the container driver nor the buildkit image pull that setting one
        # up would add to the egress allowlist above.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_DIGEST}" ]; then
            echo "::error::The release job published no digest; refusing to pin the chart."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          # GHCR rejects a mixed-case path and github.repository preserves the
          # repository's actual case (CodesWhat/sockguard).
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${repository}:${version}"

          # `|| true` on both, and an awk that reads to EOF rather than
          # exiting on the first match: pipefail plus an early-exiting reader
          # is a SIGPIPE trap that would fail a pipeline which had already
          # parsed the value correctly.
          digest="$(docker buildx imagetools inspect "${image_ref}" --format '{{.Manifest.Digest}}' || true)"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            # Older buildx templates expose the descriptor differently; the
            # human-readable output has always carried the manifest-list
            # digest as its first top-level Digest line.
            digest="$(docker buildx imagetools inspect "${image_ref}" | awk '$1 == "Digest:" && !seen { print $2; seen = 1 }' || true)"
          fi
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve a manifest-list digest for ${image_ref}."
            exit 1
          fi

          if [ "${digest}" != "${BUILD_DIGEST}" ]; then
            echo "::error::${image_ref} resolves to ${digest} but the release job published ${BUILD_DIGEST}; refusing to pin a digest this pipeline did not push."
            exit 1
          fi

          echo "value=${digest}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "${image_ref} is ${digest}."

      # renovate.json is read from the tag's checkout, not from the branch
      # this is about to write to, so the answer comes from the commit
      # release-cut.yml already validated.
      - name: Resolve the active development branch
        id: target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="$(bash scripts/ci/active-dev-branch.sh renovate.json)"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "Pinning the chart image digest on ${branch}."

      - name: Check out the active development branch
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" FETCH_HEAD

      - name: Pin the chart image digest
        env:
          RELEASE_VERSION: ${{ steps.digest.outputs.version }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          set -euo pipefail
          node scripts/pin-chart-image-digest.mjs \
            --version "${RELEASE_VERSION}" \
            --digest "${IMAGE_DIGEST}"

      - name: Re-check release metadata
        run: node --test scripts/release-metadata.test.mjs

      - name: Commit the pin
        id: pin_commit
        env:
          RELEASE_VERSION: ${{ steps.digest.outputs.version }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart/sockguard/values.yaml
          if git diff --cached --quiet; then
            echo "chart image digest already pinned for ${RELEASE_VERSION} on ${TARGET_BRANCH} -- nothing to commit"
            exit 0
          fi
          git commit -m "chore(chart): pin the ${RELEASE_VERSION} image to its multi-arch digest"
          # Fully qualified so the push can only ever create or move a branch
          # ref, never resolve to a tag of the same name.
          if [[ "${TARGET_BRANCH}" == maintenance/* ]]; then
            if [ -z "${GH_TOKEN}" ]; then
              echo "::error::The release credential is required to open a maintenance pin PR and trigger its CI."
              exit 1
            fi
            pin_branch="chore/chart-pin-${RELEASE_VERSION}"
            remote_record="$(git ls-remote origin "refs/heads/${pin_branch}")"
            if [ -n "${remote_record}" ]; then
              git fetch --depth=1 origin "${pin_branch}"
              if ! git diff --quiet HEAD FETCH_HEAD; then
                echo "::error::The existing pin branch has a different tree; refusing to overwrite it."
                exit 1
              fi
            else
              git push origin "HEAD:refs/heads/${pin_branch}"
            fi
            existing_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base "${TARGET_BRANCH}" --head "${pin_branch}" --state open --json url --jq '.[0].url // ""')"
            if [ -z "${existing_pr}" ]; then
              body_file="$(mktemp)"
              trap 'rm -f "${body_file}"' EXIT
              printf 'Pin the %s chart image to its verified multi-arch digest (%s).\n' "${RELEASE_VERSION}" "${IMAGE_DIGEST}" > "${body_file}"
              existing_pr="$(gh pr create --repo "${GITHUB_REPOSITORY}" --base "${TARGET_BRANCH}" --head "${pin_branch}" \
                --title "chore(chart): pin the ${RELEASE_VERSION} image digest" --body-file "${body_file}")"
            fi
            published_pr="$(gh pr view --repo "${GITHUB_REPOSITORY}" "${existing_pr}" --json url,baseRefName,headRefName)"
            if ! jq -e --arg base "${TARGET_BRANCH}" --arg head "${pin_branch}" --arg prefix "https://github.com/${GITHUB_REPOSITORY}/pull/" \
              '.baseRefName == $base and .headRefName == $head and (.url | startswith($prefix))' <<< "${published_pr}" > /dev/null; then
              echo "::error::The maintenance pin PR did not match the intended source and protected branch."
              exit 1
            fi
            pin_pr_url="$(jq -r '.url' <<< "${published_pr}")"
            echo "pull_request=${pin_pr_url}" >> "$GITHUB_OUTPUT"
            echo "Chart pin awaits review and protected merge: ${pin_pr_url}"
          else
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi

      - name: Summarize
        if: always()
        env:
          PIN_REVIEW_URL: ${{ steps.pin_commit.outputs.pull_request }}
          RELEASE_VERSION: ${{ steps.digest.outputs.version }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          {
            echo "### Helm chart image pin"
            if [ -z "${RELEASE_VERSION}" ] || [ -z "${TARGET_BRANCH}" ]; then
              # Same lesson the mutation badge summary learned: a step that
              # never produced its outputs must name that, not format blanks.
              echo "- Did not get as far as writing a pin; see the failing step above."
            else
              echo "- Version: \`${RELEASE_VERSION}\`"
              echo "- Manifest-list digest: \`${IMAGE_DIGEST}\`"
              if [ -n "${PIN_REVIEW_URL}" ]; then
                echo "- Review PR: ${PIN_REVIEW_URL} (pin awaits protected merge)."
              fi
              echo "- Branch: \`${TARGET_BRANCH}\` (never \`main\` — it only advances through a promotion PR)"
              echo "- If the pin step printed a version-skew warning, the branch had already moved past this appVersion and nothing was written; pin by hand per RELEASING.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
