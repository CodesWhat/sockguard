name: "Security: Grype & Govulncheck"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Security: Grype & Govulncheck — Weekly run' ||
    github.event_name == 'pull_request' && format('Security: Grype & Govulncheck — PR #{0}', github.event.pull_request.number) ||
    format('Security: Grype & Govulncheck — Manual by {0}', github.actor)
  }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'dev/*']
  schedule:
    - cron: '15 7 * * 1'  # Weekly on Monday at 07:15 UTC

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.2.0

concurrency:
  group: security-grype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency / source / build changes are what move the security surface —
  # scope PR runs to those so doc-only PRs stay fast. This used to be a
  # `paths:` filter on the `pull_request:` trigger above, but a required
  # status check on a job inside a workflow that never triggers produces NO
  # check run at all — GitHub has nothing to mark "expected" or "green", so
  # branch protection blocks a doc-only PR forever. A job that *skips*
  # inside a workflow that *did* trigger reports `skipped`, which satisfies
  # branch protection. So the path scoping moved from the trigger into this
  # gate job instead, and the workflow itself always triggers on PRs now.
  changes:
    name: "Security: Changed Paths"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      security: ${{ steps.filter.outputs.security }}
    steps:
      # Stage 1 of the harden-runner egress rollout: pure `git fetch`/`git
      # diff` against the checked-out repo, no other tool download —
      # github.com/actions endpoints are the entire footprint. Stays audit
      # like the rest of this file's jobs pending stage 2 review.
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # need base-branch history to diff a PR against it

      - name: Determine whether security-relevant paths changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          # Deliberately no `-e`: every failure path below must fail OPEN
          # (still run the scans) rather than abort the job and silently
          # skip a security check with no clear reason why.

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "security=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exactly the path set removed from the pull_request trigger above.
          patterns='^(app/.*\.go|go\.mod|go\.sum|benchmarks/go\.mod|benchmarks/go\.sum|package\.json|package-lock\.json|(.*/)?package\.json|Dockerfile|\.github/workflows/security-grype\.yml)$'

          if ! git fetch --quiet origin "${BASE_REF}"; then
            echo "::warning::changes: could not fetch origin/${BASE_REF} — failing open, running the security scans"
            echo "security=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"; then
            echo "::warning::changes: git diff against origin/${BASE_REF} failed — failing open, running the security scans"
            echo "security=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # grep -c (not -q) so the pipeline always reads all of stdin —
          # grep -q can exit as soon as it finds a match, sending SIGPIPE
          # back up the pipe before printf has finished writing, which
          # under `set -o pipefail` can flip a real match into a failure.
          if printf '%s\n' "${changed}" | grep -cE "${patterns}" >/dev/null; then
            echo "security=true" >> "$GITHUB_OUTPUT"
          else
            echo "security=false" >> "$GITHUB_OUTPUT"
          fi

  govulncheck:
    name: "Security: Govulncheck"
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Stage 1 of the harden-runner egress rollout: pure Go, no Docker.
      # Same base endpoints as quality-fuzz-nightly.yml plus vuln.go.dev for
      # govulncheck's own vulnerability database fetch.
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            vuln.go.dev:443
            # setup-go resolves go.mod's version against actions/go-versions
            # first, then falls back to go.dev/dl/?mode=json. Warm runners hit
            # the manifest and never touch go.dev, so leaving this out passes
            # until the day the toolchain isn't cached and the job dies with
            # no related change.
            go.dev:443
            *.actions.githubusercontent.com:443
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Run govulncheck
        working-directory: app
        run: govulncheck ./...

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Govulncheck"
            echo "- Reachability-based scan of Go dependencies (call-graph aware)"
            echo "- Tool version: ${GOVULNCHECK_VERSION}"
            echo "- Database: Go Vulnerability Database (vuln.go.dev)"
          } >> "$GITHUB_STEP_SUMMARY"

  grype-image:
    name: "Security: Grype Container Scan"
    # PR-time image scanning now happens where the PR pipeline actually
    # builds the artifact: ci-verify.yml's required "Docker Build" job scans
    # the image it builds and fails the build on HIGH/CRITICAL findings
    # (gating-posture rule: Grype gates wherever the artifact is built).
    # This job stays scheduled/manual-only so the same image isn't scanned
    # twice per PR; it still catches newly disclosed CVEs against unchanged
    # images between PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      # Stays audit for stage 1: builds the Wolfi/Chainguard-based image
      # before scanning it, and that base-image pull can land on any of
      # Chainguard's CDN endpoints — not a fixed set. Same reasoning as
      # ci-verify.yml's "Docker Build" job. Revisit in stage 2.
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: sockguard:grype-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        id: grype
        with:
          image: sockguard:grype-scan
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload Grype SARIF to code scanning
        # Code scanning uploads require GHAS, not available on free private repos.
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Grype Container Scan"
            echo "- Scanned the built image (binary build-info → real shipped deps) for HIGH/CRITICAL CVEs"
            echo "- Base image: Wolfi (Chainguard)"
          } >> "$GITHUB_STEP_SUMMARY"

  grype-deps:
    name: "Security: Grype Dependency Scan (Go + npm)"
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      # Stage 1 of the harden-runner egress rollout: static scan of the
      # checked-out repo, no Docker build. Same endpoint set drydock already
      # runs in block mode for its own (npm-only) grype-deps job — this
      # extends it to the identical Go+npm scan sockguard runs.
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            get.anchore.io:443
            grype.anchore.io:443
            *.actions.githubusercontent.com:443
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Grype across the repository (Go modules + npm lockfiles)
        # Scanning the repo root catalogs every go.mod and package-lock.json,
        # so a single pass covers both ecosystems. Grype matches the
        # lockfile-resolved versions (not the full module graph), so it does
        # not emit the phantom-dependency findings the manifest-graph scanners do.
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        id: grype-deps
        with:
          path: .
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload Grype dependency SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: ${{ steps.grype-deps.outputs.sarif }}
          category: grype-deps

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Grype Dependency Scan (Go + npm)"
            echo "- Scanned Go modules and npm lockfiles across the repo for HIGH/CRITICAL CVEs"
            echo "- Matches lockfile-resolved versions (no module-graph false positives)"
          } >> "$GITHUB_STEP_SUMMARY"

  gosec:
    name: "Security: Gosec SAST"
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      # Stays audit for stage 1, same as Docker Build and grype-image: gosec
      # runs as a container action, and harden-runner's block mode drops
      # container egress silently rather than rejecting it, so every module
      # lookup gosec makes burns a full TCP timeout instead of failing fast.
      # Measured: this job completes in ~2 minutes on every other branch and
      # blew past timeout-minutes: 15 twice under block, with no denied
      # domain in the harden-runner log to show why. Revisit in stage 2,
      # when the container jobs get their egress characterised properly.
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Gosec
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3  # v2.28.0
        with:
          args: -exclude-generated -nosec-require-rules -nosec-require-justification -fmt sarif -out gosec-results.sarif ./app/...

      - name: Upload Gosec SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  testssl:
    # QA-4's DAST-class drift detector for the production mTLS posture:
    # builds sockguard with the same config builder the proxy ships with,
    # opens a real TCP+TLS listener, drives drwetter/testssl.sh against
    # it, and fails the job on HIGH or CRITICAL findings. Internal tests
    # pin the config at the code level (TestMutualTLSEdgeCases, the
    # builder unit tests); this catches the case where someone weakens
    # the wire posture from production config or a future env var that
    # the code-level tests would not exercise.
    name: "Security: testssl.sh (sockguard TLS posture)"
    # DAST is heavy (builds sockguard, pulls the testssl image, probes a
    # live listener) — keep it on scheduled/manual runs, not every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Stays audit PERMANENTLY, not just for stage 1: this is the DAST-class
      # job — it pulls a third-party scanner image and drives it against a
      # live listener it opens itself, so there is no stable allowlist to
      # write (unlike security-scorecard.yml's Scorecard job, which has the
      # same permanent-audit posture for the same reason: it queries a live,
      # third-party analysis surface).
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Pull testssl.sh image
        # Pinned by digest (alongside the 3.2 tag) to match scripts/security-testssl.sh
        # so CI pulls exactly the scanner the script runs; bump both together.
        run: docker pull drwetter/testssl.sh:3.2@sha256:76df1f7e31c305032b1d412aa420260ff7d9094710351854d7db0e0e4abbde3e

      - name: Run testssl.sh against a sockguard TLS listener
        run: scripts/security-testssl.sh

      - name: Upload testssl.sh output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: testssl-output-${{ github.run_id }}
          path: |
            testssl-output.json
            testssl-output.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Summarize
        if: always()
        run: |
          {
            echo "### testssl.sh sockguard TLS posture"
            echo "- Probed a sockguard TCP+TLS listener with the production config builder"
            echo "- Fails on any HIGH or CRITICAL finding"
            echo "- Tool: drwetter/testssl.sh:3.2 (DAST-class)"
          } >> "$GITHUB_STEP_SUMMARY"
