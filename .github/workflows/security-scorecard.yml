name: "Security: OpenSSF Scorecard"
run-name: >-
  ${{
    github.event_name == 'branch_protection_rule' && 'Security: OpenSSF Scorecard — Branch protection changed' ||
    github.event_name == 'schedule' && 'Security: OpenSSF Scorecard — Weekly schedule' ||
    format('Security: OpenSSF Scorecard — {0}', github.ref_name)
  }}

on:
  push:
    branches:
      - main
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

permissions: read-all

jobs:
  analysis:
    name: "Security: Scorecard Analysis"
    # OpenSSF Scorecard only runs on public repos; SARIF upload also requires GHAS.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read  # Checkout code
      security-events: write  # Upload SARIF results
      id-token: write  # Publish results to OpenSSF REST API

    steps:
      # Stays audit PERMANENTLY, not just for stage 1: OpenSSF Scorecard
      # queries a live, third-party best-practices/dependency-analysis
      # surface (deps.dev, OSV, the GitHub REST API, etc.) with no stable,
      # enumerable endpoint set — same permanent-audit posture as
      # security-grype.yml's testssl DAST job.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
