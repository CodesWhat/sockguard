name: "Security: ZAP Baseline (DAST)"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Security: ZAP Baseline — Weekly run' ||
    format('Security: ZAP Baseline — Manual by {0}', github.actor)
  }}

# getsockguard.com and its /docs subpath are static surfaces: no auth, no
# forms, no server-side handlers. Per the DAST tiering in security.md, a
# static surface gets a ZAP baseline PASSIVE scan only (headers, CSP,
# cookie flags) — not active ZAP, not Nuclei. There is deliberately no
# pull_request trigger: DAST runs against the already-deployed site, so it
# can never gate a PR that hasn't deployed yet (security.md gating
# posture) — a red run here is a triage signal, not a merge blocker.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1'  # Weekly on Monday at 08:30 UTC

permissions:
  contents: read

concurrency:
  group: security-zap-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: "ZAP Baseline: ${{ matrix.name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: website
            target: https://www.getsockguard.com
          - name: docs
            target: https://www.getsockguard.com/docs/
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          # Permanent exception (security.md "Actions hardening" recorded
          # exceptions), not staged audit->block drift: this job scans a
          # live Vercel-fronted third-party endpoint outside the repo's own
          # infrastructure, so there is no stable destination set to pin to
          # `block`. Same class of exception as drydock's dast-zap-baseline
          # job.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: ${{ matrix.target }}
          # The action's `token` input defaults to ${{ github.token }} and
          # exists only to file findings as a GitHub issue, which
          # allow_issue_writing: false already disables. Pass it empty so
          # this third-party JS action never receives a repository token at
          # all, rather than relying on the job's contents:read scope to
          # limit what it could do with one.
          token: ''
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef  # stable digest, 2026-08-17
          rules_file_name: .zap/rules.tsv
          # No GitHub issue on findings: a red run in the Actions tab is
          # already the triage signal (house preference — see security.md
          # gating posture). Keeps this job's permissions at contents:read.
          allow_issue_writing: false
          # Findings mark the run red. Advisory, not a merge blocker: there
          # is no pull_request trigger above, so this never gates a PR.
          fail_action: true
          artifact_name: zap-baseline-${{ matrix.name }}-${{ github.run_id }}

      - name: Summarize
        if: always()
        run: |
          {
            echo "### ZAP Baseline: ${{ matrix.name }}"
            echo "- Target: ${{ matrix.target }}"
            echo "- Passive scan only (headers, CSP, cookie flags) — static surface, no active ZAP/Nuclei"
            echo "- Scheduled/advisory: a red run is a triage signal, never a PR gate"
          } >> "$GITHUB_STEP_SUMMARY"
