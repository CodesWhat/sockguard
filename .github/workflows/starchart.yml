name: Star Chart

# Regenerates the committed star-history SVG pair (light + dark) via the
# shared reusable workflow. Dispatch-only, and dispatch on the dev branch:
# RELEASING.md's metadata-sync step runs
#
#   gh workflow run starchart.yml --ref dev/vX.Y
#
# before each cut, so the chart in a released README is as of that release.
# Not a cron — a committed artifact refreshed on a schedule mutates
# underneath a tag, which main=GA forbids. And not `release: [published]` —
# GoReleaser publishes our releases with GITHUB_TOKEN, whose events GitHub
# suppresses, so that trigger never fires on this repo's own cuts
# (CodesWhat/.github#36).
#
# The accent is the repository's logo colour; the dark-theme variant is
# derived inside the reusable workflow (lightness lift at fixed hue and
# saturation until it clears 6:1 on #0d1117 — #c05a0c derives to #f0710f),
# so there is only one value to keep in sync. The registry is in ops
# standards/readme-shape.md.

on:
  workflow_dispatch:

permissions: {}

jobs:
  starchart:
    permissions:
      contents: write # Commit the regenerated pair back to the dispatched branch.
    uses: CodesWhat/.github/.github/workflows/starchart-refresh.yml@11004e42d7d19e86eb3b7777c467ec9522b784e1 # main 2026-08-21
    with:
      # The branch the dispatch ran on, so nothing rotates at a branch cut.
      # The reusable workflow rejects a default-branch target, so a stray
      # dispatch on main fails loudly instead of committing to it.
      branch: ${{ github.ref_name }}
      output-path: website/public/star-history.svg
      accent: "#c05a0c"
