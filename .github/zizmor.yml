# zizmor configuration
# https://docs.zizmor.sh/configuration/

rules:
  self-repository:
    # zizmor wants `uses: $/.github/actions/...` instead of the
    # workspace-relative `./.github/actions/...` in these two. The advice is
    # right in principle (GitHub shipped `$/` on 2026-07-30; it resolves to
    # the running commit, needs no checkout, and can't be fooled by whatever
    # a prior step left on the filesystem), and both call sites here are
    # already checked out at the running ref, so the swap would be a
    # behavioural no-op.
    #
    # It is ignored because actionlint does not know the syntax yet.
    # actionlint 1.7.12, the current release, rejects `$/...` with "invalid
    # format because ref is missing". The `raven-actions/actionlint` gate in
    # ci-verify.yml is SHA-pinned but installs the latest actionlint at run
    # time, so the executable version floats; the day it ships `$/` support
    # this ignore becomes unnecessary rather than wrong. Until then, taking
    # zizmor's fix reds a required PR check to satisfy a low-severity style
    # preference on two release workflows.
    #
    # The ignores are line-scoped so a new self-repository finding anywhere
    # else in these files still fails the gate. If either call site moves,
    # zizmor reports the finding again and the line here needs updating.
    #
    # Revisit when actionlint ships `$/` support: drop this block, run
    # `zizmor --fix`, and confirm `actionlint .github/workflows/` is clean.
    ignore:
      - release-cut.yml:79
      - release-from-tag.yml:173

  cache-poisoning:
    # zizmor flags any setup-go/setup-node caching step in a workflow that
    # triggers on push to main/release branches or on a schedule, since a
    # poisoned cache restored there could compromise a published artifact.
    # ci-verify.yml never publishes anything, though: the reusable go-ci
    # GoReleaser Config gate runs `release --snapshot --clean --skip=publish`,
    # and every other job here (go-ci's Go Lint/Go Test/fuzz matrix, node-ci's
    # Biome Lint/TS Test/Build Workspaces, CodeQL) is a lint/test/fuzz check
    # with no artifact leaving the runner. The
    # actual release publish path is release-from-tag.yml, which has caching
    # disabled on its setup-go/setup-node steps instead of being ignored
    # here.
    ignore:
      - ci-verify.yml
