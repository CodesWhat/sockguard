# Grype configuration — false-positive suppressions for the dependency scan.
#
# Each ignore rule below is a vetted false positive, not a silenced real risk.
# Coverage is unaffected: govulncheck (build-graph reachability) and gosec/CodeQL
# still run with no suppressions, and any NEW advisory on these packages surfaces
# normally — only the specific advisory ID listed here is ignored.
ignore:
  # GO-2026-4610 — "Docker CLI Plugins: Uncontrolled Search Path Element Leads to
  # Local Privilege Escalation on Windows." Fixed in docker/cli 29.2.0; sockguard
  # pins v29.5.3 (indirect), well past the fix. Grype's go-module matcher
  # mis-compares the `+incompatible` semver suffix and flags every docker/cli
  # version regardless of the fix, so a version bump can't clear it. docker/cli is
  # never linked into the shipped binary (`go mod why github.com/docker/cli` →
  # "main module does not need package github.com/docker/cli") and govulncheck
  # reports no vulnerabilities. Windows-only vector; sockguard ships a Linux binary.
  - vulnerability: GO-2026-4610
    package:
      name: github.com/docker/cli
      type: go-module

  # GO-2026-5932 applies only to the unmaintained x/crypto/openpgp subpackages
  # and has no fixed x/crypto version. Sockguard uses x/crypto for cryptobyte;
  # the shipped binary does not contain any openpgp package (`go list -deps
  # ./cmd/sockguard`), and govulncheck reports zero reachable vulnerabilities.
  # Grype matches the module build-info/manifest without package reachability,
  # so both its image and dependency scans otherwise emit this false positive.
  - vulnerability: GO-2026-5932
    package:
      name: golang.org/x/crypto
      type: go-module

  # github.com/docker/docker is imported only by the test-only app/compat module,
  # for its v28 API data types (the compat suite decodes sockguard's filtered
  # responses into them). It runs no daemon code, is never linked into the
  # shipped binary (app/compat is its own module, excluded from the Docker build
  # context), and the module has no patched release: it ends at v28.5.2 and moby
  # moved to github.com/moby/moby/*. Scoped by location so a docker/docker
  # dependency anywhere else still fails the scan. Same reasoning as the Qlty
  # triage and the dependency-review allow list for that module.
  - package:
      name: github.com/docker/docker
      type: go-module
      location: "**/app/compat/go.mod"
