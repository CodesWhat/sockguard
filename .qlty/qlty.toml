config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/*.d.ts",
  "**/.next/**",
  "**/.turbo/**",
  "**/.yarn/**",
  "**/build/**",
  "**/coverage/**",
  "**/dist/**",
  "**/generated/**",
  "**/node_modules/**",
  "**/testdata/**",
  "**/vendor/**",
  ".claude/**",
  ".planning/**",
  ".qlty/**",
  ".secrets/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

# Table-driven Go tests and large integration harnesses inflate whole-file
# complexity without giving much actionable signal. Keep function-level smells on.
[smells.file_complexity]
enabled = false

[[source]]
name = "default"
default = true

# Plugin set mirrors portwing and drydock (both Go + TS + Markdown + YAML +
# shell + Dockerfile monorepos): actionlint, checkov, dockerfmt, hadolint,
# markdownlint, osv-scanner, radarlint-iac, ripgrep, shellcheck, shfmt,
# trufflehog, yamllint. No Go-specific plugin (gofmt/golangci-lint/staticcheck)
# is enabled here, same as those two repos — golangci-lint already runs as its
# own lefthook step and CI job, so a duplicate Go linter inside the Qlty gate
# would just double-report the same findings.

[[plugin]]
name = "actionlint"

[[plugin]]
name = "checkov"

[[plugin]]
name = "dockerfmt"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "markdownlint"
mode = "comment"
# Pinned so the markdownlint ruleset is identical locally and in CI. Left
# unpinned, qlty resolves whatever markdownlint the installed CLI defaults to,
# which drifts between a developer's qlty and CI's (latest) qlty.
version = "0.46.0"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "shellcheck"
# Pinned to the version GitHub Actions ubuntu-latest pre-installs.
# qlty otherwise resolves to the latest (0.11.0) and rejects the runner's
# 0.9.0 binary with "Invalid tool version", failing the lint job.
version = "0.9.0"

[[plugin]]
name = "shfmt"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"

# markdownlint table column style is low-signal for this repository's docs
# format, same as portwing and drydock.
[[triage]]
match.rules = ["markdownlint:MD060"]
set.ignored = true

# workflow_dispatch inputs in the fuzz/soak/tri-tool-conformance/release-cut
# workflows are intentional runtime controls (fuzz duration, soak duration,
# conformance overrides, release tag) that a maintainer supplies when
# dispatching the run manually — dispatching already requires write access, so
# the "user" steering the build is not an anonymous caller. checkov's
# CKV_GHA_7 fires on the mere presence of any workflow_dispatch input, which
# does not hold for these. Same rationale as portwing and drydock.
[[triage]]
match.rules = ["checkov:CKV_GHA_7"]
set.ignored = true

# GO-2026-5932 (golang.org/x/crypto/openpgp, unmaintained/unsafe by design,
# no fixed version) is an indirect dependency pulled in transitively by the
# sigstore/go-containerregistry/go-tuf image-trust stack. `go mod why
# golang.org/x/crypto` shows the main module does not need the package
# directly, and `govulncheck ./...` confirms 0 reachable vulnerabilities in
# code sockguard imports or calls. Same conclusion portwing reached for the
# identical advisory.
[[triage]]
match.rules = ["osv-scanner:GO-2026-5932"]
set.ignored = true
