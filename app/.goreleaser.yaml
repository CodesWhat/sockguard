version: 2

project_name: sockguard

before:
  hooks:
    - go mod tidy

builds:
  - id: sockguard
    main: ./cmd/sockguard/
    binary: sockguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/codeswhat/sockguard/v2/app/internal/version.Version={{.Version}}
      - -X github.com/codeswhat/sockguard/v2/app/internal/version.Commit={{.Commit}}
      - -X github.com/codeswhat/sockguard/v2/app/internal/version.BuildDate={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - id: cyclonedx
    documents:
      - "${artifact}.cyclonedx.json"
    cmd: syft
    # Mirrors GoReleaser's own default syft args (sbom.go:80) apart from the
    # output format. Naming `args:` at all replaces the whole default slice, so
    # --enrich all has to be restated or the SBOM ships without dependency
    # license data.
    args: ["$artifact", "--output", "cyclonedx-json=$document", "--enrich", "all"]
    artifacts: archive

# Keyless cosign bundles for the per-platform archives users actually
# download. The source snapshot built in the workflow's separate `release`
# job is a different artifact and has its own bundle.
#
# Signs checksums.txt as well as the archives, so a consumer can verify the
# whole release from one signature or any single archive on its own.
#
# Keyless needs `id-token: write` on the goreleaser job and the cosign binary
# on PATH -- both added alongside this in release-from-tag.yml.
#
# GoReleaser runs one signing command per artifact, in parallel, from its
# working directory (`app` in the release workflow). Each goes through
# scripts/cosign-sign-blob-retry.sh, which retries a failed `cosign sign-blob`
# up to three times. The workflow loads the Sigstore trust root once before
# GoReleaser starts so the parallel runs don't race on the shared TUF cache.
#
# v2 publishes only the sigstore bundle format: one `.sigstore.json` file per
# artifact carries the signature, certificate, and Rekor inclusion proof.
signs:
  - id: cosign-keyless-bundle
    cmd: bash
    signature: "${artifact}.sigstore.json"
    args:
      - "../scripts/cosign-sign-blob-retry.sh"
      - "--yes"
      # Cosign v3's bundle format. No legacy-output overrides belong here.
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
  - id: cosign-keyless-archives-bundle
    cmd: bash
    signature: "${artifact}.sigstore.json"
    args:
      - "../scripts/cosign-sign-blob-retry.sh"
      - "--yes"
      # Same bundle contract as checksums.txt above.
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  # The workflow supplies --release-notes, which makes GoReleaser load that
  # file and skip generated notes. Disabling this pipe skips the file load too.
  disable: false

release:
  draft: false
  prerelease: auto  # RC tags marked as prerelease

homebrew_casks:
  - name: sockguard
    ids:
      - default
    binaries:
      - sockguard
    homepage: https://getsockguard.com/
    description: Default-deny Docker socket proxy with request-aware policy enforcement
    caveats: |
      Sockguard needs access to a Docker socket and an explicit policy configuration.
      See https://getsockguard.com/docs/getting-started before starting it.
      The macOS binary is not yet Apple notarized. This cask removes its quarantine
      attribute after Homebrew verifies the release archive checksum.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "sockguard"], chdir: "."
        end
      end
    skip_upload: auto
    repository:
      owner: CodesWhat
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: security@codeswhat.com
