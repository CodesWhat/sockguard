version: 2

project_name: sockguard

before:
  hooks:
    - go mod tidy

builds:
  - id: sockguard
    main: ./cmd/sockguard/
    binary: sockguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/codeswhat/sockguard/app/internal/version.Version={{.Version}}
      - -X github.com/codeswhat/sockguard/app/internal/version.Commit={{.Commit}}
      - -X github.com/codeswhat/sockguard/app/internal/version.BuildDate={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  disable: true  # Release notes come from CHANGELOG.md via extract-changelog-entry.mjs

release:
  draft: false
  prerelease: auto  # RC tags marked as prerelease

homebrew_casks:
  - name: sockguard
    ids:
      - default
    binaries:
      - sockguard
    homepage: https://getsockguard.com/
    description: Default-deny Docker socket proxy with request-aware policy enforcement
    caveats: |
      Sockguard needs access to a Docker socket and an explicit policy configuration.
      See https://getsockguard.com/docs/getting-started before starting it.
      The macOS binary is not yet Apple notarized. This cask removes its quarantine
      attribute after Homebrew verifies the release archive checksum.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sockguard"]
          end
    skip_upload: auto
    repository:
      owner: CodesWhat
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: security@codeswhat.com
