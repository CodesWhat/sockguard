# Sockguard, Dozzle with Actions Preset
#
# Extends the dozzle preset with the container actions behind
# DOZZLE_ENABLE_ACTIONS: the start, stop and restart buttons (and the bulk
# versions of them).
# Allows: everything in dozzle.yaml plus
#         POST /containers/{id}/start
#         POST /containers/{id}/stop
#         POST /containers/{id}/restart
# Denies: container remove (Dozzle's server route accepts a "remove" action
# but its UI never offers one), kill, rename, update, create and exec,
# image pulls and the image-update flow (pull, recreate, rollback), prune
# (the host prune buttons) and Dozzle's self-update. Those buttons fail with
# a refusal. Use a wider custom config if you want them.
# Swarm mode and agent mode are untested with this preset.
#
# Derived from Dozzle v11.5.0, internal/container/docker/client.go
# (ContainerActions) and internal/web/routes.go
# (POST /api/hosts/{host}/containers/{id}/actions/{action}).

upstream:
  socket: /var/run/docker.sock

log:
  level: info
  format: json
  access_log: true

health:
  enabled: true
  path: /health

# Dozzle's whole purpose is reading container logs, which are an explicit
# read-exfiltration route.
insecure_allow_read_exfiltration: true

# Response redaction stays on (the defaults). Dozzle's list view reads names,
# ids, images, state, labels and ports, none of which are redacted. Container
# env stays redacted because Dozzle never reads it. Mount paths and network
# addresses also stay redacted, so those two details show placeholder or empty
# values in Dozzle's container panel instead of real host paths and IPs.

rules:
  # Dozzle pings the daemon on connect to negotiate the API version.
  - match: { method: GET, path: "/_ping" }
    action: allow
  - match: { method: HEAD, path: "/_ping" }
    action: allow

  # Engine identity: Info (host name, id, root dir, swarm state) and
  # ServerVersion (Podman detection).
  - match: { method: GET, path: "/version" }
    action: allow
  - match: { method: GET, path: "/info" }
    action: allow

  # Container start/die/health events drive the live container list and the
  # per-container stats streams.
  - match: { method: GET, path: "/events" }
    action: allow

  # Container reads
  - match: { method: GET, path: "/containers/json" }
    action: allow
  - match: { method: GET, path: "/containers/*/json" }
    action: allow
  - match: { method: GET, path: "/containers/*/stats" }
    action: allow
  - match: { method: GET, path: "/containers/*/logs" }
    action: allow

  # Container actions (DOZZLE_ENABLE_ACTIONS): start, stop, restart only.
  # Dozzle sends no signal query on stop or restart. The Engine API honors
  # ?signal= on both, which would make them arbitrary signal delivery (kill is
  # denied below), so any request carrying a signal is refused first.
  - match: { method: POST, path: "/containers/*/stop", query: { signal: ["*"] } }
    action: deny
    reason: "stop with a signal is not allowed by dozzle-with-actions preset"
  - match: { method: POST, path: "/containers/*/restart", query: { signal: ["*"] } }
    action: deny
    reason: "restart with a signal is not allowed by dozzle-with-actions preset"
  - match: { method: POST, path: "/containers/*/start" }
    action: allow
  - match: { method: POST, path: "/containers/*/stop" }
    action: allow
  - match: { method: POST, path: "/containers/*/restart" }
    action: allow

  # Deny everything else
  - match: { method: "*", path: "/**" }
    action: deny
    reason: "not allowed by dozzle-with-actions preset"
