# Sockguard — Podman Read-Only Preset
#
# Read-only monitoring posture covering BOTH of Podman's API surfaces behind
# a single sockguard instance: the Docker-compat `/vN.NN/...` paths (the
# existing Docker inspectors apply to these unchanged) and Podman's native
# `/libpod/...` paths (their own, structurally separate inspectors — see
# the Podman guide at https://getsockguard.com/docs/podman for the full
# routing model). Point this at either a rootful `/run/podman/podman.sock`
# or a rootless `$XDG_RUNTIME_DIR/podman/podman.sock` — the rule set itself
# does not change; only `upstream.socket` does.
#
# This preset intentionally keeps container process monitoring on both API
# surfaces. Docker-compatible GET /containers/{id}/top forwards caller-selected
# ps_args to the daemon's host `ps`, and native GET
# /libpod/containers/{id}/top exposes the same process-list class. Both return
# process command lines outside response redaction, so
# insecure_allow_read_exfiltration: true below acknowledges that exposure. Raw
# archive/export/logs/attach streams, native pod top, and image/manifest pushes
# remain off the allowlist on both surfaces.
#
# No write operations are allowed on either surface. This includes native
# POST /libpod/build. If you add that path later, it uses request_body.build
# for primary/additional remote contexts, host-network, and Dockerfile RUN
# inspection. Host volume, local-path additional, and multipart local controls
# plus rusage output to a daemon-host file additionally require
# insecure_allow_body_blind_writes.
#
# Use for: dashboards and monitoring tools watching a Podman host that want
# least-privilege reads instead of readonly.yaml's blanket GET /**.

upstream:
  socket: /run/podman/podman.sock

log:
  level: info
  format: json
  access_log: true

health:
  enabled: true
  path: /health

insecure_allow_read_exfiltration: true

rules:
  # --- Docker-compat surface: health + metadata ---
  - match: { method: GET, path: "/_ping" }
    action: allow
  - match: { method: HEAD, path: "/_ping" }
    action: allow
  - match: { method: GET, path: "/version" }
    action: allow
  - match: { method: GET, path: "/info" }
    action: allow
  - match: { method: GET, path: "/events" }
    action: allow

  # --- Docker-compat surface: container reads ---
  # Process monitoring is intentionally admitted and acknowledged above.
  # Logs / archive / attach / export remain deliberately omitted.
  - match: { method: GET, path: "/containers/json" }
    action: allow
  - match: { method: GET, path: "/containers/*/json" }
    action: allow
  - match: { method: GET, path: "/containers/*/stats" }
    action: allow
  - match: { method: GET, path: "/containers/*/top" }
    action: allow
  - match: { method: GET, path: "/containers/*/changes" }
    action: allow

  # --- Docker-compat surface: image reads ---
  # /images/get and /images/*/get (raw tarball exfil) intentionally excluded.
  - match: { method: GET, path: "/images/json" }
    action: allow
  - match: { method: GET, path: "/images/**/json" }
    action: allow
  - match: { method: GET, path: "/images/**/history" }
    action: allow

  # --- Docker-compat surface: network + volume reads ---
  - match: { method: GET, path: "/networks" }
    action: allow
  - match: { method: GET, path: "/networks/*" }
    action: allow
  - match: { method: GET, path: "/volumes" }
    action: allow
  - match: { method: GET, path: "/volumes/*" }
    action: allow

  # --- libpod (native) surface: health + metadata ---
  - match: { method: GET, path: "/libpod/_ping" }
    action: allow
  - match: { method: HEAD, path: "/libpod/_ping" }
    action: allow
  - match: { method: GET, path: "/libpod/version" }
    action: allow
  - match: { method: GET, path: "/libpod/info" }
    action: allow
  - match: { method: GET, path: "/libpod/events" }
    action: allow

  # --- libpod surface: container reads ---
  # Archive / export / logs / attach deliberately omitted, same rationale
  # as the Docker-compat container reads above.
  - match: { method: GET, path: "/libpod/containers/json" }
    action: allow
  - match: { method: GET, path: "/libpod/containers/*/json" }
    action: allow
  - match: { method: GET, path: "/libpod/containers/*/stats" }
    action: allow
  - match: { method: GET, path: "/libpod/containers/*/top" }
    action: allow
  - match: { method: GET, path: "/libpod/containers/*/changes" }
    action: allow

  # --- libpod surface: pod reads (no Docker-compat equivalent) ---
  - match: { method: GET, path: "/libpod/pods/json" }
    action: allow
  - match: { method: GET, path: "/libpod/pods/*/json" }
    action: allow
  - match: { method: GET, path: "/libpod/pods/stats" }
    action: allow

  # --- libpod surface: image reads ---
  # /libpod/images/export, /libpod/images/*/get, and image/manifest pushes
  # are exfiltration surfaces (see insecure_allow_read_exfiltration docs)
  # and intentionally excluded, same as the Docker-compat side.
  - match: { method: GET, path: "/libpod/images/json" }
    action: allow
  - match: { method: GET, path: "/libpod/images/*/json" }
    action: allow

  # --- libpod surface: network, volume, secret reads ---
  # Inspect responses use libpod's own /{id}/json shape, not Docker-compat's
  # bare /{id} — see the Podman guide for the single-element-array quirk on
  # network inspect.
  - match: { method: GET, path: "/libpod/networks/json" }
    action: allow
  - match: { method: GET, path: "/libpod/networks/*/json" }
    action: allow
  - match: { method: GET, path: "/libpod/volumes/json" }
    action: allow
  - match: { method: GET, path: "/libpod/volumes/*/json" }
    action: allow
  - match: { method: GET, path: "/libpod/secrets/json" }
    action: allow
  - match: { method: GET, path: "/libpod/secrets/*/json" }
    action: allow

  # Deny everything else — both surfaces, all writes.
  - match: { method: "*", path: "/**" }
    action: deny
    reason: "podman read-only mode — write operations and exfiltration-gated reads are not allowed"
