# Sockguard — Portainer Preset
#
# Full Docker API access for Portainer management UI.
# Portainer proxies the entire Docker API — it needs everything.
#
# WARNING: This preset grants near-full Docker socket access.
# Use client CIDR gates or client-container label ACLs to restrict other consumers.

upstream:
  socket: /var/run/docker.sock

log:
  level: info
  format: json
  access_log: true

health:
  enabled: true
  path: /health

# Portainer needs broad Docker write access, including body-sensitive endpoints
# such as container create, exec, build, and swarm management. Container-create
# bodies are inspected by default, but bind-mounted workloads are denied until
# you allowlist their host paths here. Image pulls and build requests are
# inspected too, and this preset widens those controls to preserve Portainer's
# expected functionality. Exec and swarm-management writes still require the
# unsafe opt-in below because Portainer allows arbitrary commands and cluster
# mutation.
request_body:
  container_create:
    allowed_bind_mounts: []
  image_pull:
    allow_all_registries: true
  build:
    allow_remote_context: true
    allow_host_network: true
    allow_run_instructions: true

# The broad "/images/**" allow rule below inherits GET
# /images/{name}/attestations (Engine API 1.53+) without Portainer or this
# preset ever having reasoned about it. allow_attestation_statements defaults
# to false; set explicitly here so the deny posture for full attestation
# statement content (?statement=true) is visible at the call site rather than
# relying on the implicit default.
response:
  allow_attestation_statements: false

insecure_allow_body_blind_writes: true
insecure_allow_read_exfiltration: true

rules:
  # Health and metadata
  - match: { method: "*", path: "/_ping" }
    action: allow
  - match: { method: GET, path: "/version" }
    action: allow
  - match: { method: GET, path: "/info" }
    action: allow
  - match: { method: GET, path: "/events" }
    action: allow

  # Containers (full lifecycle)
  - match: { method: "*", path: "/containers/**" }
    action: allow

  # Images (full management)
  - match: { method: "*", path: "/images/**" }
    action: allow

  # Networks (full management)
  - match: { method: "*", path: "/networks/**" }
    action: allow

  # Volumes (full management)
  - match: { method: "*", path: "/volumes/**" }
    action: allow

  # Exec (into containers)
  - match: { method: "*", path: "/exec/**" }
    action: allow

  # System
  - match: { method: GET, path: "/system/**" }
    action: allow

  # Build (classic builder only — POST /build), commit, auth. This does NOT
  # cover a default `docker compose build` / Buildx build: those drive
  # dockerd's embedded BuildKit over the hijacked POST /session and
  # POST /grpc streams instead of POST /build, and both stay denied by the
  # catch-all below unless insecure_accept_opaque_buildkit_tunnels: true is
  # also set (this preset does not set it).
  - match: { method: POST, path: "/build" }
    action: allow
  - match: { method: POST, path: "/commit" }
    action: allow
  - match: { method: POST, path: "/auth" }
    action: allow

  # Distribution
  - match: { method: GET, path: "/distribution/**" }
    action: allow

  # Swarm (if applicable)
  - match: { method: "*", path: "/swarm/**" }
    action: allow
  - match: { method: "*", path: "/services/**" }
    action: allow
  - match: { method: GET, path: "/tasks/**" }
    action: allow
  - match: { method: "*", path: "/nodes/**" }
    action: allow
  - match: { method: "*", path: "/configs/**" }
    action: allow
  - match: { method: "*", path: "/secrets/**" }
    action: allow

  # Plugins
  - match: { method: "*", path: "/plugins/**" }
    action: allow

  # Deny everything else
  - match: { method: "*", path: "/**" }
    action: deny
    reason: "not allowed by portainer preset"
