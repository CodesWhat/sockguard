# Sockguard — Traefik Preset
#
# Minimal read-only access for Traefik's Docker provider.
#
# Allows exactly the endpoints Traefik calls: container list + inspect, network,
# service and task lists, node inspect (Swarm mode), the event stream, and
# ping/version/info. Verified against traefik
# v3.7.12 pkg/provider/docker — pdocker.go (ServerVersion, Events,
# ContainerList), shared.go (ContainerInspect), pswarm.go (ServiceList,
# NetworkList, TaskList, NodeInspect).
#
# Deliberately does NOT allow the read-exfiltration paths that a
# "/containers/**" glob would swallow: /containers/{id}/archive,
# /containers/{id}/export, /containers/{id}/logs, /containers/{id}/attach.
# Traefik needs none of them, so this preset needs no
# insecure_allow_read_exfiltration acknowledgment. A client that genuinely
# needs container logs or archive has to add that rule AND set
# insecure_allow_read_exfiltration: true itself.

upstream:
  socket: /var/run/docker.sock

log:
  level: info
  format: json
  access_log: true

health:
  enabled: true
  path: /health

rules:
  # Health and metadata
  - match: { method: GET, path: "/_ping" }
    action: allow
  - match: { method: HEAD, path: "/_ping" }
    action: allow
  - match: { method: GET, path: "/version" }
    action: allow
  - match: { method: GET, path: "/info" }
    action: allow
  - match: { method: GET, path: "/events" }
    action: allow

  # Container reads — list + inspect only. A single "*" matches one path
  # segment, so the container-ID position cannot absorb a trailing
  # /archive, /export, /logs or /attach.
  - match: { method: GET, path: "/containers/json" }
    action: allow
  - match: { method: GET, path: "/containers/*/json" }
    action: allow

  # Network reads — list only
  - match: { method: GET, path: "/networks" }
    action: allow

  # Swarm reads — service and task list only
  - match: { method: GET, path: "/services" }
    action: allow
  - match: { method: GET, path: "/tasks" }
    action: allow

  # Swarm node inspect. traefik v3.7.12 pswarm.go parseTasks calls
  # NodeInspect for every task carrying a NodeID, on the default path
  # (listTasks is the else branch of `if dData.ExtraConf.LBSwarm`, and the
  # traefik.docker.lbswarm label defaults to false). Without this rule the
  # inspect fails, parseTasks returns an error, listTasks skips the task,
  # and the service ends up with no endpoints. Node list stays denied —
  # traefik never calls NodeList.
  - match: { method: GET, path: "/nodes/*" }
    action: allow

  # Deny everything else
  - match: { method: "*", path: "/**" }
    action: deny
    reason: "not allowed by traefik preset — read-only access only"
