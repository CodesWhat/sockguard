# Sockguard — Watchtower Preset
#
# Covers both Watchtower forks: containrrr/watchtower (archived, v1.7.1) and
# its maintained continuation nicholas-fedor/watchtower (v1.21.2). Verified
# against each fork's pkg/container/client.go. The shared recreate flow
# (container list/inspect, force-remove, create with copied network config,
# start, rename, exec lifecycle hooks, image inspect/pull/remove) is identical.
# The forks differ in a few calls:
#
#   - containrrr stops a container with ContainerKill (POST
#     /containers/{id}/kill, client.go:196), then after ContainerCreate calls
#     NetworkDisconnect (POST /networks/{id}/disconnect, client.go:278) for
#     the default network before re-attaching the copied networks with
#     NetworkConnect. This preset allows both routes. Kill applies to any
#     container unless owner labels are enabled, and allow_disconnect_force
#     is global (any container, any network) unless owner labels are on.
#   - nicholas-fedor stops with ContainerStop (POST /containers/{id}/stop) and
#     does not use kill or disconnect.
#   - nicholas-fedor issues POST /containers/{id}/update via SetNoRestartPolicy
#     to set RestartPolicy.Name="no" on the shutdown and failed-self-update
#     paths. containrrr never calls it, so the grant is simply unused there.
#     The fork's client also defines a generic UpdateContainer that would
#     submit Resources on that same route, but nothing in its update flow calls
#     it, so request_body.container_update below allows only the restart-policy
#     field and leaves allow_resource_updates unset (denied).
#   - nicholas-fedor reads GET /system/df (GetImageDiskUsage) only when its
#     image disk-usage thresholds are configured. That route is left commented
#     out below; enable it if you set those thresholds.
#
# Allows: ping/info, container list/inspect/lifecycle/recreate, image
#         inspect/pull/remove, exec lifecycle hooks, and network connect/disconnect.
# Denies: unused container/image/network reads and writes, volumes,
#         distribution, build, swarm, secrets, configs, and plugins.

upstream:
  socket: /var/run/docker.sock

log:
  level: info
  format: json
  access_log: true

health:
  enabled: true
  path: /health

# Watchtower's recreate flow inspects the running container, then submits the
# inspect payload back to dockerd via POST /containers/create. If sockguard
# clears Config.Env, the recreated container loses its original environment.
# Mount-path redaction replaces sensitive HostConfig.Binds sources with
# "<redacted>"; replaying such a bind makes dockerd reject the create with 400
# ("includes invalid characters for a local volume name"). Disable all three response
# redactions for this preset — they are mutually exclusive with the
# auto-updater use case this preset is designed for.
response:
  redact_mount_paths: false
  redact_container_env: false
  redact_network_topology: false

# Watchtower recreates containers and can use exec lifecycle hooks. Container
# creation is inspected by default, but bind-mounted workloads are denied until
# you allowlist their host paths here. Recreated containers may carry an
# explicit HostConfig.Runtime, so the stock runc runtime is allowlisted and
# other explicit runtimes are denied. Watchtower sets RestartPolicy.Name to
# "no" during shutdown and failed self-update paths; restart-policy updates are
# allowed while Moby's serialized zero-value Resources remain daemon no-ops and
# actual resource, privilege, device and capability updates stay denied. Modern
# Watchtower recreates copied endpoint settings with IPAddress and, for a
# user-configured MAC, MacAddress. Those two granular endpoint controls are
# allowed without opening links, driver options, link-local IPs or GwPriority.
# Image pulls are inspected too, with arbitrary registries allowed but fromSrc
# imports denied. Lifecycle-hook commands are arbitrary and default to the
# container's configured user. Sockguard treats an empty User as root, so root
# exec must be acknowledged in addition to the blind-write opt-in below.
request_body:
  container_remove:
    allow_force: true
    allow_remove_volumes: true
  container_create:
    # cgroup v1 hosts only (e.g. Synology): a recreate replays
    # HostConfig.CgroupnsMode "host", which is denied by default. Uncomment
    # to allow it only while GET /info reports CgroupVersion "1" on every
    # upstream endpoint (there "host" is the daemon default, so nothing widens).
    # allow_host_cgroupns_on_cgroup_v1: true
    allowed_bind_mounts: []
    allowed_runtimes:
      - runc
  container_update:
    allow_restart_policy: true
  exec:
    allow_privileged: false
    allow_root_user: true
  image_pull:
    allow_all_registries: true
  network:
    # containrrr force-disconnects the new container's default network
    # (NetworkDisconnect(..., force=true), client.go:278) before re-attaching.
    allow_disconnect_force: true
    endpoint_config:
      allow_static_addressing: true
      allow_mac_pinning: true

# If your lifecycle hooks are fixed commands, replace this with
# request_body.exec.allowed_commands and remove the unsafe opt-in.
insecure_allow_body_blind_writes: true

rules:
  # Moby client ping (HEAD with GET fallback) and daemon info.
  - match: { method: GET, path: "/_ping" }
    action: allow
  - match: { method: HEAD, path: "/_ping" }
    action: allow
  - match: { method: GET, path: "/info" }
    action: allow

  # Container discovery.
  - match: { method: GET, path: "/containers/json" }
    action: allow
  - match: { method: GET, path: "/containers/*/json" }
    action: allow

  # Container lifecycle and recreate.
  - match: { method: POST, path: "/containers/*/start" }
    action: allow
  - match: { method: POST, path: "/containers/*/stop" }
    action: allow
  # containrrr/watchtower stops containers with kill instead of stop.
  - match: { method: POST, path: "/containers/*/kill" }
    action: allow
  - match: { method: POST, path: "/containers/*/rename" }
    action: allow
  - match: { method: POST, path: "/containers/*/update" }
    action: allow
  - match: { method: DELETE, path: "/containers/*" }
    action: allow
  - match: { method: POST, path: "/containers/create" }
    action: allow

  # Exec (for lifecycle hooks: pre-update, post-update)
  - match: { method: POST, path: "/containers/*/exec" }
    action: allow
  - match: { method: POST, path: "/exec/*/start" }
    action: allow
  - match: { method: GET, path: "/exec/*/json" }
    action: allow

  # Image operations. Image names can contain slashes, so inspect needs **;
  # deny the zero-segment /images/json list form before that allow rule.
  - match: { method: GET, path: "/images/json" }
    action: deny
    reason: "watchtower does not list images"
  - match: { method: GET, path: "/images/**/json" }
    action: allow
  - match: { method: POST, path: "/images/create" }
    action: allow
  - match: { method: DELETE, path: "/images/*" }
    action: allow

  # Preserve secondary network attachments during recreate. containrrr
  # disconnects the default network from the new container before connecting
  # the copied ones.
  - match: { method: POST, path: "/networks/*/connect" }
    action: allow
  - match: { method: POST, path: "/networks/*/disconnect" }
    action: allow

  # Optional: nicholas-fedor/watchtower reads image disk usage only when disk
  # thresholds are configured. Uncomment to allow it.
  # - match: { method: GET, path: "/system/df" }
  #   action: allow

  # Deny everything else
  - match: { method: "*", path: "/**" }
    action: deny
    reason: "not allowed by watchtower preset"
