syntax = "proto3";

package moby.buildkit.secrets.v1;

// go_package is retargeted to sockguard's vendored-package layout so the
// generated Go code's import statements resolve inside this module; this is
// the ONLY deviation from the upstream file — see PROVENANCE.md.
option go_package = "github.com/codeswhat/sockguard/app/internal/buildkitproto/secrets;secrets";

service Secrets{
	rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
}


message GetSecretRequest {
	string ID = 1;
	map<string, string> annotations = 2;
}

message GetSecretResponse {
	bytes data = 1;
}
