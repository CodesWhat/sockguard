# Default values for the sockguard Helm chart.
# Override with --set or -f myvalues.yaml.

image:
  repository: codeswhat/sockguard
  # Leave empty before publication so the DaemonSet falls back to Chart.yaml's
  # appVersion. After the release images are live, the active development
  # branch pins appVersion@sha256:<multi-arch manifest-list digest>; see
  # RELEASING.md's Helm chart section. Override with --set image.tag=… to
  # track a different tag.
  tag: "2.0.0@sha256:000ccc47fd16c249072119f00ece90611b24e115655d6f9d618772ab08cdeeea"
  pullPolicy: IfNotPresent

# Path the liveness/readiness probes hit. Must match config.health.path below.
healthPath: /health

# Sockguard configuration — passed verbatim as sockguard.yaml via ConfigMap.
# The upstream socket must be /var/run/docker.sock because the DaemonSet
# mounts the host socket at that path.
config: |
  upstream:
    socket: /var/run/docker.sock

  listen:
    address: ":2375"
    insecure_allow_plain_tcp: true
    insecure_allow_unauthenticated_clients: true

  log:
    level: info
    format: json
    access_log: true

  health:
    enabled: true
    path: /health

  rules:
    - match: { method: GET, path: "/_ping" }
      action: allow
    - match: { method: HEAD, path: "/_ping" }
      action: allow
    - match: { method: GET, path: "/version" }
      action: allow
    - match: { method: GET, path: "/events" }
      action: allow
    - match: { method: "*", path: "/**" }
      action: deny
      reason: "no matching allow rule — override config in values.yaml"

# Optional out-of-band trust configuration for signed policy bundles. Reference
# exactly one externally managed object containing the trust YAML. It must be a
# different Kubernetes object from both the candidate and signature bundle.
# The chart mounts it separately and never copies its contents into the
# chart-generated candidate policy ConfigMap.
policyBundleTrust:
  secretRef: {}
    # name: sockguard-policy-trust
    # key: trust.yaml
  configMapRef: {}
    # name: sockguard-policy-trust
    # key: trust.yaml

# External sigstore bundle for the signed candidate policy. Configure this
# together with policyBundleTrust and set the candidate's
# policy_bundle.signature_path to the fixed mounted path:
# /etc/sockguard-policy-bundle-signature/signature.json
policyBundleSignature:
  secretRef: {}
    # name: sockguard-policy-signature
    # key: signature.json
  configMapRef: {}
    # name: sockguard-policy-signature
    # key: signature.json

# Service exposing sockguard within the cluster.
service:
  type: ClusterIP
  port: 2375
  # The default candidate YAML listens on plaintext TCP :2375 inside the pod
  # with both explicit acknowledgments. This is for trusted cluster-internal
  # traffic only. Configure listen.tls in config above for untrusted networks.

# Extra environment variables for unsigned deployments. Signed-policy mode
# intentionally discards SOCKGUARD_* overlays, so every setting that affects a
# signed deployment must live in the signed config above.
env: []

resources: {}
  # Recommended starting point:
  # requests:
  #   cpu: 10m
  #   memory: 32Mi
  # limits:
  #   cpu: 100m
  #   memory: 64Mi

# Pod-level securityContext. These defaults pin the image's Chainguard
# `nonroot` identity and explicitly select the runtime-default seccomp profile.
# The DaemonSet mounts /var/run/docker.sock, which is typically owned by a
# non-root "docker" group; add that GID as a supplemental group when needed:
#   supplementalGroups: [999]  # run `stat -c '%g' /var/run/docker.sock` on the host to find it
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# DaemonSet tolerations — tolerate control-plane nodes to proxy on every node.
tolerations: []
  # - key: node-role.kubernetes.io/control-plane
  #   operator: Exists
  #   effect: NoSchedule

nodeSelector: {}

affinity: {}
