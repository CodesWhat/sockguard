# examples/compose/dockge/docker-compose.yml
#
# Sockguard + Dockge, TCP mode (plain, private Docker network only).
# Dockge shells out to the docker CLI and the Compose plugin, which read
# DOCKER_HOST, and a TCP URL is the form they take here, so sockguard listens
# on plaintext TCP :2375 restricted to the compose-internal network. A
# non-loopback plaintext listener needs two insecure acknowledgments,
# SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP and
# SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS, set here only
# because the listener is bound to the Docker compose bridge. Never publish
# port 2375 to the host or the Internet.
#
# Dockge deploys stacks, so the dockge preset allows container, network and
# volume creation. It stamps everything Dockge creates with an owner label and
# scopes Dockge to those resources, inspects every container create, and
# limits bind mounts to /opt/stacks. It refuses exec, attach and builds.
#
# The stacks directory must be the same path inside and outside the Dockge
# container, and must match allowed_bind_mounts in sockguard.yaml.

services:
  sockguard:
    image: codeswhat/sockguard:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${DOCKER_SOCK_GID:?set to the GID of /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./sockguard.yaml:/etc/sockguard/sockguard.yaml:ro
    environment:
      - SOCKGUARD_LISTEN_ADDRESS=:2375
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP=true
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS=true
  # Do NOT expose port 2375 to the host, Dockge reaches sockguard
  # over the private compose network by service name.

  dockge:
    image: louislam/dockge:1.5.0
    restart: unless-stopped
    depends_on:
      - sockguard
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
      # Stacks directory: full path, identical on both sides.
      - /opt/stacks:/opt/stacks
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
      - DOCKER_HOST=tcp://sockguard:2375
