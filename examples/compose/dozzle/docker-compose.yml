# examples/compose/dozzle/docker-compose.yml
#
# Sockguard + Dozzle, TCP mode (plain, private Docker network only).
# Dozzle reaches Docker through DOCKER_HOST, which takes a TCP URL, so
# sockguard listens on plaintext TCP :2375 restricted to the compose-internal
# network. A non-loopback plaintext listener needs two insecure
# acknowledgments, SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP and
# SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS, set here only
# because the listener is bound to the Docker compose bridge. Never publish
# port 2375 to the host or the Internet.
#
# Dozzle's default view needs container list, inspect, logs, stats and
# events. The dozzle preset allows exactly those (plus ping, version and
# info) and nothing that creates, execs, or touches images, networks or
# volumes. Do not set DOZZLE_ENABLE_ACTIONS or DOZZLE_ENABLE_SHELL: the
# preset refuses what they need.

services:
  sockguard:
    image: codeswhat/sockguard:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${DOCKER_SOCK_GID:?set to the GID of /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./sockguard.yaml:/etc/sockguard/sockguard.yaml:ro
    environment:
      - SOCKGUARD_LISTEN_ADDRESS=:2375
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP=true
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS=true
  # Do NOT expose port 2375 to the host, Dozzle reaches sockguard
  # over the private compose network by service name.

  dozzle:
    image: amir20/dozzle:v11.5.0
    restart: unless-stopped
    depends_on:
      - sockguard
    ports:
      # Loopback only: Dozzle has no auth by default, and anyone who reaches the
      # UI can read every container's logs. Widen this only behind auth.
      - "127.0.0.1:8080:8080"
    environment:
      - DOCKER_HOST=tcp://sockguard:2375
