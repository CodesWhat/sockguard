# examples/compose/homarr/docker-compose.yml
#
# Sockguard + Homarr — TCP mode (plain, private Docker network only).
# Homarr reaches Docker through DOCKER_HOSTNAMES / DOCKER_PORTS, which are
# TCP-only, so sockguard listens on plaintext TCP :2375 restricted to the
# compose-internal network. A non-loopback plaintext listener needs two
# insecure acknowledgments — SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP and
# SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS — set here only
# because the listener is bound to the Docker compose bridge. Never publish
# port 2375 to the host or the Internet.
#
# Homarr needs container list, inspect, stats, logs and start/stop/restart/
# remove. The homarr preset allows exactly those and nothing that creates,
# execs, or touches images, networks or volumes.
#
# SECRET_ENCRYPTION_KEY encrypts Homarr's stored integration secrets. Generate
# one with: openssl rand -hex 32

services:
  sockguard:
    image: codeswhat/sockguard:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${DOCKER_SOCK_GID:?set to the GID of /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./sockguard.yaml:/etc/sockguard/sockguard.yaml:ro
    environment:
      - SOCKGUARD_LISTEN_ADDRESS=:2375
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP=true
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS=true
  # Do NOT expose port 2375 to the host — Homarr reaches sockguard
  # over the private compose network by service name.

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    depends_on:
      - sockguard
    ports:
      - "7575:7575"
    volumes:
      - homarr-appdata:/appdata
    environment:
      - DOCKER_HOSTNAMES=sockguard
      - DOCKER_PORTS=2375
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY:?set to the output of openssl rand -hex 32}

volumes:
  homarr-appdata:
