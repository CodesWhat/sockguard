# examples/compose/jenkins/docker-compose.yml
#
# Sockguard + a Jenkins controller using the Docker plugin, TCP mode (plain,
# private Docker network only). The plugin's Docker Host URI takes a TCP URL,
# so sockguard listens on plaintext TCP :2375 restricted to the compose-internal
# network. A non-loopback plaintext listener needs two insecure
# acknowledgments, SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP and
# SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS, set here only
# because the listener is bound to the Docker compose bridge. Never publish
# port 2375 to the host or the Internet.
#
# The jenkins preset covers agent provisioning with the Inbound (JNLP)
# connector: pull, create, start, stop and remove. It refuses exec, archive
# copy, published ports, bind mounts and any image outside allowed_images, so
# the Attach and SSH connectors and docker-workflow's inside() do not work.
# Set the agent template's image to the exact reference in allowed_images.

services:
  sockguard:
    image: codeswhat/sockguard:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${DOCKER_SOCK_GID:?set to the GID of /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./sockguard.yaml:/etc/sockguard/sockguard.yaml:ro
    environment:
      - SOCKGUARD_LISTEN_ADDRESS=:2375
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP=true
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS=true
  # Do NOT expose port 2375 to the host, Jenkins reaches sockguard
  # over the private compose network by service name.

  jenkins:
    image: jenkins/jenkins:2.580.3-lts-jdk21
    restart: unless-stopped
    depends_on:
      - sockguard
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
