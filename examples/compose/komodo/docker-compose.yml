# examples/compose/komodo/docker-compose.yml
#
# Sockguard + Komodo Periphery, TCP mode (plain, private Docker network only).
# Periphery reaches Docker through DOCKER_HOST (bollard's connect_with_defaults
# and the docker CLI both read it), which takes a TCP URL, so sockguard listens
# on plaintext TCP :2375 restricted to the compose-internal network. A
# non-loopback plaintext listener needs two insecure acknowledgments,
# SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP and
# SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS, set here only
# because the listener is bound to the Docker compose bridge. Never publish
# port 2375 to the host or the Internet.
#
# This is the monitoring-only setup: Komodo Core sees containers, images,
# networks, volumes, stats and logs. The komodo preset refuses deployments,
# stacks, builds, container actions and exec, so use Komodo for monitoring
# and keep deploys out of this Periphery.

services:
  sockguard:
    image: codeswhat/sockguard:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${DOCKER_SOCK_GID:?set to the GID of /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./sockguard.yaml:/etc/sockguard/sockguard.yaml:ro
    environment:
      - SOCKGUARD_LISTEN_ADDRESS=:2375
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP=true
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS=true
  # Do NOT expose port 2375 to the host, Periphery reaches sockguard
  # over the private compose network by service name.

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4
    init: true
    restart: unless-stopped
    depends_on:
      - sockguard
    environment:
      DOCKER_HOST: tcp://sockguard:2375
      PERIPHERY_CORE_ADDRESS: komodo.example.com
      PERIPHERY_CONNECT_AS: server-name
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      # The preset refuses exec and attach, so turn the features off.
      PERIPHERY_DISABLE_TERMINALS: "true"
      PERIPHERY_DISABLE_CONTAINER_EXEC: "true"
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - keys:/config/keys
      # Host process view for Periphery's system stats. No Docker socket here.
      - /proc:/proc
      - /etc/komodo:/etc/komodo

volumes:
  keys:
