# Sockguard config for Traefik — strict GET-only, no read-exfil opt-in.
#
# The rule set matches the bundled traefik preset (app/configs/traefik.yaml),
# which was narrowed to these same named paths and no longer carries
# insecure_allow_read_exfiltration: true. Both enumerate only the specific
# paths Traefik's Docker provider needs, so the exfiltration validator passes
# without any insecure opt-in. Update both files together.

upstream:
  socket: /var/run/docker.sock

log:
  level: info
  format: json
  access_log: true

health:
  enabled: true
  path: /health

rules:
  - match: { method: GET, path: "/_ping" }
    action: allow
  - match: { method: HEAD, path: "/_ping" }
    action: allow
  - match: { method: GET, path: "/version" }
    action: allow
  - match: { method: GET, path: "/info" }
    action: allow
  - match: { method: GET, path: "/events" }
    action: allow

  # Container reads — list + inspect only, no logs/archive/export/attach
  - match: { method: GET, path: "/containers/json" }
    action: allow
  - match: { method: GET, path: "/containers/*/json" }
    action: allow

  # Network reads — list + inspect
  - match: { method: GET, path: "/networks" }
    action: allow
  - match: { method: GET, path: "/networks/*" }
    action: allow

  # Service and task reads (for Swarm-mode Traefik)
  - match: { method: GET, path: "/services" }
    action: allow
  - match: { method: GET, path: "/services/*" }
    action: allow
  - match: { method: GET, path: "/tasks" }
    action: allow
  - match: { method: GET, path: "/tasks/*" }
    action: allow

  # Swarm node inspect. traefik v3.7.12 pswarm.go parseTasks calls
  # NodeInspect for every task carrying a NodeID, on the default path
  # (listTasks is the else branch of `if dData.ExtraConf.LBSwarm`, and the
  # traefik.docker.lbswarm label defaults to false). Without this rule the
  # inspect fails, parseTasks returns an error, listTasks skips the task,
  # and the service ends up with no endpoints. Node list stays denied —
  # traefik never calls NodeList.
  - match: { method: GET, path: "/nodes/*" }
    action: allow

  - match: { method: "*", path: "/**" }
    action: deny
    reason: "not allowed by traefik strict preset"
