---
# Lefthook configuration for sockguard monorepo.
#
# Pre-push pipeline (piped = sequential, fail-fast):
#   1. Clean-tree check (no stray artifacts before push)
#   2. GoReleaser snapshot dry-run (full release pipeline, skip publish)
#   3. Go lint + unit/race test
#   4. Compile integration and Podman build-tag boundaries
#   5. Go vulnerability scan (govulncheck — reachable CVEs in deps + stdlib)
#   6. Go fuzz smoke (5 s per fuzzer, all 8 fuzzers) — tier 0 of the
#      fuzz strategy. Catches broken fuzz drivers and stale seed corpora
#      before the push even leaves the machine. The real coverage tiers
#      are in `.github/workflows/ci-verify.yml` (60 s per fuzzer in a
#      matrix, on every PR/push), `quality-fuzz-nightly.yml` (15 min
#      per fuzzer, daily), and `quality-fuzz-monthly.yml` (1 h per
#      fuzzer, monthly + manual).
#   7. Lockfile dedupe check (catches orphaned hoisted packages)
#   8. Shellcheck (all tracked *.sh scripts)
#   9. Knip (unused files/exports/deps in TS workspaces)
#  10. Biome lint for TS/JS
#  11. TS workspace tests
#  12. Build all workspaces
#  13. Zizmor (workflow security) — hard-fails if the binary is missing;
#      this is a blocking local gate, not advisory-only.

pre-commit:
  piped: true
  commands:
    biome-fix:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: npx biome check --fix --no-errors-on-unmatched {staged_files} && git add {staged_files}
      priority: 1
    biome-format:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: npx biome format --write --no-errors-on-unmatched {staged_files} && git add {staged_files}
      priority: 2

commit-msg:
  commands:
    convention:
      run: node scripts/validate-commit-msg.mjs {1}
      fail_text: "Commit message does not follow Conventional Commits format"

pre-push:
  piped: true
  commands:
    clean-tree:
      run: |
        if ! git diff --quiet --exit-code || ! git diff --cached --quiet --exit-code; then
          echo "Uncommitted changes detected — commit or stash before pushing."
          exit 1
        fi
      fail_text: "Uncommitted changes detected"
      priority: 0
      timeout: 10s

    # Full release dry-run — mirrors what release-from-tag.yml runs in CI,
    # minus publish. Catches goreleaser config, build, archive, and dirty-tree
    # bugs locally before they surface in a tagged release. Uses the same
    # fixed adapter the GoReleaser Config CI gate runs.
    goreleaser-snapshot:
      run: ./scripts/ci/go-release-check.sh
      priority: 1
      timeout: 3m

    go-lint:
      run: ./scripts/ci/go-lint.sh
      priority: 2
      timeout: 1m

    go-test:
      run: cd app && go test -race ./...
      priority: 3
      timeout: 3m

    # Tagged integration packages have no default-build Go files, so the
    # ordinary ./... suite cannot catch cross-package type drift in them.
    # Compile both CI tag boundaries without running socket-dependent tests.
    go-tagged-compile:
      run: |
        cd app &&
        go test -run='^$' -tags=integration ./integration/... &&
        go test -run='^$' -tags=podmanintegration ./integration/... ./internal/cmd/...
      priority: 4
      timeout: 3m

    # govulncheck — flags known-vulnerable dependencies and stdlib CVEs
    # that are actually reachable from sockguard's code. `go vet` is
    # already clean; this closes the supply-chain loop before a push
    # leaves the machine. Skipped when govulncheck isn't installed,
    # matching the goreleaser/zizmor steps (install once with
    # `go install golang.org/x/vuln/cmd/govulncheck@latest`).
    govulncheck:
      run: cd app && govulncheck ./...
      skip:
        - run: '! command -v govulncheck >/dev/null 2>&1'
      priority: 5
      timeout: 2m

    # Fuzz smoke — 5 s per fuzzer, all 8 in series. Tier 0 of the fuzz
    # strategy: catches broken fuzz drivers and stale seed corpora before
    # the push leaves the machine. Real coverage (60 s, 15 min, 1 h)
    # happens in the ci-verify + quality-fuzz-{nightly,monthly} workflows.
    # Keep a finite Go watchdog above the tiny smoke budget so a hung input
    # fails with a stack dump instead of consuming the hook timeout. Retry the
    # known Go fuzztime-boundary flake once, matching the nightly workflow;
    # crashing inputs, watchdog timeouts, and every other failure stay fatal.
    go-fuzz:
      run: |
        cd app && set -e
        for entry in \
          "FuzzPathMatch ./internal/filter/" \
          "FuzzGlobToRegex ./internal/filter/" \
          "FuzzNormalizePath ./internal/filter/" \
          "FuzzCompileRule ./internal/filter/" \
          "FuzzLoadYAML ./internal/config/" \
          "FuzzProxyHeadersAndBody ./internal/proxy/" \
          "FuzzHijackHeadersAndBody ./internal/proxy/" \
          "FuzzHijackBidirectionalStream ./internal/proxy/"; do
          set -- $entry
          fuzzer="$1"
          package="$2"
          log="$(mktemp)"
          attempt=1

          while :; do
            rc=0
            go test -run='^$' -fuzz="^${fuzzer}\$" -fuzztime=5s -timeout=1m "${package}" >"${log}" 2>&1 || rc=$?
            cat "${log}"

            if [ "${rc}" -eq 0 ]; then
              break
            fi
            if grep -q "Failing input written to testdata" "${log}" || \
               grep -q "test timed out" "${log}" || \
               ! grep -q "context deadline exceeded" "${log}" || \
               [ "${attempt}" -ge 2 ]; then
              rm -f "${log}"
              exit "${rc}"
            fi

            echo "${fuzzer}: retrying known -fuzztime boundary flake once"
            attempt=2
          done

          rm -f "${log}"
        done
      priority: 6
      timeout: 2m

    # Lockfile hygiene — catches orphaned hoisted packages (e.g. a stale
    # next@15.5.15 left behind after a version bump) before they ship to
    # CI and surface as stale dependency-scan findings. Runs two probes and
    # tells them apart: an `npm install --dry-run` that still reports
    # changes means the local node_modules is stale (run `npm ci`), not
    # lockfile drift. Only once that probe is clean does `npm dedupe
    # --dry-run` get to mean anything, and only then do its changes get
    # reported as real drift. Both probes are non-mutating. Logic lives in
    # scripts/lockfile-dedupe.mjs so it has tests instead of being retyped
    # inline here.
    lockfile-dedupe:
      run: node scripts/lockfile-dedupe.mjs
      priority: 7
      timeout: 2m

    # Shellcheck — lints every tracked *.sh script. Hard-fails (no skip)
    # when the binary is missing; see scripts/ci/shellcheck.sh for the
    # install hint. Also runs in the CI shellcheck job, so this is not the
    # only place it's enforced.
    shellcheck:
      run: ./scripts/ci/shellcheck.sh
      priority: 8
      timeout: 30s

    # Knip — finds unused files, exports, types, and unlisted/unused
    # dependencies across the TS workspaces. Catches dead code and
    # phantom deps that biome/tsc don't see. Config in knip.json.
    knip:
      run: npx knip
      priority: 9
      timeout: 1m

    biome:
      run: npx biome check .
      priority: 10
      timeout: 30s

    ts-test:
      run: npm test
      priority: 11
      timeout: 1m

    build:
      run: npx turbo build
      priority: 12
      timeout: 3m

    # Zizmor — GitHub Actions workflow security scanner. Blocking local
    # gate: hard-fails with an install hint when the binary is missing,
    # matching the house pattern for tools CI enforces unconditionally
    # (see drydock's scripts/scan-secrets.sh for the same shape). Skipping
    # silently here would let a workflow-security regression reach CI
    # unnoticed.
    zizmor:
      glob: '.github/workflows/*.yml'
      run: |
        if ! command -v zizmor >/dev/null 2>&1; then
          echo "zizmor is required; install it (e.g. 'brew install zizmor' or 'cargo install zizmor') and re-run" >&2
          exit 1
        fi
        zizmor .github/workflows/
      priority: 13
      timeout: 30s
