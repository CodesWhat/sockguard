# scripts/dozzle-conformance/docker-compose.yml
#
# Harness stack for run.sh: published sockguard with app/configs/dozzle.yaml,
# published Dozzle, a marker container that prints a sentinel, and a probe
# that curls both over the private compose network. Nothing is published to
# the host and nothing bind-mounts a checkout path, so the same file works
# against a remote engine (the NAS test engine) as well as a CI runner.
# The config goes in through a seeded named volume for the same reason.

services:
  sockguard:
    image: ${SOCKGUARD_IMAGE:?set by run.sh}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${DOCKER_SOCK_GID:?set by run.sh}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - sockguard_config:/etc/sockguard:ro
    environment:
      - SOCKGUARD_LISTEN_ADDRESS=:2375
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP=true
      - SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS=true

  dozzle:
    image: ${DOZZLE_IMAGE:?set by run.sh}
    depends_on:
      - sockguard
    environment:
      - DOCKER_HOST=tcp://sockguard:2375
      - DOZZLE_LEVEL=debug

  marker:
    image: ${PROBE_IMAGE:?set by run.sh}
    container_name: ${MARKER_NAME:?set by run.sh}
    entrypoint:
      - sh
      - -c
      - 'while true; do echo "$$SENTINEL"; sleep 1; done'
    environment:
      - SENTINEL=${SENTINEL:?set by run.sh}

  probe:
    image: ${PROBE_IMAGE:?set by run.sh}
    entrypoint:
      - sleep
      - "3600"

volumes:
  # Seeded by run.sh with `docker cp`, which works against a remote engine
  # where a bind-mounted or compose-injected config file would not resolve.
  sockguard_config:
    external: true
    name: ${CONFIG_VOLUME:?set by run.sh}
